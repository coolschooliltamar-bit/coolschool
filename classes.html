const CUSTOM_ICONS = ['📘', '🧭', '🗣️', '🧠', '🌱', '🛠️', '🎭', '🧘', '📊', '🕍'];
const CUSTOM_COLORS = ['#0D9488', '#9333EA', '#E11D48', '#CA8A04', '#2563EB', '#16A34A'];

// Weekly hours per subject – a starting point the principal can change
const TEMPLATES = {
  junior: { math: 5, english: 4, hebrew: 3, literature: 2, bible: 3, history: 2, geography: 1, science: 4, pe: 2, art: 1, music: 1, homeroom: 1 },
  senior: { math: 5, english: 5, hebrew: 2, literature: 2, bible: 2, history: 2, civics: 2, biology: 3, chemistry: 2, physics: 2, computers: 1, pe: 2, homeroom: 1 },
};
function templateFor(grade) { return grade <= 9 ? TEMPLATES.junior : TEMPLATES.senior; }
function defaultEnds(grade) { return grade <= 9 ? [14, 15, 14, 15, 12] : [15, 15, 15, 15, 12]; }

function seedSchool() {
  const sections = [];
  GRADES.forEach(g => { for (let n = 1; n <= 3; n++) sections.push({ id: `g${g}-${n}`, grade: g, num: n }); });
  const plans = {};
  sections.forEach(s => {
    plans[s.id] = { subjects: Object.entries(templateFor(s.grade)).map(([key, hours]) => ({ key, hours, teacher: '' })), ends: defaultEnds(s.grade) };
  });
  return { sections, plans, schedules: {}, customSubjects: [], prefs: { doubles: true, groupRelated: true, maxPerDay: 2 } };
}
let school = load(SC_KEY, null) || seedSchool();
// older saves: no breaks or same-time subjects yet
school.breaks = school.breaks || {};
school.prefs = { doubles: true, groupRelated: true, maxPerDay: 2, ...(school.prefs || {}) };
if (!Array.isArray(school.prefs.syncSubjects)) school.prefs.syncSubjects = ['math', 'english'];
function saveSchool() { save(SC_KEY, school); }

const cm = {
  tab: 'classes',
  selected: null,          // class whose schedule is open
  cell: null,              // { day, hour } being edited
  genSel: new Set(),       // classes chosen for the generator
  planFor: null,           // class whose subjects are being edited in the generator
  lastRun: null,           // generator report
  newSubject: null,        // draft for a custom subject
};

/* ---------- Lookups ---------- */
function allSubjects() { return BASE_SUBJECTS.concat(school.customSubjects || []); }
function subj(key) { return allSubjects().find(s => s.key === key) || { key, he: key, en: key, icon: '📘', color: '#64748B', group: 'other' }; }
function subjName(key) { const s = subj(key); return L(s.he, s.en); }
function section(id) { return school.sections.find(s => s.id === id); }
function sectionLabel(s) { return s ? (isHe() ? `${GRADE_HE[s.grade]} ${s.num}` : `${s.grade}-${s.num}`) : ''; }
function gradeLabel(g) { return L(`שכבה ${GRADE_HE[g]}`, `Grade ${g}`); }
function gradeSections(g) { return school.sections.filter(s => s.grade === g).sort((a, b) => a.num - b.num); }
function plan(id) {
  if (!school.plans[id]) {
    const s = section(id);
    school.plans[id] = { subjects: Object.entries(templateFor(s ? s.grade : 10)).map(([key, hours]) => ({ key, hours, teacher: '' })), ends: defaultEnds(s ? s.grade : 10) };
  }
  const p = school.plans[id];
  if (!p.starts) p.starts = [DAY_START, DAY_START, DAY_START, DAY_START, DAY_START];
  return p;
}
/* Breaks belong to a whole grade: { day: 'all' | 0–4, hour } – that hour has no lessons */
function gradeBreaks(g) { return school.breaks[g] || []; }
function isBreak(g, d, h) { return gradeBreaks(g).some(b => b.hour === h && (b.day === 'all' || b.day === d)); }
// The hours a class can have lessons on a day: from its start to its end, without the grade's breaks
function lessonHours(id, d) {
  const p = plan(id), s = section(id), out = [];
  for (let h = p.starts[d]; h < p.ends[d]; h++) if (!s || !isBreak(s.grade, d, h)) out.push(h);
  return out;
}
function schedule(id) { return school.schedules[id] || []; }
function capacity(id) { return [0, 1, 2, 3, 4].reduce((sum, d) => sum + lessonHours(id, d).length, 0); }
function requiredHours(id) { return plan(id).subjects.reduce((sum, x) => sum + (Number(x.hours) || 0), 0); }
function lessonAt(id, day, hour) { return schedule(id).find(l => l.day === day && l.hour === hour) || null; }
function teacherOf(id, key) { const x = plan(id).subjects.find(p => p.key === key); return x ? x.teacher || '' : ''; }

/* ================= Classes: grades 7–12 and their sections ================= */
function addSection(grade) {
  const nums = gradeSections(grade).map(s => s.num);
  if (nums.length >= MAX_SECTIONS) { toast(L(`עד ${MAX_SECTIONS} כיתות בשכבה`, `Up to ${MAX_SECTIONS} classes per grade`)); return; }
  let num = 1;
  while (nums.includes(num)) num++;
  const s = { id: `g${grade}-${num}-${Date.now().toString(36)}`, grade, num };
  school.sections.push(s);
  plan(s.id);
  saveSchool();
  cm.selected = s.id;
  renderPage();
  toast(L(`נוספה כיתה ${sectionLabel(s)}`, `Added class ${sectionLabel(s)}`));
}
function removeSection(id) {
  const s = section(id);
  if (!s || !confirm(L(`למחוק את כיתה ${sectionLabel(s)} ואת המערכת שלה?`, `Delete class ${sectionLabel(s)} and its schedule?`))) return;
  school.sections = school.sections.filter(x => x.id !== id);
  delete school.plans[id];
  delete school.schedules[id];
  cm.genSel.delete(id);
  if (cm.selected === id) cm.selected = null;
  if (cm.planFor === id) cm.planFor = null;
  saveSchool();
  renderPage();
}
function selectClass(id) {
  cm.selected = cm.selected === id ? null : id;
  cm.cell = null;
  renderPage();
  if (cm.selected) document.getElementById('class-view')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function classesTab() {
  return `
  <div class="card r-3xl p-5">
    <div class="flex items-center justify-between wrap gap-2 mb-4">
      <div>
        <h2 class="display w8 lg">🏫 ${L('הכיתות בבית הספר', 'Classes in the school')}</h2>
        <p class="xs muted mt-1">${L('לחצו על כיתה כדי לראות את המערכת שלה. אפשר להוסיף כיתות מקבילות לכל שכבה.', 'Click a class to see its schedule. Add parallel classes to any grade as needed.')}</p>
      </div>
      <span class="xs w7 muted">${L(`${school.sections.length} כיתות`, `${school.sections.length} classes`)}</span>
    </div>
    <div class="col" style="gap:0.5rem">
      ${GRADES.map(g => `
        <div class="grade-row">
          <div class="grade-name"><span class="w8">${gradeLabel(g)}</span><span class="xs muted">${L(`${gradeSections(g).length} כיתות`, `${gradeSections(g).length} classes`)}</span></div>
          <div class="flex wrap gap-2 flex-1">
            ${gradeSections(g).map(s => {
              const filled = schedule(s.id).length;
              return `<span class="sec-chip ${cm.selected === s.id ? 'on' : ''}">
                <button class="sec-open" onclick="selectClass('${s.id}')" aria-pressed="${cm.selected === s.id}">
                  <span class="w8">${sectionLabel(s)}</span>
                  <span class="sec-dot ${filled ? 'ok' : ''}" title="${filled ? L('יש מערכת', 'Has a schedule') : L('אין עדיין מערכת', 'No schedule yet')}"></span>
                </button>
                <button class="sec-del" onclick="removeSection('${s.id}')" aria-label="${L('מחיקת כיתה', 'Delete class')} ${sectionLabel(s)}">×</button>
              </span>`;
            }).join('')}
            <button class="sec-add" onclick="addSection(${g})">＋ ${L('כיתה', 'Class')}</button>
          </div>
        </div>`).join('')}
    </div>
  </div>
  ${cm.selected && section(cm.selected) ? classView(cm.selected) : `<p class="sm muted text-center">${L('בחרו כיתה כדי לראות את מערכת השעות שלה.', 'Choose a class to see its timetable.')}</p>`}`;
}

/* ---------- One class's weekly schedule ---------- */
function classView(id) {
  const s = section(id);
  const p = plan(id);
  const firstStart = Math.min(...p.starts);
  const lastEnd = Math.max(...p.ends, firstStart + 1);
  const hours = [];
  for (let h = firstStart; h < lastEnd; h++) hours.push(h);
  const outsideHours = (d, h) => h < p.starts[d] || h >= p.ends[d];
  const outside = schedule(id).filter(l => outsideHours(l.day, l.hour) || isBreak(s.grade, l.day, l.hour));
  const placed = {};
  schedule(id).forEach(l => { placed[l.subject] = (placed[l.subject] || 0) + 1; });
  const keys = [...new Set(p.subjects.filter(x => x.hours > 0).map(x => x.key).concat(Object.keys(placed)))];
  return `
  <div class="card r-3xl p-5 fade-up" id="class-view">
    <div class="flex items-start justify-between wrap gap-3 mb-4">
      <div>
        <h2 class="display w8 xl">${L('מערכת שעות', 'Timetable')} · ${sectionLabel(s)}</h2>
        <p class="xs muted mt-1">${L(`${schedule(id).length} שיעורים בשבוע · ${capacity(id)} שעות לימוד לפי שעות ההתחלה, הסיום וההפסקות`, `${schedule(id).length} lessons a week · ${capacity(id)} teaching hours by start, end and break times`)}</p>
      </div>
      <div class="flex gap-2 wrap">
        <button class="btn btn-soft btn-sm" onclick="cm.tab='hours';renderPage()">🕒 ${L('שעות והפסקות', 'Hours & breaks')}</button>
        <button class="btn btn-primary btn-sm" onclick="startGeneratorFor('${id}')">⚙️ ${L('יצירה אוטומטית', 'Generate')}</button>
        ${schedule(id).length ? `<button class="btn btn-sm" style="background:#F43F5E1a;color:#F43F5E" onclick="clearSchedule('${id}')">${L('ניקוי', 'Clear')}</button>` : ''}
      </div>
    </div>
    ${outside.length ? `<div class="warn-box mb-3">⚠️ ${L(`${outside.length} שיעורים נמצאים מחוץ לשעות הלימודים או בהפסקה`, `${outside.length} lesson${outside.length === 1 ? ' is' : 's are'} outside school hours or in a break`)}</div>` : ''}
    <div class="cs-grid-wrap">
      <table class="cs-grid">
        <thead><tr><th></th>${DAY_NAMES.en.map((_, d) => `<th>${dayName(d)}<div class="xs muted w6 mono">${p.starts[d]}:00–${p.ends[d]}:00</div></th>`).join('')}</tr></thead>
        <tbody>
          ${hours.map(h => `<tr>
            <th class="mono xs muted">${h}:00</th>
            ${DAY_NAMES.en.map((_, d) => {
              const l = lessonAt(id, d, h);
              const brk = isBreak(s.grade, d, h);
              const after = outsideHours(d, h) || brk;
              if (!l && brk && !outsideHours(d, h)) return `<td class="brk"><span class="xs w7">🔔 ${L('הפסקה', 'Break')}</span></td>`;
              if (!l) return `<td class="${after ? 'after' : ''}">${after ? '' : `<button class="cs-empty" onclick="editCell('${id}', ${d}, ${h})" aria-label="${dayName(d)} ${h}:00 – ${L('הוספת שיעור', 'add a lesson')}">＋</button>`}</td>`;
              const x = subj(l.subject);
              const teacher = l.teacher || teacherOf(id, l.subject);
              return `<td class="${after ? 'after' : ''}"><button class="cs-lesson ${after ? 'bad' : ''} ${l.together ? 'together' : ''}" style="--c:${x.color}" onclick="editCell('${id}', ${d}, ${h})" ${l.together ? `title="${L('באותה שעה בכל השכבה', 'Same time for the whole grade')}"` : ''}>
                <span class="w7 xs">${x.icon} ${esc(subjName(l.subject))}${l.together ? ' 👥' : ''}</span>${teacher ? `<span class="xs muted truncate">${esc(teacher)}</span>` : ''}</button></td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="mt-4">
      <div class="xs w7 muted mb-2">${L('שעות לפי מקצוע (בפועל / נדרש)', 'Hours per subject (scheduled / required)')}</div>
      <div class="flex wrap gap-2">
        ${keys.map(k => {
          const need = (p.subjects.find(x => x.key === k) || {}).hours || 0;
          const got = placed[k] || 0;
          return `<span class="hours-chip ${got === need ? 'ok' : 'off'}">${subj(k).icon} ${esc(subjName(k))} <b class="mono">${got}/${need}</b></span>`;
        }).join('') || `<span class="xs muted">${L('לא הוגדרו מקצועות לכיתה הזו.', 'No subjects set for this class.')}</span>`}
      </div>
    </div>
  </div>
  ${cm.cell ? cellEditor(id) : ''}`;
}
function clearSchedule(id) {
  if (!confirm(L(`לנקות את כל המערכת של ${sectionLabel(section(id))}?`, `Clear the whole schedule of ${sectionLabel(section(id))}?`))) return;
  delete school.schedules[id];
  saveSchool();
  renderPage();
}

/* ---------- Edit one hour by hand ---------- */
function editCell(id, day, hour) { cm.cell = { id, day, hour }; renderPage(); }
function cellEditor(id) {
  const { day, hour } = cm.cell;
  const l = lessonAt(id, day, hour);
  const p = plan(id);
  const options = [...new Set(p.subjects.map(x => x.key).concat(allSubjects().map(x => x.key)))];
  const busy = l ? lessonClash(id, l.subject, l.teacher || teacherOf(id, l.subject), day, hour) : null;
  return `
  <div class="modal-bg" onmousedown="if(event.target===this){cm.cell=null;renderPage()}">
    <div class="card r-3xl p-6 modal fade-up" role="dialog" aria-label="${L('עריכת שיעור', 'Edit lesson')}">
      <div class="flex items-center justify-between mb-4">
        <h3 class="display w8 lg">${sectionLabel(section(id))} · ${dayName(day)} ${timeRange(hour, hour + 1)}</h3>
        <button class="icon-btn" style="width:2rem;height:2rem" onclick="cm.cell=null;renderPage()" aria-label="${L('סגירה', 'Close')}">${ICONS.close}</button>
      </div>
      <label class="label" for="cell-subject">${L('מקצוע', 'Subject')}</label>
      <select id="cell-subject" class="input mb-3">
        <option value="">— ${L('שעה פנויה', 'Free period')} —</option>
        ${options.map(k => `<option value="${k}" ${l && l.subject === k ? 'selected' : ''}>${subj(k).icon} ${esc(subjName(k))}${p.subjects.some(x => x.key === k && x.hours > 0) ? '' : ' ·'}</option>`).join('')}
      </select>
      <label class="label" for="cell-teacher">${L('מורה (לא חובה)', 'Teacher (optional)')}</label>
      <input id="cell-teacher" class="input" value="${esc(l ? l.teacher || '' : '')}" placeholder="${l ? esc(teacherOf(id, l.subject)) : ''}">
      ${busy ? `<div class="warn-box mt-3">⚠️ ${clashText(busy)}</div>` : ''}
      <div class="flex justify-end gap-2 mt-5">
        <button class="btn surface" onclick="cm.cell=null;renderPage()">${L('ביטול', 'Cancel')}</button>
        <button class="btn btn-primary" onclick="saveCell()">${L('שמירה', 'Save')}</button>
      </div>
    </div>
  </div>`;
}
/* Two classes can't have the same lesson at the same hour – unless different teachers are named.
   Subjects set to "same time for the whole grade" are the exception inside that grade. */
function sameTimeSubject(key) { return school.prefs.syncSubjects.includes(key); }
function lessonClash(id, subject, teacher, day, hour) {
  const me = section(id);
  const t = (teacher || '').trim().toLowerCase();
  for (const s of school.sections) {
    if (s.id === id) continue;
    const l = lessonAt(s.id, day, hour);
    if (!l) continue;
    const other = (l.teacher || teacherOf(s.id, l.subject)).trim().toLowerCase();
    if (t && other === t) return { id: s.id, teacher: teacher.trim(), kind: 'teacher' };
    if (l.subject === subject && (!t || !other) && !(sameTimeSubject(subject) && me && s.grade === me.grade)) return { id: s.id, subject, kind: 'subject' };
  }
  return null;
}
function clashText(c) {
  return c.kind === 'teacher'
    ? L(`${esc(c.teacher)} מלמד/ת באותה שעה ב־${sectionLabel(section(c.id))}`, `${esc(c.teacher)} is teaching ${sectionLabel(section(c.id))} at this time`)
    : L(`ל־${sectionLabel(section(c.id))} יש ${esc(subjName(c.subject))} באותה שעה. אותו שיעור בשתי כיתות במקביל – רק עם מורים שונים (רשמו מורה).`, `${sectionLabel(section(c.id))} has ${esc(subjName(c.subject))} at this time. The same lesson in two classes at once needs different teachers (add a teacher).`);
}
function saveCell() {
  const { id, day, hour } = cm.cell;
  const key = document.getElementById('cell-subject').value;
  const teacher = document.getElementById('cell-teacher').value.trim();
  const list = schedule(id).filter(l => !(l.day === day && l.hour === hour));
  if (key) list.push({ day, hour, subject: key, ...(teacher ? { teacher } : {}) });
  school.schedules[id] = list;
  saveSchool();
  cm.cell = null;
  renderPage();
  const clash = key ? lessonClash(id, key, teacher || teacherOf(id, key), day, hour) : null;
  toast(clash ? L('נשמר – שימו לב להתנגשות', 'Saved – note the clash') : L('נשמר', 'Saved'));
  if (clash) { cm.cell = { id, day, hour }; renderPage(); }
}

/* ================= Start/end times and breaks ================= */
function setTime(id, field, day, value) {
  const p = plan(id);
  p[field][day] = Number(value);
  if (p.starts[day] >= p.ends[day]) {
    if (field === 'starts') p.ends[day] = p.starts[day] + 1; else p.starts[day] = p.ends[day] - 1;
  }
  saveSchool();
  renderPage();
}
function setGradeHours(grade) {
  const start = Number(document.getElementById('bulk-start-' + grade).value);
  const end = Number(document.getElementById('bulk-end-' + grade).value);
  if (start >= end) { toast(L('שעת ההתחלה חייבת להיות לפני שעת הסיום', 'The start must be before the end')); return; }
  gradeSections(grade).forEach(s => {
    const p = plan(s.id);
    p.starts = p.starts.map(() => start);
    p.ends = p.ends.map((e, d) => (d === 4 ? Math.max(start + 1, Math.min(e, end)) : end));
  });
  saveSchool();
  renderPage();
  toast(L(`${gradeLabel(grade)}: ${start}:00–${end}:00 (יום שישי לא מתארך)`, `${gradeLabel(grade)}: ${start}:00–${end}:00 (Friday is not made longer)`));
}
function addBreak(grade) {
  const hour = Number(document.getElementById('brk-hour-' + grade).value);
  const dv = document.getElementById('brk-day-' + grade).value;
  const day = dv === 'all' ? 'all' : Number(dv);
  const list = school.breaks[grade] || (school.breaks[grade] = []);
  if (list.some(b => b.hour === hour && (b.day === day || b.day === 'all'))) { toast(L('ההפסקה הזו כבר קיימת', 'That break already exists')); return; }
  list.push({ day, hour });
  list.sort((a, b) => a.hour - b.hour);
  saveSchool();
  renderPage();
}
function removeBreak(grade, i) {
  (school.breaks[grade] || []).splice(i, 1);
  saveSchool();
  renderPage();
}
function hoursTab() {
  const timeSel = (id, field, d, value, choices) => `<select class="input input-sm" aria-label="${sectionLabel(section(id))} ${dayName(d)} ${field === 'starts' ? L('התחלה', 'start') : L('סיום', 'end')}" onchange="setTime('${id}', '${field}', ${d}, this.value)">
    ${choices.map(h => `<option value="${h}" ${h === value ? 'selected' : ''}>${h}:00</option>`).join('')}</select>`;
  return `
  <div class="card r-3xl p-5">
    <h2 class="display w8 lg">🕒 ${L('שעות לימוד והפסקות', 'School hours & breaks')}</h2>
    <p class="xs muted mt-1 mb-4">${L('לכל כיתה – שעת התחלה ושעת סיום בכל יום. ההפסקות נקבעות לכל השכבה, וכל שכבה יכולה לקבל שעות הפסקה אחרות. המחולל לא ישבץ שיעורים מחוץ לשעות או בהפסקה.', 'Each class has a start and an end time for each day. Breaks are set for a whole grade, and each grade can have its own break times. The generator never places lessons outside these hours or in a break.')}</p>
    ${GRADES.map(g => `
      <div class="hours-grade">
        <div class="flex items-center justify-between wrap gap-2 mb-2">
          <h3 class="w8">${gradeLabel(g)}</h3>
          <div class="flex items-center gap-2 wrap">
            <span class="xs muted">${L('לכל השכבה:', 'Whole grade:')}</span>
            <select id="bulk-start-${g}" class="input input-sm" aria-label="${L('שעת התחלה לכל השכבה', 'Start time for the whole grade')}">${START_CHOICES.map(h => `<option value="${h}" ${h === 8 ? 'selected' : ''}>${h}:00</option>`).join('')}</select>
            <span class="xs muted">–</span>
            <select id="bulk-end-${g}" class="input input-sm" aria-label="${L('שעת סיום לכל השכבה', 'End time for the whole grade')}">${END_CHOICES.map(h => `<option value="${h}" ${h === 15 ? 'selected' : ''}>${h}:00</option>`).join('')}</select>
            <button class="btn btn-soft btn-sm" onclick="setGradeHours(${g})">${L('החלה', 'Apply')}</button>
          </div>
        </div>
        <div class="brk-bar">
          <span class="xs w8">🔔 ${L('הפסקות השכבה:', 'Grade breaks:')}</span>
          ${gradeBreaks(g).map((b, i) => `<span class="brk-chip">${timeRange(b.hour, b.hour + 1)} · ${b.day === 'all' ? L('כל יום', 'every day') : dayName(b.day)}
            <button onclick="removeBreak(${g}, ${i})" aria-label="${L('מחיקת הפסקה', 'Remove break')}">×</button></span>`).join('') || `<span class="xs muted">${L('אין הפסקות', 'No breaks')}</span>`}
          <span class="flex items-center gap-1 wrap" style="margin-inline-start:auto">
            <select id="brk-hour-${g}" class="input input-sm" aria-label="${L('שעת ההפסקה', 'Break time')}">${BREAK_CHOICES.map(h => `<option value="${h}" ${h === 10 ? 'selected' : ''}>${h}:00–${h + 1}:00</option>`).join('')}</select>
            <select id="brk-day-${g}" class="input input-sm" aria-label="${L('יום', 'Day')}"><option value="all">${L('כל יום', 'Every day')}</option>${[0, 1, 2, 3, 4].map(d => `<option value="${d}">${dayName(d)}</option>`).join('')}</select>
            <button class="btn btn-soft btn-sm" onclick="addBreak(${g})">＋ ${L('הפסקה', 'Break')}</button>
          </span>

function startGeneratorFor(id) {
  cm.genSel = new Set([id]);
  cm.planFor = id;
  cm.tab = 'generate';
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toggleGen(id) { cm.genSel.has(id) ? cm.genSel.delete(id) : cm.genSel.add(id); if (!cm.planFor || !cm.genSel.has(cm.planFor)) cm.planFor = [...cm.genSel][0] || null; renderPage(); }
function toggleGenGrade(g) {
  const ids = gradeSections(g).map(s => s.id);
  const all = ids.every(id => cm.genSel.has(id));
  ids.forEach(id => (all ? cm.genSel.delete(id) : cm.genSel.add(id)));
  if (!cm.planFor || !cm.genSel.has(cm.planFor)) cm.planFor = [...cm.genSel][0] || null;
  renderPage();
}
function genAll(on) { cm.genSel = new Set(on ? school.sections.map(s => s.id) : []); cm.planFor = on ? school.sections[0].id : null; renderPage(); }

function setHours(key, value) {
  const v = Math.max(0, Math.min(12, Math.round(Number(value) || 0)));
  const row = plan(cm.planFor).subjects.find(x => x.key === key);
  if (row) row.hours = v;
  saveSchool();
  rerenderKeepingFocus();
}
function setTeacher(key, value) {
  const row = plan(cm.planFor).subjects.find(x => x.key === key);
  if (row) row.teacher = value.trim();
  saveSchool();
}
function removePlanSubject(key) {
  plan(cm.planFor).subjects = plan(cm.planFor).subjects.filter(x => x.key !== key);
  saveSchool();
  renderPage();
}
function addPlanSubject(key) {
  if (!key) return;
  if (!plan(cm.planFor).subjects.some(x => x.key === key)) plan(cm.planFor).subjects.push({ key, hours: 1, teacher: '' });
  saveSchool();
  renderPage();
}
function loadTemplate() {
  const s = section(cm.planFor);
  const keep = Object.fromEntries(plan(cm.planFor).subjects.map(x => [x.key, x.teacher]));
  plan(cm.planFor).subjects = Object.entries(templateFor(s.grade)).map(([key, hours]) => ({ key, hours, teacher: keep[key] || '' }));
  saveSchool();
  renderPage();
  toast(L('נטענה תוכנית ברירת המחדל לשכבה', 'Loaded the default plan for this grade'));
}
// Same subjects and hours for the other chosen classes of this grade (teachers stay per class)
function copyPlanToGrade() {
  const src = section(cm.planFor);
  const targets = [...cm.genSel].map(section).filter(s => s && s.grade === src.grade && s.id !== src.id);
  if (!targets.length) { toast(L('לא נבחרו כיתות נוספות בשכבה הזו', 'No other chosen classes in this grade')); return; }
  targets.forEach(t => {
    const teachers = Object.fromEntries(plan(t.id).subjects.map(x => [x.key, x.teacher]));
    plan(t.id).subjects = plan(src.id).subjects.map(x => ({ key: x.key, hours: x.hours, teacher: teachers[x.key] || '' }));
  });
  saveSchool();
  renderPage();
  toast(L(`הועתק ל־${targets.map(sectionLabel).join(', ')}`, `Copied to ${targets.map(sectionLabel).join(', ')}`));
}
function rerenderKeepingFocus() {
  const id = document.activeElement && document.activeElement.id;
  renderPage();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); if (el.select) el.select(); } }
}

/* ================= Generator: the algorithm =================
   Greedy placement repeated with different random orders; the attempt that places
   the most hours (then has the fewest gaps and best grouping) wins. Hard rules: the
   class's end time each day, one lesson per hour, a teacher in one class at a time,
   and the per-day cap for a subject. Preferences only change the score. */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rand) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function unitsFor(subject, n, teacher, hours, prefs) {
  const units = [];
  if (prefs.doubles && n >= 3 && prefs.maxPerDay >= 2) {
    const pairs = Math.floor(n / 2);
    for (let i = 0; i < pairs; i++) units.push({ subject, len: 2, teacher, hours });
    n -= pairs * 2;
  }
  for (let i = 0; i < n; i++) units.push({ subject, len: 1, teacher, hours });
  return units;
}
function buildUnits(id, prefs, reserved) {
  const units = [];
  plan(id).subjects.forEach(r => {
    const n = (Number(r.hours) || 0) - ((reserved && reserved[r.key]) || 0);
    if (n > 0) units.push(...unitsFor(r.key, n, (r.teacher || '').trim(), r.hours, prefs));
  });
  return units;
}
// What an hour is booked under: the named teacher, or – with no teacher – the subject itself
function bookingKey(subject, teacher, d, h) { return teacher ? `t:${teacher.toLowerCase()}|${d}|${h}` : `s:${subject}|${d}|${h}`; }

/* Grade-wide subjects (same time in every class of the grade) are placed first, then
   each class's other lessons. Hard rules: start/end times, grade breaks, one lesson per
   hour, no teacher in two places, and the same lesson in two classes at once only with
   different teachers. Preferences only change the score; the best of many attempts wins. */
function attempt(ids, prefs, seed, busyFixed) {
  const rand = rng(seed);
  const busy = new Set(busyFixed);
  const grids = {}, result = {}, allowed = {}, reserved = {};
  const syncReport = [];
  let penalty = 0;
  ids.forEach(id => {
    grids[id] = [0, 1, 2, 3, 4].map(() => ({}));
    allowed[id] = [0, 1, 2, 3, 4].map(d => lessonHours(id, d));
    result[id] = [];
    reserved[id] = {};
  });
  const dayFits = (id, d, h, u) => {
    for (let k = 0; k < u.len; k++) if (!allowed[id][d].includes(h + k) || grids[id][d][h + k]) return false;
    return Object.values(grids[id][d]).filter(x => x === u.subject).length + u.len <= prefs.maxPerDay;
  };
  const free = (subject, teacher, d, h, len) => {
    for (let k = 0; k < len; k++) if (busy.has(bookingKey(subject, teacher, d, h + k))) return false;
    return true;
  };
  const scoreFor = (id, d, h, u) => {
    const grid = grids[id][d];
    const dayLessons = Object.values(grid);
    const open = allowed[id][d].filter(x => !grid[x]);
    let score = Math.max(0, open.indexOf(h)) * 3;                          // keep the day without holes
    score += (dayLessons.length / Math.max(1, allowed[id][d].length)) * 4;  // spread over the week
    if (dayLessons.includes(u.subject)) score += 5;
    if (prefs.groupRelated) {
      const group = subj(u.subject).group;
      if (dayLessons.some(k => k !== u.subject && subj(k).group === group)) score -= 3;
      if ([grid[h - 1], grid[h + u.len]].some(k => k && k !== u.subject && subj(k).group === group)) score -= 2;
    }
    return score;
  };
  const put = (id, d, h, u) => {
    for (let k = 0; k < u.len; k++) {
      grids[id][d][h + k] = u.subject;
      result[id].push({ day: d, hour: h + k, subject: u.subject, ...(u.together ? { together: true } : {}) });
      busy.add(bookingKey(u.subject, u.teacher, d, h + k));
    }
  };

  // 1. grade-wide subjects: one slot for every class of the grade at once
  [...new Set(ids.map(id => section(id).grade))].forEach(g => {
    const secs = ids.filter(id => section(id).grade === g);
    prefs.syncSubjects.forEach(key => {
      const rows = secs.map(id => ({ id, row: plan(id).subjects.find(r => r.key === key && r.hours > 0) })).filter(x => x.row);
      if (rows.length < 2) return;
      const teachers = rows.map(x => (x.row.teacher || '').trim());
      const named = teachers.map(t => t.toLowerCase()).filter(Boolean);
      const dup = named.find((t, i) => named.indexOf(t) !== i);
      if (dup) { syncReport.push({ grade: g, key, problem: 'teacher', teacher: teachers.find(t => t.toLowerCase() === dup) }); return; }
      const n = Math.min(...rows.map(x => Number(x.row.hours) || 0));
      let placed = 0;
      shuffle(unitsFor(key, n, '', n, prefs), rand).sort((a, b) => b.len - a.len).forEach(base => {
        let best = null;
        for (let d = 0; d < 5; d++) {
          [...new Set(rows.flatMap(x => allowed[x.id][d]))].forEach(h => {
            // every class must have the hour free, and its own teacher (or, with none named, the subject) must be free
            const ok = rows.every((x, i) => dayFits(x.id, d, h, base) && free(key, teachers[i], d, h, base.len));
            if (!ok) return;
            const score = rows.reduce((sum, x) => sum + scoreFor(x.id, d, h, base), 0) / rows.length + rand() * 0.4;
            if (!best || score < best.score) best = { d, h, score };
          });
        }
        if (!best) return;
        rows.forEach((x, i) => put(x.id, best.d, best.h, { ...base, teacher: teachers[i], together: true }));
        placed += base.len;
        penalty += best.score;
      });
      rows.forEach(x => { reserved[x.id][key] = n; });
      syncReport.push({ grade: g, key, hours: n, placed, extra: rows.some(x => x.row.hours > n) });
    });
  });

  // 2. everything else, class by class
  shuffle(ids.slice(), rand).forEach(id => {
    const units = buildUnits(id, prefs, reserved[id]);
    shuffle(units, rand).sort((a, b) => (b.len - a.len) || (b.hours - a.hours) || ((a.teacher ? 0 : 1) - (b.teacher ? 0 : 1)));
    units.forEach(u => {
      let best = null;
      for (let d = 0; d < 5; d++) {
        allowed[id][d].forEach(h => {
          if (!dayFits(id, d, h, u) || !free(u.subject, u.teacher, d, h, u.len)) return;
          const score = scoreFor(id, d, h, u) + rand() * 0.4;
          if (!best || score < best.score) best = { d, h, score };
        });
      }
      if (!best) { penalty += 1000 * u.len; return; }
      put(id, best.d, best.h, u);
      penalty += best.score;
    });
  });
  // holes inside a day
  ids.forEach(id => grids[id].forEach((day, d) => {
    const hs = Object.keys(day).map(Number);
    if (hs.length) penalty += allowed[id][d].filter(h => h < Math.max(...hs) && !day[h]).length * 20;
  }));
  syncReport.forEach(r => { if (r.hours != null) penalty += (r.hours - r.placed) * 1000; });
  return { result, penalty, syncReport };
}

function runGenerator() {
  const ids = [...cm.genSel].filter(section);
  if (!ids.length) return;
  const hadSchedules = ids.filter(id => schedule(id).length);
  if (hadSchedules.length && !confirm(L(`ל־${hadSchedules.map(id => sectionLabel(section(id))).join(', ')} כבר יש מערכת. להחליף?`, `${hadSchedules.map(id => sectionLabel(section(id))).join(', ')} already ${hadSchedules.length === 1 ? 'has a schedule' : 'have schedules'}. Replace?`))) return;
  const prefs = { ...school.prefs };
  // teachers of classes that are not being regenerated are busy at their lessons
  const busyFixed = [];
  school.sections.filter(s => !ids.includes(s.id)).forEach(s => schedule(s.id).forEach(l => {
    busyFixed.push(bookingKey(l.subject, (l.teacher || teacherOf(s.id, l.subject)).trim(), l.day, l.hour));
  }));
  const tries = Math.max(12, Math.min(60, Math.round(600 / ids.length)));
  let best = null;
  for (let i = 0; i < tries; i++) {
    const a = attempt(ids, prefs, 1000 + i * 7919, busyFixed);
    if (!best || a.penalty < best.penalty) best = a;
  }
  // teachers stored on each placed lesson come from the plan
  ids.forEach(id => { school.schedules[id] = best.result[id]; });
  saveSchool();
  cm.lastRun = {
    at: Date.now(),
    sync: best.syncReport,
    rows: ids.map(id => {
      const placed = {};
      best.result[id].forEach(l => { placed[l.subject] = (placed[l.subject] || 0) + 1; });
      const short = plan(id).subjects.filter(r => (placed[r.key] || 0) < r.hours).map(r => ({ key: r.key, missing: r.hours - (placed[r.key] || 0) }));
      return { id, placed: best.result[id].length, need: requiredHours(id), short };
    }),
  };
  // teachers who have more hours than their classes' week can hold
  const load = {};
  school.sections.forEach(s => plan(s.id).subjects.forEach(r => {
    const t = (r.teacher || '').trim();
    if (!t || !(ids.includes(s.id) || schedule(s.id).length)) return;
    const k = t.toLowerCase();
    load[k] = load[k] || { name: t, hours: 0, slots: 0 };
    load[k].hours += Number(r.hours) || 0;
    load[k].slots = Math.max(load[k].slots, capacity(s.id));
  }));
  cm.lastRun.overloaded = Object.values(load).filter(x => x.hours > x.slots);
  // subjects with no teacher named run in one class at a time, so they need that many separate hours
  const need = {}, byGrade = {};
  ids.forEach(id => plan(id).subjects.forEach(r => {
    if ((r.teacher || '').trim() || !(r.hours > 0)) return;
    const g = section(id).grade;
    if (sameTimeSubject(r.key)) { byGrade[r.key + '|' + g] = Math.max(byGrade[r.key + '|' + g] || 0, Number(r.hours)); return; }
    need[r.key] = (need[r.key] || 0) + Number(r.hours);
  }));
  Object.entries(byGrade).forEach(([k, h]) => { const key = k.split('|')[0]; need[key] = (need[key] || 0) + h; });
  const week = Math.max(...ids.map(capacity));
  cm.lastRun.noTeacher = Object.entries(need).filter(([, h]) => h > week).map(([key, hours]) => ({ key, hours, week }));
  renderPage();
  const bad = cm.lastRun.rows.filter(r => r.short.length).length;
  toast(bad ? L(`נוצרו מערכות – ב־${bad} כיתות לא נכנסו כל השעות`, `Schedules created – ${bad} class${bad === 1 ? '' : 'es'} could not fit every hour`) : L('המערכות נוצרו ונשמרו', 'Schedules created and saved'));
}
function genReport() {
  return `
  <div class="mt-4 col" style="gap:0.5rem">
    ${cm.lastRun.rows.map(r => {
      const s = section(r.id);
      if (!s) return '';
      return `<div class="gen-row ${r.short.length ? 'warn' : 'ok'}">
        <span class="w8">${sectionLabel(s)}</span>
        <span class="xs flex-1">${r.short.length
          ? '⚠️ ' + L(`שובצו ${r.placed} מתוך ${r.need} שעות. חסר: `, `${r.placed} of ${r.need} hours placed. Missing: `) + r.short.map(x => `${subj(x.key).icon} ${esc(subjName(x.key))} ×${x.missing}`).join(', ')
          : '✅ ' + L(`כל ${r.need} השעות שובצו`, `All ${r.need} hours placed`)}</span>
        <button class="link-btn xs" onclick="cm.tab='classes';cm.selected='${r.id}';renderPage();document.getElementById('class-view')?.scrollIntoView({ block: 'start' })">${L('לצפייה ←', 'View →')}</button>
      </div>`;
    }).join('')}
    ${(cm.lastRun.sync || []).map(r => r.problem
      ? `<div class="warn-box">👥 ${L(`${esc(subjName(r.key))} ב${gradeLabel(r.grade)}: ${esc(r.teacher)} רשום/ה ביותר מכיתה אחת, ולכן אי אפשר ללמד את כל השכבה באותה שעה. רשמו מורה אחר/ת לכל כיתה.`, `${esc(subjName(r.key))} in ${gradeLabel(r.grade)}: ${esc(r.teacher)} is listed for more than one class, so the grade can't have it at the same time. Name a different teacher for each class.`)}</div>`
      : `<div class="gen-row ${r.placed === r.hours ? 'ok' : 'warn'}"><span class="w8">${gradeLabel(r.grade)}</span><span class="xs flex-1">👥 ${subj(r.key).icon} ${esc(subjName(r.key))} – ${r.placed === r.hours
          ? L(`כל ${r.hours} השעות באותו זמן בכל הכיתות`, `all ${r.hours} hours at the same time in every class`)
          : L(`רק ${r.placed} מתוך ${r.hours} שעות נכנסו יחד`, `only ${r.placed} of ${r.hours} hours fit together`)}${r.extra ? L(' (שעות נוספות של כיתות מסוימות שובצו בנפרד)', ' (extra hours of some classes placed separately)') : ''}</span></div>`).join('')}
    ${(cm.lastRun.noTeacher || []).map(x => `<div class="warn-box">📚 ${L(`ל${esc(subjName(x.key))} לא רשום מורה, ולכן הוא נלמד בכיתה אחת בכל פעם: צריך ${x.hours} שעות נפרדות, ובשבוע יש רק ${x.week}. רשמו מורים שונים לכיתות.`, `${esc(subjName(x.key))} has no teacher named, so only one class can have it at a time: it needs ${x.hours} separate hours but the week has ${x.week}. Name different teachers for the classes.`)}</div>`).join('')}
    ${(cm.lastRun.overloaded || []).map(x => `<div class="warn-box">👩‍🏫 ${L(`ל${esc(x.name)} יש ${x.hours} שעות בשבוע, אבל בשבוע יש רק ${x.slots} שעות לימוד – אי אפשר לשבץ את כולן. כדאי לחלק את השיעורים בין כמה מורים.`, `${esc(x.name)} has ${x.hours} hours a week, but the week only has ${x.slots} teaching hours – they cannot all fit. Split these lessons between teachers.`)}</div>`).join('')}
    ${cm.lastRun.rows.some(r => r.short.length) ? `<p class="xs muted">${L('כדי שהכול ייכנס: האריכו את שעות הסיום, הפחיתו שעות, אפשרו יותר שעות מאותו מקצוע ביום, או בדקו מורים שמלמדים בהרבה כיתות.', 'To fit everything: extend the end times, reduce hours, allow more hours of a subject per day, or check teachers who teach many classes.')}</p>` : ''}
  </div>`;
}

/* ================= Page ================= */
function renderPage() {
  const tabs = [['classes', '🏫 ' + L('כיתות ומערכות', 'Classes')], ['generate', '⚙️ ' + L('מחולל מערכות', 'Schedule generator')], ['hours', '🕒 ' + L('שעות והפסקות', 'Hours & breaks')]];
  document.getElementById('main').innerHTML = `
    <div>
      <h1 class="display w8 x2">🗂️ ${L('ניהול כיתות ומערכות שעות', 'Classes & schedules')}</h1>
      <p class="sm muted mt-1">${L('שכבות ז׳–י״ב, כיתות מקבילות, מערכת לכל כיתה ויצירה אוטומטית של מערכות.', 'Grades 7–12, parallel classes, a timetable for every class, and automatic schedule generation.')}</p>
    </div>
    <div class="seg cm-tabs" role="tablist">
      ${tabs.map(([k, label]) => `<button role="tab" aria-selected="${cm.tab === k}" class="${cm.tab === k ? 'on' : ''}" onclick="cm.tab='${k}';cm.cell=null;renderPage()">${label}</button>`).join('')}
    </div>
    ${cm.tab === 'classes' ? classesTab() : cm.tab === 'generate' ? generateTab() : hoursTab()}
  `;
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (cm.cell) { cm.cell = null; renderPage(); }
  else if (cm.newSubject) { cm.newSubject = null; renderPage(); }
});
</script>
