<head>

<style>
/* ===================== Shared styles ===================== */
/* ============ Theme tokens ============ */
:root {
  --bg: #F0EFFF;
  --surface: #E8E6FF;
  --card: #FFFFFF;
  --border: #DDD9FF;
  --primary: #7C3AED;
  --primary-fg: #FFFFFF;
  --accent: #10B981;
  --accent-fg: #FFFFFF;
  --text: #1E1B4B;
  --muted: #6B6E9A;
  --amber: #F59E0B;
  --rose: #F43F5E;
  --sky: #38BDF8;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html.dark {
  --bg: #0D0D1A;
  --surface: #13132A;
  --card: #1A1A32;
  --border: #2E2E50;
  --primary: #8B5CF6;
  --primary-fg: #FFFFFF;
  --accent: #34D399;
  --accent-fg: #0D0D1A;
  --text: #EEECFF;
  --muted: #8884B0;
}

/* ============ Base ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html[data-font-size='small'] { font-size: 0.875rem; }
html[data-font-size='medium'] { font-size: 1rem; }
html[data-font-size='large'] { font-size: 1.125rem; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  transition: background-color .2s ease, color .2s ease;
  -webkit-font-smoothing: antialiased;
}
html[dir='rtl'] body { text-align: right; }
html[lang='he'] body, html[lang='he'] body *:not(.mono),
html[lang='ar'] body, html[lang='ar'] body *:not(.mono) {
  font-family: 'Heebo', var(--font-body);
}
h1, h2, h3, h4, .display { font-family: var(--font-display); }
.mono, code, pre { font-family: var(--font-mono); }
html[dir='rtl'] .mono { direction: ltr; unicode-bidi: isolate; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input, select, textarea { font: inherit; color: var(--text); }
::placeholder { color: var(--muted); opacity: .8; }
svg { display: block; }

::-webkit-scrollbar { width: 0.375rem; height: 0.375rem; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0.1875rem; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ============ App shell ============ */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.shell { display: flex; flex: 1; overflow: hidden; }
.page {
  flex: 1; overflow-y: auto; padding: 1rem;
  display: flex; flex-direction: column; gap: 1.25rem;
}
@media (min-width: 768px) { .page { padding: 1.5rem; } }
.page > * { flex-shrink: 0; }

/* Header */
.header {
  height: 4rem; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem;
  background: var(--card); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.logo { display: flex; align-items: center; gap: 0.5rem; }
.logo-mark {
  width: 2rem; height: 2rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 0.875rem;
  background: linear-gradient(135deg, #7C3AED, #10B981);
}
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--primary); }
.dd { position: relative; }
.dd-menu {
  position: absolute; top: 100%; margin-top: 0.5rem; border-radius: 1rem; overflow: hidden; z-index: 60;
  background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 1.25rem 1.5625rem -0.3125rem rgba(0,0,0,.12), 0 0.5rem 0.625rem -0.375rem rgba(0,0,0,.1);
}
.dd-menu.start { inset-inline-start: 0; }
.dd-menu.end { inset-inline-end: 0; }
.class-pill {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; border-radius: 0.75rem;
  font-size: 0.875rem; font-weight: 600; transition: opacity .15s;
}
.class-pill:hover { opacity: .8; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
.menu-item {
  width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
  font-size: 0.875rem; text-align: start; transition: opacity .15s;
}
.menu-item:hover { opacity: .8; }
.icon-btn {
  width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
  background: var(--surface); position: relative; transition: opacity .15s;
}
.icon-btn:hover { opacity: .7; }
.icon-btn svg { width: 1.25rem; height: 1.25rem; }
.count-badge {
  position: absolute; top: -0.25rem; inset-inline-end: -0.25rem; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: var(--rose); color: #fff; font-size: 0.75rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.role-toggle { display: none; align-items: center; gap: 0.25rem; padding: 0.25rem; border-radius: 0.75rem; background: var(--surface); }
.role-toggle button { padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--muted); transition: all .15s; }
.role-toggle button.on { background: var(--primary); color: var(--primary-fg); }
@media (min-width: 768px) { .role-toggle { display: flex; } }
.avatar {
  width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; color: #fff; font-family: var(--font-display); font-weight: 700;
  font-size: 0.875rem; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #7C3AED, #EC4899);
}
.profile-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem; padding-inline-end: 0.75rem; border-radius: 0.75rem; background: var(--surface); }
.notif { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
.notif.unread { background: color-mix(in srgb, var(--primary) 7%, transparent); }

/* Sidebar */
.sidebar {
  width: 4rem; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1rem 0;
  background: var(--card); border-inline-end: 1px solid var(--border);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem; width: 3rem; padding: 0.625rem 0;
  border-radius: 1rem; color: var(--muted); transition: all .15s;
}
.nav-item:hover { background: var(--surface); }
.nav-item.on, .nav-item.on:hover { background: var(--primary); color: var(--primary-fg); }
.nav-item svg { width: 1.25rem; height: 1.25rem; }
.nav-item span { font-size: 0.625rem; font-weight: 700; display: none; }
@media (min-width: 768px) { .sidebar { width: 5rem; } .nav-item span { display: block; } }

/* ============ Building blocks ============ */
.card { background: var(--card); border: 1.5px solid var(--border); }
.surface { background: var(--surface); }
.r-lg { border-radius: 0.5rem; } .r-xl { border-radius: 0.75rem; } .r-2xl { border-radius: 1rem; } .r-3xl { border-radius: 1.5rem; }
.r-full { border-radius: 624.9375rem; }
.p-3 { padding: 0.75rem; } .p-4 { padding: 1rem; } .p-5 { padding: 1.25rem; } .p-6 { padding: 1.5rem; } .p-8 { padding: 2rem; }
.mt-1 { margin-top: 0.25rem; } .mt-2 { margin-top: 0.5rem; } .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-5 { margin-top: 1.25rem; }
.mb-1 { margin-bottom: 0.25rem; } .mb-2 { margin-bottom: 0.5rem; } .mb-3 { margin-bottom: 0.75rem; } .mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.25rem; }
.flex { display: flex; } .col { display: flex; flex-direction: column; } .wrap { flex-wrap: wrap; }
.items-center { align-items: center; } .items-start { align-items: flex-start; } .items-end { align-items: flex-end; }
.justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
.gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; } .gap-5 { gap: 1.25rem; } .gap-6 { gap: 1.5rem; }
.flex-1 { flex: 1; } .min-w-0 { min-width: 0; } .shrink-0 { flex-shrink: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.relative { position: relative; } .hidden { display: none !important; }
.text-center { text-align: center; } .text-start { text-align: start; } .text-end { text-align: end; }
.muted { color: var(--muted); } .primary { color: var(--primary); }
.xs { font-size: 0.75rem; } .sm { font-size: 0.875rem; } .base { font-size: 1rem; } .lg { font-size: 1.125rem; }
.xl { font-size: 1.25rem; } .x2 { font-size: 1.5rem; } .x3 { font-size: 1.875rem; } .x4 { font-size: 2.25rem; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; } .w8 { font-weight: 800; } .w9 { font-weight: 900; }
.leading-tight { line-height: 1.25; } .leading-relaxed { line-height: 1.625; }

.grid { display: grid; gap: 0.75rem; }
.g-1 { grid-template-columns: 1fr; } .g-2 { grid-template-columns: repeat(2, 1fr); } .g-3 { grid-template-columns: repeat(3, 1fr); }
.g-7 { grid-template-columns: repeat(7, 1fr); }
@media (min-width: 640px) {
  .sm-2 { grid-template-columns: repeat(2, 1fr); } .sm-3 { grid-template-columns: repeat(3, 1fr); }
  .sm-only { display: block; } .sm-row { flex-direction: row !important; }
}
@media (min-width: 768px) {
  .md-2 { grid-template-columns: repeat(2, 1fr); } .md-3 { grid-template-columns: repeat(3, 1fr); }
  .md-only { display: block; }
}
@media (min-width: 1024px) {
  .lg-2 { grid-template-columns: repeat(2, 1fr); } .lg-3 { grid-template-columns: repeat(3, 1fr); }
  .lg-4 { grid-template-columns: repeat(4, 1fr); } .lg-span-2 { grid-column: span 2; }
}
@media (max-width: 639px) { .sm-up { display: none !important; } }
@media (max-width: 767px) { .md-up { display: none !important; } }

.icon-tile {
  width: 2.5rem; height: 2.5rem; border-radius: 0.75rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
}
.letter-tile {
  border-radius: 0.75rem; flex-shrink: 0; color: #fff; font-family: var(--font-display); font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; font-weight: 700; padding: 2px 0.5rem; border-radius: 624.9375rem; }
.tag { font-size: 0.75rem; font-weight: 600; padding: 2px 0.375rem; border-radius: 0.375rem; }

.bar { height: 0.5rem; border-radius: 624.9375rem; overflow: hidden; background: var(--surface); }
.bar > span { display: block; height: 100%; border-radius: 624.9375rem; transition: width .6s ease; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; transition: opacity .15s, transform .15s;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-soft { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
.btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
.link-btn { font-size: 0.875rem; font-weight: 700; color: var(--primary); }
.link-btn:hover { opacity: .7; }
.btn svg { width: 1rem; height: 1rem; }

.input {
  width: 100%; padding: 0.625rem 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border);
  background: var(--surface); outline: none; font-size: 0.875rem; transition: box-shadow .15s, border-color .15s;
}
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 0.1875rem color-mix(in srgb, var(--primary) 25%, transparent); }
.input.on-card { background: var(--card); }
.label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--muted); }

.seg { display: flex; padding: 0.25rem; border-radius: 1rem; background: var(--surface); gap: 0.25rem; }
.seg button { flex: 1; padding: 0.625rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; color: var(--muted); transition: all .15s; }
.seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 0.5rem rgba(0,0,0,.08); }
.seg.small button { padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 0.5rem; flex: none; }

.hover-lift { transition: transform .15s, opacity .15s; cursor: pointer; }
.hover-lift:hover { transform: scale(1.02); }
.hover-fade { transition: opacity .15s; cursor: pointer; }
.hover-fade:hover { opacity: .8; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }

/* ============ Animations ============ */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
.spinner.violet { border-color: #C4B5FD; border-top-color: #6D28D9; }
@keyframes pulse { 50% { opacity: .4; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: .8; }
  70% { transform: scale(1.4); opacity: 0; }
  100% { transform: scale(1.4); opacity: 0; }
}
@keyframes fade-up { from { opacity: 0; transform: translateY(0.375rem); } to { opacity: 1; transform: none; } }
.fade-up { animation: fade-up .3s ease both; }
@keyframes xp-fill { from { width: 0%; } }
.xp-fill { animation: xp-fill 1.2s ease-out both; }

/* Toast */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100;
  background: var(--text); color: var(--card); padding: 0.625rem 1.125rem; border-radius: 0.75rem;
  font-size: 0.875rem; font-weight: 600; box-shadow: 0 0.625rem 1.875rem rgba(0,0,0,.2); animation: fade-up .25s ease both;
}

/* ============ Responsive: phones, tablets, desktops ============ */
/* Keep content readable on very wide monitors (modals stay full-screen) */
.page > :not(.modal-bg) { width: 100%; max-width: 90rem; margin-inline: auto; }

/* Touch screens: no sticky hover effects, and 16px inputs so iOS doesn't zoom */
@media (hover: none) {
  .hover-lift:hover, .stat-link:hover, .slot:hover, .live-join:hover { transform: none; }
}
@media (pointer: coarse) {
  .input, .score-input, .pct-input, select, textarea { font-size: max(1rem, 16px); }
}

/* Dialogs never taller than the visible screen (mobile address bars included) */
.modal, .viewer { max-height: calc(100dvh - 2rem); overflow-y: auto; }
.viewer { overflow-y: hidden; }
@media (max-height: 520px) { .modal-bg { padding: 0.5rem; } .modal, .viewer { max-height: calc(100dvh - 1rem); } }

/* Role switch inside the profile menu, for screens where the header toggle is hidden */
.menu-role { display: none; padding: 0.625rem 1rem; border-bottom: 1px solid var(--border); }
@media (max-width: 767px) { .menu-role { display: block; } }

/* Phones: compact header and a bottom tab bar instead of the side rail */
@media (max-width: 639px) {
  .header { padding: 0 0.75rem; gap: 0.5rem; padding-top: env(safe-area-inset-top); height: calc(3.5rem + env(safe-area-inset-top)); }
  .logo-mark { width: 2rem; height: 2rem; }
  .icon-btn { width: 2.25rem; height: 2.25rem; }
  .profile-btn { padding-inline-end: 4px; }
  .sidebar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 45; width: 100%; height: auto;
    flex-direction: row; justify-content: space-around; gap: 0;
    padding: 0.375rem 0.25rem calc(0.375rem + env(safe-area-inset-bottom));
    border-inline-end: none; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .nav-item { flex: 1; width: auto; min-width: 0; padding: 0.375rem 0; border-radius: 0.75rem; }
  .nav-item span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page { padding: 0.875rem; padding-bottom: calc(5rem + env(safe-area-inset-bottom)); gap: 1rem; }
  .toast { bottom: calc(5rem + env(safe-area-inset-bottom)); max-width: calc(100vw - 2rem); text-align: center; }
  .dd-menu { max-width: calc(100vw - 1.5rem); }
  .x2 { font-size: 1.3rem; } .x3 { font-size: 1.6rem; }
}

/* Short landscape phones: slimmer header so content gets the height */
@media (max-height: 480px) and (orientation: landscape) {
  .header { height: 3.25rem; }
  .page { padding-top: 0.75rem; }
}

/* Grid children may shrink below their content width (prevents overflow on phones) */
.grid > * { min-width: 0; }
.btn { white-space: nowrap; }
.section-head { flex-wrap: wrap; gap: 0.25rem 0.75rem; }

/* Short landscape screens (phones on their side): compact side rail that never clips */
@media (max-height: 480px) and (min-width: 640px) {
  .sidebar { gap: 0.25rem; padding: 0.5rem 0; overflow-y: auto; }
  .nav-item { padding: 0.5rem 0; }
  .nav-item span { display: none; }
}

/* Phones: compact stat tiles */
@media (max-width: 639px) {
  .stat-wide { grid-column: 1 / -1; }
  .stat-tile { padding: 0.75rem; gap: 0.5rem; }
  .stat-tile .icon-tile { width: 2.25rem; height: 2.25rem; font-size: 1.1rem; }
  .stat-tile .xl { font-size: 1.1rem; }
}

/* Mashov status chips */
.mchip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.mchip.zero { opacity: .45; }
.mchip.tally .tally-label { font-weight: 600; }

/* ============ Collapsible sections ============ */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.collapse-head { cursor: pointer; position: relative; }
.collapse-head > .collapse-btn { position: absolute; top: 50%; transform: translateY(-50%); }
.collapse-btn {
  width: 2rem; height: 2rem; border-radius: 0.625rem; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); transition: background .15s;
}
.collapse-btn:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); }
.collapse-btn svg { width: 1rem !important; height: 1rem !important; transition: transform .25s ease; }
.collapsible.collapsed .collapse-btn svg { transform: rotate(-90deg); }
html[dir='rtl'] .collapsible.collapsed .collapse-btn svg { transform: rotate(90deg); }
.collapse-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .25s ease; }
.collapsible.collapsed > .collapse-body { grid-template-rows: 0fr; }
.collapse-inner { min-height: 0; }
.collapsible.collapsed > .collapse-body > .collapse-inner,
.collapsible.animating > .collapse-body > .collapse-inner { overflow: hidden; }
.collapsible.collapsed > .collapse-body { visibility: hidden; }
.collapsible.animating > .collapse-body { visibility: visible; }
/* headers that carry a bottom margin or border look tidy when folded */
.collapsible.collapsed > .collapse-head { margin-bottom: 0 !important; border-bottom-color: transparent !important; }
@media (prefers-reduced-motion: reduce) { .collapse-body, .collapse-btn svg { transition: none; } }

/* ============ Justification requests ============ */
.mchip.jchip { cursor: pointer; border: 1.5px dashed color-mix(in srgb, var(--c) 55%, transparent); transition: background .15s ease, transform .15s ease; }
.mchip.jchip:hover, .mchip.jchip:focus-visible { background: color-mix(in srgb, var(--c) 24%, transparent); outline: none; transform: translateY(-1px); }
.mchip .jplus { opacity: .75; font-weight: 800; }
.jtag { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0 0.375rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 800; white-space: nowrap;
  color: #B45309; background: #F59E0B26; }
.mchip .jtag { margin-inline-start: 0.125rem; }
.jtag.approved { color: #047857; background: #10B98126; }
.jtag.rejected { color: #BE123C; background: #F43F5E22; }
.dark .jtag { color: #FCD34D; } .dark .jtag.approved { color: #6EE7B7; } .dark .jtag.rejected { color: #FDA4AF; }

.jmodal-bg { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.5); }
.jmodal { width: 100%; max-width: 32rem; max-height: calc(100dvh - 2rem); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1.5625rem 3.125rem -0.75rem rgba(0,0,0,.3); }

// Time ranges stay left-to-right inside Hebrew/Arabic text (otherwise "9:00–11:00" flips)
function timeRange(start, end) { return `\u2066${start}:00–${end}:00\u2069`; }
function dayName(day) { return (isHe() ? DAY_NAMES.he : DAY_NAMES.en)[day]; }
function lessonLabel(s) {
  const cls = classes.find(c => c.id === s.classId);
  return `${cls ? localize(cls.name) : ''} · ${dayName(s.day)} ${timeRange(s.startHour, s.startHour + s.duration)}${s.room ? ' · ' + localize(s.room) : ''}`;
}
// What changed between two versions of the timetable (matched by lesson id)
function diffTimetables(before, after) {
  const changes = [];
  const prev = new Map(before.map(s => [s.id, s]));
  const next = new Map(after.map(s => [s.id, s]));
  after.forEach(s => {
    const old = prev.get(s.id);
    if (!old) changes.push({ type: 'added', after: s });
    else if (['day', 'startHour', 'duration', 'classId', 'room'].some(k => old[k] !== s[k])) changes.push({ type: 'changed', before: old, after: s });
  });
  before.forEach(s => { if (!next.has(s.id)) changes.push({ type: 'removed', before: s }); });
  return changes;
}
function changeClassIds(c) { return [...new Set([c.before && c.before.classId, c.after && c.after.classId].filter(Boolean))]; }

function myReviewQueue() { return reviewQueue().filter(isMySubmission); }
function teacherStudentCount() { return teacherClasses().reduce((sum, c) => sum + c.students, 0); }

function newSalt() {
  const bytes = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(bytes) : bytes.forEach((_, i) => { bytes[i] = Math.random() * 256; });
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
}
// SHA-256 when the browser allows it; a simple fallback hash otherwise (e.g. plain http)
async function hashPassword(password, salt) {
  const text = salt + ':' + password;
  if (window.crypto && crypto.subtle) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return 'sha256:' + [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  return 'fnv:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

async function ensureSeedUsers() {
  if (load(USERS_KEY, null)) return;
  const users = [];
  for (const u of SEED_USERS) {
    const salt = newSalt();
    users.push({ ...u, salt, passwordHash: await hashPassword(DEMO_PASSWORD, salt), createdAt: '2026-09-01' });
  }
  saveUsers(users);
  save(INBOX_KEY, [{ id: 'm-seed', to: 'u-principal', kind: 'teacher-pending', about: 'u-shapiro', date: '2026-10-20', read: false }]);
}

  ui.fresh = new Set(myNotifs().filter(n => !n.read).map(n => String(n.id)));
  saveInbox(loadInbox().map(m => (m.to === CURRENT_USER.id ? { ...m, read: true, readAt: m.readAt || now } : m)));
  if (isDemoUser()) {
    state.notifs = { ...state.notifs, [state.role]: (state.notifs[state.role] || []).map(n => ({ ...n, read: true, readAt: n.readAt || now })) };
    save('cs-notifs', state.notifs);
  }
}

// A teacher only ever works inside the classes they teach
function enforceTeacherClass() {
  if (state.role === 'teacher' && teacherClasses().length && !teacherClasses().some(c => c.id === state.classId)) {
    state.classId = teacherClasses()[0].id;
  }
}

function localize(value) { return state.language === 'he' ? (hebrewContent[value] ?? value) : value; }
function isHe() { return state.language === 'he'; }
function L(he, en) { return isHe() ? he : en; }
function currentClass() { return classes.find(c => c.id === state.classId); }
function teacherClasses() {
  if (CURRENT_USER && CURRENT_USER.role === 'teacher') return classes.filter(c => (CURRENT_USER.classIds || []).includes(c.id));
  return classes.filter(c => c.teacher === TEACHER_NAME);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function initials(name) { return localize(name).split(/[\s־-]/).map(n => n[0]).join('').slice(0, 2); }
function gradeColor(v) { return v >= 90 ? '#10B981' : v >= 75 ? '#3B82F6' : v >= 60 ? '#F59E0B' : '#F43F5E'; }
function daysUntil(date) { return Math.ceil((new Date(date).getTime() - Date.now()) / 86400000); }
function fmtDate(date, opts) { return new Date(date).toLocaleDateString(isHe() ? 'he-IL' : 'en-GB', opts); }

  Object.assign(state, patch);

  save('cs-role', state.role);
  save('cs-class', state.classId);
  save('cs-font-size', state.fontSize);

  save('cs-notifs', state.notifs);

function applyDocument() {
  const root = document.documentElement;
  root.lang = state.language;
  root.dir = state.language === 'en' ? 'ltr' : 'rtl';

function toast(message) {
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* Principal approves or declines a teacher who signed up */
function reviewTeacher(id, approve) {
  if (!isPrincipal()) return;
  const users = loadUsers();
  const teacher = users.find(u => u.id === id && u.role === 'teacher');
  if (!teacher || teacher.status !== 'pending') return;
  teacher.status = approve ? 'active' : 'rejected';
  teacher.reviewedBy = CURRENT_USER.id;
  teacher.reviewedAt = new Date().toISOString();
  saveUsers(users);
  // the request is handled for every principal, not only the one who clicked
  saveInbox(loadInbox().map(m => (m.kind === 'teacher-pending' && m.about === id ? { ...m, read: true } : m)));
  if (approve) sendInbox(id, 'teacher-approved', CURRENT_USER.id);
  renderAll();
  toast(approve
    ? L(`${localize(fullName(teacher))} אושר/ה כמורה`, `${fullName(teacher)} was approved as a teacher`)
    : L(`הבקשה של ${localize(fullName(teacher))} נדחתה`, `${fullName(teacher)}'s request was declined`));
}
function approveTeacher(id) { reviewTeacher(id, true); }
function declineTeacher(id) { reviewTeacher(id, false); }

const MAX_UPLOAD_BYTES = 2 * 1024 * 1024;   // browser storage is small, keep demo uploads light

function mySubmission(assignmentId) {
  return reviewQueue().find(q => q.assignmentId === assignmentId && q.student === currentUserName())
    || load('cs-graded', []).find(g => g.assignmentId === assignmentId && g.student === currentUserName());
}

function submitControl(a) {
  const sub = mySubmission(a.id);
  const days = daysUntil(a.dueDate);
  return `
    <input type="file" id="up-${a.id}" multiple hidden onchange="uploadWork('${a.id}', this)">
    ${sub
      ? `<span class="xs w7" style="color:#10B981">✓ ${sub.grade !== undefined ? L(`נבדק · ${sub.grade}`, `Graded · ${sub.grade}`) : L('הוגש', 'Submitted')}</span>
         ${sub.grade === undefined ? `<button class="xs w7 primary" onclick="document.getElementById('up-${a.id}').click()">${L('הגשה מחדש', 'Resubmit')}</button>` : ''}`
      : `<button class="btn btn-primary btn-sm" onclick="document.getElementById('up-${a.id}').click()">⬆ ${L('הגשת עבודה', 'Upload work')}</button>
         <span class="xs w6" style="color:${days <= 2 ? '#F43F5E' : 'var(--muted)'}">${days <= 0 ? L('להגשה היום', 'Due today') : L(`נותרו ${days} ימים`, `${days}d left`)}</span>`}`;
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function uploadWork(assignmentId, input) {
  const picked = [...input.files];
  input.value = '';
  if (!picked.length) return;
  const total = picked.reduce((sum, f) => sum + f.size, 0);
  if (total > MAX_UPLOAD_BYTES) {
    toast(L('הקבצים גדולים מדי (עד 2MB בגרסת ההדגמה)', 'Files are too large (2 MB max in this demo)'));
    return;
  }
  let files;
  try {
    files = await Promise.all(picked.map(async f => ({ name: f.name, type: f.type, size: f.size, dataUrl: await readAsDataUrl(f) })));
  } catch (e) {
    toast(L('לא הצלחנו לקרוא את הקובץ', 'Could not read the file'));
    return;
  }
  const queue = reviewQueue().filter(q => !(q.assignmentId === assignmentId && q.student === currentUserName()));
  queue.push({ id: 's-' + Date.now(), assignmentId, student: currentUserName(), submittedAt: new Date().toISOString().slice(0, 10), files });
  try {
    localStorage.setItem('cs-review-queue', JSON.stringify(queue));
  } catch (e) {
    toast(L('אין מספיק מקום באחסון הדפדפן לקובץ הזה', 'Not enough browser storage for this file'));
    return;
  }
  renderPage();
  toast(L('העבודה הוגשה למורה', 'Your work was handed in'));
}

function allAssignments() { return load('cs-teacher-assignments', null) || assignments; }

/* Where the signed-in student stands on an assignment:
   'graded' (with grade + teacher feedback), 'submitted' (waiting for a grade) or 'todo'. */
function myTaskStatus(a) {
  const me = currentUserName();
  const graded = load('cs-graded', []).filter(g => g.assignmentId === a.id && g.student === me).pop();
  if (graded) return { state: 'graded', grade: graded.grade, feedback: graded.feedback, gradedAt: graded.gradedAt, gradedBy: graded.gradedBy, files: graded.fileNames || [] };
  // the built-in sample grades belong to the demo student
  if (isDemoUser() && a.submitted && typeof a.grade === 'number') return { state: 'graded', grade: a.grade, feedback: a.feedback || '', gradedBy: classTeachers(a.classId)[0], files: [] };
  const sub = reviewQueue().find(q => q.assignmentId === a.id && q.student === me);
  if (sub) return { state: 'submitted', submittedAt: sub.submittedAt, files: (sub.files || []).map(f => f.name) };
  return { state: 'todo' };
}

/* Weeks, counted from the current school week (Monday–Friday; the weekend still belongs to the week that just ended) */
function thisMonday() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d;
}
function weekOffsetOf(iso) {
  const [y, m, dd] = iso.split('-').map(Number);
  const d = new Date(y, m - 1, dd);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return Math.round((d - thisMonday()) / (7 * 86400000));
}
function relWeekLabel(offset) {
  if (offset === 0) return L('השבוע הנוכחי', 'Current week');

// Absence / lateness come in two kinds: plain and excused (by the teacher or an approved request)
const ABSENT_KEYS = ['absent', 'absentEx'];
const LATE_KEYS = ['late', 'lateEx'];
function isAbsent(m) { return !!(m && (m.absent || m.absentEx)); }
function isLate(m) { return !!(m && (m.late || m.lateEx)); }
function mashovRecord(slotId, date) { return mashovStore()[slotId + '|' + date] || null; }

/* ================= Grade calculation =================
   Final grade = weighted mix of three categories (weights set per class by the teacher):
   - Exams:         average of the student's exam scores in the class
   - Assignments:   average of the student's graded submissions in the class
   - Participation: a grade the teacher enters, guided by the student's Mashov tally
     (the system only counts the entries – it never turns them into a grade)
   A category with no grade yet is left out and the other weights are scaled up. */
const EXAMS_KEY = 'cs-exams';
const WEIGHTS_KEY = 'cs-class-weights';
const FEEDBACK_KEY = 'cs-student-feedback';
const DEFAULT_WEIGHTS = { exam: 20, participation: 20, assignments: 60 };
const PARTICIPATION_KEY = 'cs-participation-grades';
const GRADE_KEYS = ['exam', 'participation', 'assignments'];

function classWeights(classId) {
  const all = load(WEIGHTS_KEY, {});
  if (all[classId]) return { ...all[classId] };
  const old = load('cs-weights', null);   // earlier versions kept one set of weights for everyone
  if (old && typeof old.exam === 'number') {
    const exam = Math.round(old.exam * 100), participation = Math.round(old.participation * 100);
    return { exam, participation, assignments: 100 - exam - participation };
  }
  return { ...DEFAULT_WEIGHTS };
}
function saveClassWeights(classId, pct) {
  const all = load(WEIGHTS_KEY, {});
  all[classId] = { ...pct };
  save(WEIGHTS_KEY, all);
}

function average(nums) { return nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length) : null; }

function classExams(classId) {
  return load(EXAMS_KEY, []).filter(e => e.classId === classId).sort((a, b) => (a.date < b.date ? -1 : 1));
}
function examScores(classId, name) {
  return classExams(classId).filter(e => typeof e.grades[name] === 'number')
    .map(e => ({ id: e.id, title: e.title, date: e.date, score: e.grades[name] }));
}
function assignmentScores(classId, name) {
  const graded = load('cs-graded', []).filter(g => g.student === name).map(g => {
    const a = findAssignment(g.assignmentId);
    return a && a.classId === classId ? { title: a.title, grade: g.grade, feedback: g.feedback, assignmentId: a.id } : null;
  }).filter(Boolean);
  // built-in sample grades belong to the demo student
  if (name === 'Noa Ben-David') {
    assignments.filter(a => a.classId === classId && a.submitted && typeof a.grade === 'number' && !graded.some(g => g.assignmentId === a.id))
      .forEach(a => graded.push({ title: a.title, grade: a.grade, feedback: a.feedback, assignmentId: a.id }));
  }
  return graded;
}
// Lessons in this class where the teacher marked the student in Mashov (newest first)
function attendanceRecords(classId, name) {
  const store = mashovStore();
  return Object.keys(store).map(key => {
    const rec = store[key];
    const marks = rec.rows && rec.rows[name];
    if (rec.classId !== classId || !marks || !MASHOV_CATS.some(c => marks[c.key])) return null;
    const slot = timetable.find(s => s.id === key.split('|')[0]) || DEFAULT_TIMETABLE.find(s => s.id === key.split('|')[0]);
    return { key, date: rec.date, slot, marks, by: rec.by };
  }).filter(Boolean).sort((a, b) => (a.date < b.date ? 1 : -1));
}
// How many times each Mashov entry was recorded – a tally for the teacher, not a grade
function participationSummary(records) {
  const count = key => records.filter(r => r.marks[key]).length;
  const onTime = records.filter(r => !isAbsent(r.marks) && !isLate(r.marks)).length;
  return { lessons: records.length, onTime, late: count('late'), absent: count('absent'), lateEx: count('lateEx'), absentEx: count('absentEx'),
    justified: count('lateEx') + count('absentEx'), noEquip: count('noEquip'), disrupt: count('disrupt'), praise: count('praise') };
}
function participationGrade(classId, name) {
  const v = load(PARTICIPATION_KEY, {})[classId + '|' + name];
  return typeof v === 'number' ? v : null;
}
function setParticipationGrade(classId, name, value) {
  const all = load(PARTICIPATION_KEY, {});
  if (value === null) delete all[classId + '|' + name]; else all[classId + '|' + name] = value;
  save(PARTICIPATION_KEY, all);
}

/* Status of one lesson for a student, as small coloured chips (on time / late / absent / …) */
// `ref` = { key, name } ties the chips to a Mashov record, so a late/absent mark shows its
// justification request and, for the student it belongs to, opens the request form.
function statusChips(m, ref) {
  const keys = isAbsent(m) ? [m.absentEx ? 'absentEx' : 'absent']
    : [m.lateEx ? 'lateEx' : m.late ? 'late' : 'onTime'].concat(['noEquip', 'disrupt', 'praise'].filter(k => m[k]));
  return keys.map(k => {
    if (k === 'onTime') return `<span class="mchip" style="--c:#10B981">✅ ${L('בזמן', 'On time')}</span>`;
    const c = MASHOV_CATS.find(x => x.key === k);
    const label = `${c.icon} ${L(c.he, c.en)}`;
    if (!ref || ![...ABSENT_KEYS, ...LATE_KEYS].includes(k)) return `<span class="mchip" style="--c:${c.color}">${label}</span>`;
    const j = justificationFor(ref.key, ref.name);
    // excused straight away by the teacher: nothing for the student to ask for
    if (c.excused && !j) return `<span class="mchip" style="--c:${c.color}">${label}</span>`;
    const tag = j ? `<span class="jtag ${j.status}">${justifyStatusLabel(j.status, true)}</span>` : '';
    if (state.role === 'student' && ref.name === currentUserName()) {
      const hint = j ? L('צפייה בבקשת ההצדקה', 'View justification request') : L('לחצו כדי להגיש בקשת הצדקה', 'Click to request a justification');
      const go = `event.stopPropagation();openJustify('${ref.key}')`;
      return `<span class="mchip jchip" style="--c:${c.color}" role="button" tabindex="0" title="${hint}" aria-label="${label} – ${hint}"
        onclick="${go}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${go}}">${label}${tag || ' <span class="jplus">✎</span>'}</span>`;
    }
    return `<span class="mchip" style="--c:${c.color}">${label}${tag}</span>`;
  }).join('');
}
// Tally chips for the teacher (e.g. ✅ 14 · ⏰ 5 …)
function tallyChips(p) {
  const items = [
    ['#10B981', '✅', L('בזמן', 'On time'), p.onTime], ['#F59E0B', '⏰', L('איחורים', 'Late'), p.late],
    ['#0EA5E9', '⏰', L('איחורים מוצדקים', 'Excused late'), p.lateEx || 0],
    ['#F43F5E', '🚫', L('חיסורים', 'Absent'), p.absent], ['#0EA5E9', '🚫', L('חיסורים מוצדקים', 'Excused absences'), p.absentEx || 0], ['#8B5CF6', '🎒', L('אי הבאת ציוד', 'Missing equipment'), p.noEquip],
    ['#F97316', '📢', L('הפרעות', 'Disruptions'), p.disrupt], ['#10B981', '🌟', L('לשבח', 'Commendations'), p.praise],
  ];
  return items.map(([color, icon, label, n]) => `<span class="mchip tally ${n ? '' : 'zero'}" style="--c:${color}" title="${label}">${icon} ${n} <span class="tally-label">${label}</span></span>`).join('');
}
function finalFrom(parts, pct) {
  const have = GRADE_KEYS.filter(k => typeof parts[k] === 'number');
  const totalWeight = have.reduce((s, k) => s + pct[k], 0);
  if (!have.length || !totalWeight) return null;
  return Math.round(have.reduce((s, k) => s + parts[k] * pct[k], 0) / totalWeight);
}
function computeGrade(classId, name, pct) {
  const exams = examScores(classId, name);
  const work = assignmentScores(classId, name);
  const records = attendanceRecords(classId, name);
  const part = participationSummary(records);
  const parts = { exam: average(exams.map(e => e.score)), assignments: average(work.map(w => w.grade)), participation: participationGrade(classId, name) };
  const weights = pct || classWeights(classId);
  return { ...parts, final: finalFrom(parts, weights), weights, exams, work, records, part };
}
function studentFeedback(classId, name) {
  const saved = load(FEEDBACK_KEY, {})[classId + '|' + name];
  if (saved) return saved;
  return name === 'Noa Ben-David' && studentGrades[classId] ? localize(studentGrades[classId].feedback) : '';
}

/* Sample history so grades are not empty on first visit: one exam per class and
   five weeks of Mashov marks for the sample roster. Runs once per browser. */
function seedHash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
function ensureGradeSeed() {
  if (load('cs-grades-seeded', false)) return;
  const bioExam = { 'Noa Ben-David': 82, 'Yosef Avraham': 75, 'Maya Goldstein': 94, 'Lior Cohen': 68, 'Tamar Levy': 88, 'Eitan Mizrahi': 79 };
  const exams = load(EXAMS_KEY, []);
  classes.forEach(c => {
    const grades = {};
    STUDENT_ROSTER.forEach(name => {
      grades[name] = c.id === 'bio11a' ? bioExam[name]
        : name === 'Noa Ben-David' && studentGrades[c.id] ? studentGrades[c.id].exam
        : 62 + seedHash(name + c.id) % 36;
    });
    exams.push({ id: 'ex-seed-' + c.id, classId: c.id, title: 'Unit 1 exam', date: '2026-09-24', grades, createdBy: c.teacher });
  });
  save(EXAMS_KEY, exams);

  const store = mashovStore();
  const profile = {
    'Noa Ben-David': r => ({ late: r < 8, praise: r > 90 }),
    'Yosef Avraham': r => ({ noEquip: r < 20, absent: r > 95 }),
    'Maya Goldstein': r => ({ praise: r < 30 }),
    'Lior Cohen': r => ({ late: r < 35, absent: r > 92 }),
    'Tamar Levy': r => ({ absent: r < 6, praise: r > 85 }),
    'Eitan Mizrahi': r => ({ disrupt: r < 25, noEquip: r >= 25 && r < 35 }),
  };
  ['2026-09-07', '2026-09-14', '2026-09-21', '2026-09-28', '2026-10-05'].forEach(monday => {
    DEFAULT_TIMETABLE.forEach(slot => {
      const [y, m, d] = monday.split('-').map(Number);
      const day = new Date(y, m - 1, d + slot.day);
      const date = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
      const key = slot.id + '|' + date;
      if (store[key]) return;
      const rows = {};
      STUDENT_ROSTER.forEach(name => {
        const marks = profile[name](seedHash(name + key) % 100);
        rows[name] = marks.absent ? { absent: true } : { ...marks, present: true };
      });

      store[key] = { classId: slot.classId, date, savedAt: date + 'T09:00:00', by: cls ? cls.teacher : '', rows, seeded: true };
    });

  save(MASHOV_KEY, store);

}

const JUSTIFY_KEY = 'cs-justifications';
const JUSTIFY_REASONS = [

const JUSTIFY_FILE_MAX = 1024 * 1024;
const justify = { mode: null, key: null, id: null, draft: null, error: '' };

function loadJustifications() { return load(JUSTIFY_KEY, []); }

function decideJustify(approve) {
  const list = loadJustifications();
  const j = list.find(x => x.id === justify.id);
  if (!j) return;
  const replyEl = document.getElementById('justify-reply');
  j.status = approve ? 'approved' : 'rejected';
  j.reply = replyEl ? replyEl.value.trim() : '';
  j.reviewedBy = currentUserName();
  j.reviewedAt = new Date().toISOString();
  saveJustifications(list);
  // an approved request turns the mark into an excused absence / excused lateness in Mashov
  const store = mashovStore();
  const rec = store[j.key];
  if (approve && rec && rec.rows && rec.rows[j.studentName]) {
    excuseMarks(rec.rows[j.studentName], j.kind);
    save(MASHOV_KEY, store);
    // the teacher may have this lesson open in Mashov right now
    if (typeof mashov !== 'undefined' && mashov.slotId && mashov.slotId + '|' + mashov.date === j.key && mashov.rows[j.studentName]) excuseMarks(mashov.rows[j.studentName], j.kind);
  }
  if (j.studentId) sendInbox(j.studentId, 'justification-result', CURRENT_USER.id, { id: j.id, classId: j.classId, date: j.date, kind: j.kind, status: j.status });
  markJustifyRead(j.id);
  closeJustify();
  refreshAfterJustify();
  toast(approve ? L('הבקשה אושרה', 'Request approved') : L('הבקשה נדחתה', 'Request declined'));
}

function excuseMarks(row, kind) {
  if (kind === 'absent') { if (row.absent) { delete row.absent; row.absentEx = true; } }
  else if (row.late) { delete row.late; row.lateEx = true; }
}
function markJustifyRead(id) {
  const inbox = loadInbox();
  let changed = false;
  inbox.forEach(m => { if (m.to === (CURRENT_USER && CURRENT_USER.id) && m.extra && m.extra.id === id && !m.read) { m.read = true; m.readAt = new Date().toISOString(); changed = true; } });
  if (changed) { saveInbox(inbox); renderHeaderOnly(); }
}
// A notification link to the page you are already on only changes the hash, so open it here
function followJustifyLink(e, id, link) {
  if (location.pathname.split('/').pop() === link.split('#')[0]) {
    e.preventDefault();
    ui.notifs = false;
    renderHeaderOnly();
    openAnyRequest(id);
    return false;
  }
  return true;
}
function closeJustify() {
  justify.mode = null;
  renderJustify();
  if (/^#(justify|request)=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}
function refreshAfterJustify() {
  if (typeof window.renderPage === 'function') {
    const y = window.scrollY;
    window.renderPage();
    window.scrollTo(0, y);
  }
}

function renderJustify() {
  let host = document.getElementById('justify-slot');
  if (!host) {
    host = document.createElement('div');
    host.id = 'justify-slot';
    document.body.appendChild(host);
  }
  const text = document.getElementById('justify-text');
  if (text && justify.draft) justify.draft.text = text.value;
  host.innerHTML = justifyDialogHtml();
  document.body.classList.toggle('jmodal-open', !!(justify.mode || greq.mode));
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && justify.mode) closeJustify(); });
// Links such as home.html#justify=<id> (from a notification) open that request
function openJustifyFromHash() {
  const m = location.hash.match(/^#(?:justify|request)=([\w-]+)/);
  if (m && CURRENT_USER) openAnyRequest(m[1]);
}
function openAnyRequest(id) {
  if (id.startsWith('g-')) openGradeRequestById(id); else openJustifyReview(id);
}
window.addEventListener('hashchange', openJustifyFromHash);

/* ================= Grade review requests =================
   A student who thinks an exam or assignment grade is wrong asks the teacher to check
   it again. The teacher sees the request on Home (and gets a notification), can change
   the grade right there, and the student is told the result. */
const GRADE_REQ_KEY = 'cs-grade-requests';
const GRADE_REQ_REASONS = [
  { key: 'calc', he: 'טעות בחישוב / בסיכום הנקודות', en: 'Points added up wrong', icon: '🧮' },
  { key: 'answer', he: 'תשובה נכונה סומנה כשגויה', en: 'A correct answer was marked wrong', icon: '✏️' },
  { key: 'missing', he: 'חלק מהעבודה לא נבדק', en: 'Part of my work wasn’t checked', icon: '📄' },
  { key: 'criteria', he: 'לא מסכים/ה עם אופן הבדיקה', en: 'I disagree with how it was marked', icon: '⚖️' },
  { key: 'other', he: 'אחר', en: 'Other', icon: '📝' },
];
const greq = { mode: null, id: null, item: null, draft: null, error: '' };

function loadGradeRequests() { return load(GRADE_REQ_KEY, []); }
function saveGradeRequests(list) { save(GRADE_REQ_KEY, list); }
function gradeReqReason(key) { return GRADE_REQ_REASONS.find(r => r.key === key) || GRADE_REQ_REASONS[GRADE_REQ_REASONS.length - 1]; }
function gradeRequestFor(itemType, itemId, name) {
  return loadGradeRequests().find(r => r.itemType === itemType && r.itemId === itemId && r.studentName === name) || null;
}
// The grade as it stands now (exam table or graded assignments)
function currentItemGrade(itemType, itemId, classId, name) {
  if (itemType === 'exam') {
    const e = classExams(classId).find(x => x.id === itemId);
    return e && typeof e.grades[name] === 'number' ? { title: e.title, date: e.date, grade: e.grades[name] } : null;
  }
  const w = assignmentScores(classId, name).find(x => x.assignmentId === itemId);
  const a = findAssignment(itemId);
  return w ? { title: w.title, date: a ? a.dueDate : null, grade: w.grade, feedback: w.feedback } : null;
}
function setItemGrade(r, grade) {
  if (r.itemType === 'exam') {
    const exams = load(EXAMS_KEY, []);
    const e = exams.find(x => x.id === r.itemId);
    if (!e) return false;
    e.grades[r.studentName] = grade;
    save(EXAMS_KEY, exams);
    return true;
  }
  const graded = load('cs-graded', []);
  const mine = graded.filter(g => g.assignmentId === r.itemId && g.student === r.studentName).pop();
  if (mine) { mine.grade = grade; mine.gradedAt = new Date().toISOString(); mine.gradedBy = currentUserName(); }
  else {
    const w = currentItemGrade('assignment', r.itemId, r.classId, r.studentName);
    graded.push({ id: 'regrade-' + r.id, assignmentId: r.itemId, student: r.studentName, grade, feedback: w ? w.feedback || '' : '',
      gradedAt: new Date().toISOString(), gradedBy: currentUserName() });
  }
  save('cs-graded', graded);
  return true;
}
function myGradeRequests() {
  if (state.role !== 'student') return [];
  return loadGradeRequests().filter(r => r.studentName === currentUserName());
}

/* Small control next to a grade: "Request review", or the request's status */
function gradeReqButton(itemType, itemId, classId) {
  if (state.role !== 'student') return '';
  const r = gradeRequestFor(itemType, itemId, currentUserName());
  const go = `event.stopPropagation();openGradeRequest('${itemType}','${itemId}','${classId}')`;
  if (r) return `<button class="jtag ${r.status} greq-tag" onclick="${go}" title="${L('צפייה בבקשה', 'View request')}">📝 ${r.status === 'approved' ? L('עודכן', 'Updated') : r.status === 'rejected' ? L('ללא שינוי', 'Unchanged') : L('בבדיקה', 'Under review')}</button>`;
  return `<button class="greq-btn" onclick="${go}">↺ ${L('בקשת בדיקה חוזרת', 'Request review')}</button>`;
}

function openGradeRequest(itemType, itemId, classId) {
  if (state.role !== 'student') return;
  const now = currentItemGrade(itemType, itemId, classId, currentUserName());
  if (!now) return;
  const existing = gradeRequestFor(itemType, itemId, currentUserName());
  greq.item = { itemType, itemId, classId, ...now };
  greq.id = existing ? existing.id : null;
  greq.mode = existing ? 'view' : 'form';
  greq.draft = { reason: '', text: '', wanted: '', file: null };
  greq.error = '';
  greq.fresh = true;
  renderGradeRequest();
}
function openGradeRequestById(id) {
  const r = loadGradeRequests().find(x => x.id === id);
  if (!r) { toast(L('הבקשה כבר לא קיימת', 'That request no longer exists')); return; }
  if (state.role === 'student') {
    if (r.studentName !== currentUserName()) return;
    greq.mode = 'view';
  } else {
    if (!teacherClasses().some(c => c.id === r.classId)) return;
    greq.mode = 'review';
  }
  greq.id = id;
  greq.item = { itemType: r.itemType, itemId: r.itemId, classId: r.classId, title: r.title, date: r.date, grade: r.currentGrade };
  greq.error = '';
  greq.fresh = true;
  markJustifyRead(id);
  renderGradeRequest();
}
function editGradeRequest() {
  const r = loadGradeRequests().find(x => x.id === greq.id);
  const now = currentItemGrade(greq.item.itemType, greq.item.itemId, greq.item.classId, currentUserName());
  if (now) Object.assign(greq.item, now);
  greq.mode = 'form';
  greq.draft = { reason: r ? r.reason : '', text: r ? r.text : '', wanted: r && r.requestedGrade != null ? String(r.requestedGrade) : '', file: r ? r.file : null };
  greq.error = '';
  renderGradeRequest();
}
function greqField(field, value) {
  greq.draft[field] = value;
  if (field === 'reason') { greq.error = ''; renderGradeRequest(); }
}
async function greqFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > JUSTIFY_FILE_MAX) { greq.error = L('הקובץ גדול מדי (עד 1MB).', 'That file is too big (1 MB max).'); renderGradeRequest(); return; }
  greq.draft.file = { name: file.name, type: file.type, size: file.size, data: await readAsDataUrl(file) };
  greq.error = '';
  renderGradeRequest();
}
function submitGradeRequest() {
  const d = greq.draft;
  const textEl = document.getElementById('greq-text');
  if (textEl) d.text = textEl.value;
  const wantedEl = document.getElementById('greq-wanted');
  if (wantedEl) d.wanted = wantedEl.value.trim();
  const wanted = d.wanted === '' ? null : Number(d.wanted);
  if (!d.reason) greq.error = L('נא לבחור סיבה.', 'Please choose a reason.');
  else if (d.text.trim().length < 5) greq.error = L('נא להסביר מה לדעתך צריך לבדוק שוב (לפחות 5 תווים).', 'Please explain what should be checked again (at least 5 characters).');
  else if (wanted !== null && (!Number.isFinite(wanted) || wanted < 0 || wanted > 100)) greq.error = L('הציון המבוקש צריך להיות בין 0 ל־100.', 'The grade you ask for must be between 0 and 100.');
  else greq.error = '';
  if (greq.error) { renderGradeRequest(); return; }

  const it = greq.item;
  const list = loadGradeRequests().filter(r => !(r.itemType === it.itemType && r.itemId === it.itemId && r.studentName === currentUserName()));
  const r = {
    id: 'g-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), itemType: it.itemType, itemId: it.itemId, classId: it.classId,
    title: it.title, date: it.date, currentGrade: it.grade, requestedGrade: wanted === null ? null : Math.round(wanted),
    studentId: CURRENT_USER.id, studentName: currentUserName(), reason: d.reason, text: d.text.trim(), file: d.file,
    status: 'pending', createdAt: new Date().toISOString(),
  };
  list.unshift(r);
  try { saveGradeRequests(list); }
  catch (e) { greq.error = L('אין מספיק מקום לשמור את הקובץ. נסו קובץ קטן יותר.', 'Not enough room to save that file. Try a smaller one.'); renderGradeRequest(); return; }
  requestRecipients(r.classId).forEach(u => sendInbox(u.id, 'grade-request', CURRENT_USER.id, { id: r.id, classId: r.classId, title: r.title, grade: r.currentGrade }));
  greq.id = r.id;
  greq.mode = 'view';
  renderGradeRequest();
  refreshAfterJustify();
  toast(L('הבקשה נשלחה למורה', 'Request sent to your teacher'));
}
function withdrawGradeRequest() {
  if (!confirm(L('לבטל את הבקשה?', 'Withdraw this request?'))) return;
  saveGradeRequests(loadGradeRequests().filter(r => r.id !== greq.id));
  saveInbox(loadInbox().filter(m => !(m.kind === 'grade-request' && m.extra && m.extra.id === greq.id)));
  closeGradeRequest();
  refreshAfterJustify();
}
function decideGradeRequest(approve) {
  const list = loadGradeRequests();
  const r = list.find(x => x.id === greq.id);
  if (!r) return;
  const before = currentItemGrade(r.itemType, r.itemId, r.classId, r.studentName);
  const oldGrade = before ? before.grade : r.currentGrade;
  let newGrade = oldGrade;
  if (approve) {
    const el = document.getElementById('greq-new');
    const v = Number(el ? el.value.trim() : '');
    if (!el || el.value.trim() === '' || !Number.isFinite(v) || v < 0 || v > 100) {
      greq.error = L('נא להזין ציון חדש בין 0 ל־100.', 'Enter the new grade (0–100).');
      renderGradeRequest();
      return;
    }
    newGrade = Math.round(v);
    if (!setItemGrade(r, newGrade)) { greq.error = L('הפריט כבר לא קיים.', 'That item no longer exists.'); renderGradeRequest(); return; }
  }
  const replyEl = document.getElementById('greq-reply');
  Object.assign(r, { status: approve ? 'approved' : 'rejected', oldGrade, newGrade, reply: replyEl ? replyEl.value.trim() : '',
    reviewedBy: currentUserName(), reviewedAt: new Date().toISOString() });
  saveGradeRequests(list);
  if (r.studentId) sendInbox(r.studentId, 'grade-request-result', CURRENT_USER.id, { id: r.id, classId: r.classId, title: r.title, status: r.status, oldGrade, newGrade });
  markJustifyRead(r.id);
  closeGradeRequest();
  refreshAfterJustify();
  toast(approve ? L(`הציון עודכן ל־${newGrade}`, `Grade updated to ${newGrade}`) : L('הבקשה נדחתה – הציון לא השתנה', 'Request declined – grade unchanged'));
}
function closeGradeRequest() {
  greq.mode = null;
  renderGradeRequest();
  if (/^#(justify|request)=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}

function gradeRequestDialogHtml() {
  if (!greq.mode) return '';
  const r = greq.id ? loadGradeRequests().find(x => x.id === greq.id) : null;
  const it = greq.item;
  const cls = classes.find(c => c.id === it.classId) || classes[0];
  const fade = greq.fresh ? 'fade-up' : '';
  greq.fresh = false;
  const kindLabel = it.itemType === 'exam' ? L('מבחן', 'Exam') : L('מטלה', 'Assignment');
  const shownGrade = r && r.status === 'approved' ? r.newGrade : (r ? r.currentGrade : it.grade);
  const itemCard = `

function renderGradeRequest() {
  let host = document.getElementById('greq-slot');
  if (!host) { host = document.createElement('div'); host.id = 'greq-slot'; document.body.appendChild(host); }

document.addEventListener('keydown', e => { if (e.key === 'Escape' && greq.mode) closeGradeRequest(); });

/* ----- Everything students asked the signed-in teacher (Home) ----- */
function teacherRequests() {
  if (state.role !== 'teacher') return [];
  const mine = teacherClasses().map(c => c.id);
  const grade = loadGradeRequests().filter(r => mine.includes(r.classId)).map(r => ({ type: 'grade', r }));
  const just = loadJustifications().filter(j => mine.includes(j.classId)).map(j => ({ type: 'justify', r: j }));
  return grade.concat(just).sort((a, b) => (a.r.createdAt < b.r.createdAt ? 1 : -1));
}

/* ================= Render loop ================= */
function renderHeaderOnly() {
  document.getElementById('header-slot').innerHTML = renderHeader();
}
function renderAll() {
  if (window.AUTH_PAGE) {
    applyDocument();
    window.renderPage();
    return;
  }
  if (!CURRENT_USER) return;
  if (isPrincipal() && !PRINCIPAL_PAGES.includes(window.PAGE_KEY)) { location.replace('home.html'); return; }
  if (!isPrincipal() && window.PAGE_KEY === 'timetable') { location.replace('schedule.html'); return; }
  if (state.role === 'student' && window.PAGE_KEY === 'path') { location.replace('tasks.html'); return; }
  if (state.role === 'teacher' && window.PAGE_KEY === 'tasks') { location.replace('home.html'); return; }
  applyDocument();
  renderHeaderOnly();

  document.title = 'CoolSchool · ' + t(window.PAGE_KEY);
  const sessionCheck = load(SESSION_KEY, null);
  if (!sessionCheck || sessionCheck.userId !== CURRENT_USER.id) { location.replace('login.html'); return; }
  window.renderPage();
}
/* ================= Collapsible sections =================
   Sections marked data-collapse="key" (and data-collapse-default="open|closed") get a
   clickable header when the "collapsible sections" setting is on. The first child is the
   header; everything after it folds away. Each section remembers being opened or closed. */
const COLLAPSE_KEY = 'cs-collapsed';
const PHONE_QUERY = window.matchMedia ? window.matchMedia('(max-width: 767px)') : null;
function isPhoneScreen() { return !!(PHONE_QUERY && PHONE_QUERY.matches); }
function collapsibleActive() {
  return state.collapseMode === 'on' || (state.collapseMode === 'auto' && isPhoneScreen());
}
// In automatic mode, turning a tablet or resizing the window switches the layout
if (PHONE_QUERY && PHONE_QUERY.addEventListener) {
  PHONE_QUERY.addEventListener('change', () => { if (!window.AUTH_PAGE && state.collapseMode === 'auto' && CURRENT_USER) renderAll(); });
}
const initialHash = decodeURIComponent(location.hash.slice(1));
let hashOpened = false;

// On phones every section starts closed on each visit; what the user opens stays open
// only while they are on the page. Bigger screens remember the choice.
const phoneOpen = {};
function sectionOpen(key, fallbackOpen) {
  if (isPhoneScreen()) return !!phoneOpen[key];
  const saved = load(COLLAPSE_KEY, {});
  return key in saved ? saved[key] : fallbackOpen;
}
function rememberSection(key, open) {
  if (isPhoneScreen()) { phoneOpen[key] = open; return; }
  const saved = load(COLLAPSE_KEY, {});
  saved[key] = open;
  save(COLLAPSE_KEY, saved);
}

function enhanceCollapsibles() {
  if (!collapsibleActive()) return;
  document.querySelectorAll('#main [data-collapse]').forEach(sec => {
    if (sec.dataset.enhanced || sec.children.length < 2) return;
    sec.dataset.enhanced = '1';
    const key = sec.dataset.collapse;
    const head = sec.firstElementChild;
    const body = document.createElement('div');
    const inner = document.createElement('div');
    body.className = 'collapse-body';
    body.id = 'cb-' + key;
    inner.className = 'collapse-inner';
    while (head.nextSibling) inner.appendChild(head.nextSibling);
    body.appendChild(inner);
    sec.appendChild(body);

    let open = sectionOpen(key, sec.dataset.collapseDefault === 'open');
    // a link straight to something inside (e.g. #attendance from a notification) opens it
    if (!hashOpened && initialHash && (sec.id === initialHash || sec.querySelector('#' + CSS.escape(initialHash)))) {
      open = true;
      hashOpened = true;
      if (isPhoneScreen()) phoneOpen[key] = true;
      requestAnimationFrame(() => sec.scrollIntoView({ block: 'start' }));
    }
    sec.classList.add('collapsible');
    sec.classList.toggle('collapsed', !open);
    head.classList.add('collapse-head');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'collapse-btn';
    btn.setAttribute('aria-controls', body.id);
    btn.setAttribute('aria-expanded', String(open));
    btn.innerHTML = ICONS.chevron + `<span class="sr-only">${L('הצגה או הסתרה', 'Show or hide')}</span>`;
    // the arrow sits at the header's end, inside its padding; the header makes room for it
    const pad = parseFloat(getComputedStyle(head).paddingInlineEnd) || 0;
    btn.style.insetInlineEnd = pad + 'px';
    head.style.paddingInlineEnd = (pad + 44) + 'px';
    head.appendChild(btn);

    const toggle = () => {
      const nowOpen = sec.classList.contains('collapsed');
      sec.classList.add('animating');
      sec.classList.toggle('collapsed', !nowOpen);
      btn.setAttribute('aria-expanded', String(nowOpen));
      rememberSection(key, nowOpen);
      setTimeout(() => sec.classList.remove('animating'), 280);
    };
    btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
    // the whole header is clickable, except the controls that live inside it
    head.addEventListener('click', e => {
      if (e.target.closest('a, input, select, textarea, label, button, [onclick]')) return;
      toggle();
    });
  });
}
function setAllSections(open) {
  const saved = {};
  document.querySelectorAll('#main [data-collapse]').forEach(sec => { saved[sec.dataset.collapse] = open; });
  save(COLLAPSE_KEY, { ...load(COLLAPSE_KEY, {}), ...saved });
}

// Every page re-draws through renderPage(); fold the marked sections after each draw
document.addEventListener('DOMContentLoaded', () => {
  const draw = window.renderPage;
  if (typeof draw === 'function') {
    window.renderPage = function () {
      const result = draw.apply(this, arguments);
      enhanceCollapsibles();
      return result;
    };
  }
});
document.addEventListener('DOMContentLoaded', renderAll);
document.addEventListener('DOMContentLoaded', () => { if (!window.AUTH_PAGE) openJustifyFromHash(); });
</script>
<script>
/* ===================== Page code ===================== */
window.PAGE_KEY = 'grades';

const gb = { feedbackFor: null, examEdit: null, showAllAttendance: false };

const COMPONENTS = [
  { key: 'exam', color: '#F43F5E', icon: '📋', he: 'מבחנים', en: 'Exams' },
  { key: 'participation', color: '#3B82F6', icon: '🙋', he: 'השתתפות', en: 'Participation' },
  { key: 'assignments', color: '#7C3AED', icon: '📄', he: 'מטלות', en: 'Assignments' },
];

function letter(v) { return v >= 90 ? 'A' : v >= 80 ? 'B' : v >= 70 ? 'C' : 'D'; }
function verdict(v) {
  return v >= 90 ? L('מצוין', 'Excellent') : v >= 80 ? L('טוב', 'Good') : v >= 70 ? L('מספק', 'Satisfactory') : L('טעון שיפור', 'Needs Work');
}
function scoreText(v) { return typeof v === 'number' ? v : '—'; }
function scoreColor(v, fallback) { return typeof v === 'number' ? (fallback || gradeColor(v)) : 'var(--muted)'; }

/* ================= Teacher ================= */
/* Weights are whole percents per class. While typing, each one moves on its own and the
   total may be above or below 100; on Save they are scaled proportionally to exactly 100. */
const WEIGHT_KEYS = COMPONENTS.map(c => c.key);

function normalizePct(p) {
  const vals = WEIGHT_KEYS.map(k => Math.max(0, Math.round(Number(p[k]) || 0)));
  const sum = vals.reduce((a, b) => a + b, 0);
  if (sum === 0) return { ...DEFAULT_WEIGHTS };
  const scaled = vals.map(v => Math.round(v * 100 / sum));
  scaled[scaled.indexOf(Math.max(...scaled))] += 100 - scaled.reduce((a, b) => a + b, 0);
  return Object.fromEntries(WEIGHT_KEYS.map((k, i) => [k, scaled[i]]));
}
gb.pct = normalizePct(classWeights(state.classId));
function pctTotal() { return WEIGHT_KEYS.reduce((sum, k) => sum + gb.pct[k], 0); }

function setPct(key, value) {
  const v = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  gb.pct[key] = v;
  const range = document.getElementById('wr-' + key);
  const num = document.getElementById('wv-' + key);
  range.value = v;
  range.style.setProperty('--v', v + '%');
  if (document.activeElement !== num) num.value = v;
  updateTeacherNumbers();
}

function weightSlider(c) {
  const v = gb.pct[c.key];
  return `
  <div class="col gap-2">
    <div class="flex items-center justify-between">
      <span class="sm w7">${c.icon} ${L(c.he, c.en)}</span>
      <span class="flex items-center gap-1 mono w7 sm" style="color:${c.color}">
        <input id="wv-${c.key}" type="number" min="0" max="100" step="1" value="${v}" class="pct-input mono" style="color:${c.color}"
          aria-label="${L(c.he, c.en)} %" oninput="setPct('${c.key}', this.value)" onchange="this.value = gb.pct['${c.key}']" onkeydown="if(event.key==='Enter')this.blur()">%
      </span>
    </div>
    <input id="wr-${c.key}" type="range" min="0" max="100" step="1" value="${v}" class="range" style="--c:${c.color};--v:${v}%"
      oninput="setPct('${c.key}', this.value)">
  </div>`;
}

function balanceChip() {
  const total = pctTotal();
  if (total === 100) return `<span class="chip" style="background:#10B98120;color:#10B981">${ICONS.check} ${L('סה״כ 100%', 'Total 100%')}</span>`;
  if (total === 0) return `<span class="chip" style="background:#F43F5E20;color:#F43F5E">⚠️ ${L('סה״כ 0%', 'Total 0%')}</span>`;
  return `<span class="chip" style="background:#F59E0B20;color:#B45309" title="${L('בשמירה המשקלים יותאמו באופן יחסי ל־100%', 'On save the weights are scaled proportionally to 100%')}">
    ${L(`סה״כ ${total}% · יותאם ל־100% בשמירה`, `Total ${total}% · scaled to 100% on save`)}</span>`;
}

// Live preview of final grades while the sliders move (before saving)
function updateTeacherNumbers() {
  document.getElementById('balance').innerHTML = balanceChip();
  COMPONENTS.forEach(c => {
    const total = pctTotal() || 1;   // the bar always shows each part's share of the whole
    document.getElementById('seg-' + c.key).style.width = (gb.pct[c.key] / total * 100) + '%';
    document.querySelectorAll('.th-' + c.key).forEach(el => { el.textContent = gb.pct[c.key]; });
  });
  (gb.rowParts || []).forEach((parts, i) => {
    const f = finalFrom(parts, gb.pct);
    const el = document.getElementById('final-' + i);
    el.textContent = scoreText(f);
    el.style.color = scoreColor(f);
  });
}

function saveWeights() {
  const total = pctTotal();
  if (total === 0) {
    toast(L('יש לתת משקל לפחות לרכיב אחד', 'Give at least one category a weight'));
    return;
  }
  const scaled = total !== 100;
  gb.pct = normalizePct(gb.pct);      // proportional, whole numbers, exactly 100
  saveClassWeights(state.classId, gb.pct);
  renderPage();
  toast(scaled
    ? L(`המשקלים הותאמו ל־100% ונשמרו: מבחנים ${gb.pct.exam}% · השתתפות ${gb.pct.participation}% · מטלות ${gb.pct.assignments}%`,
        `Weights scaled to 100% and saved: exams ${gb.pct.exam}% · participation ${gb.pct.participation}% · assignments ${gb.pct.assignments}%`)
    : L('המשקלים נשמרו – הציונים הסופיים עודכנו', 'Weights saved – final grades updated'));
}

/* ---------- Participation grade: decided by the teacher ---------- */
function setParticipation(i, name, el) {
  const raw = el.value.trim();
  const n = Number(raw);
  if (raw !== '' && (!Number.isInteger(n) || n < 0 || n > 100)) {
    el.classList.add('invalid');
    toast(L('ציון השתתפות: מספר שלם בין 0 ל־100', 'Participation grade: a whole number from 0 to 100'));
    return;
  }
  el.classList.remove('invalid');
  const value = raw === '' ? null : n;
  setParticipationGrade(state.classId, name, value);
  gb.rowParts[i].participation = value;
  const f = finalFrom(gb.rowParts[i], gb.pct);
  const cell = document.getElementById('final-' + i);
  cell.textContent = scoreText(f);
  cell.style.color = scoreColor(f);
  toast(value === null ? L('ציון ההשתתפות הוסר', 'Participation grade cleared') : L(`ציון השתתפות נשמר: ${localize(name)} · ${value}`, `Participation grade saved: ${name} · ${value}`));
}

/* ---------- Personal feedback from the teacher (per class) ---------- */
function feedbackPanel() {
  if (gb.feedbackFor === null) return '';
  const name = gb.feedbackFor;
  const g = computeGrade(state.classId, name, gb.pct);
  return `
  <div class="modal-bg" onmousedown="if(event.target===this)closeFeedback()">
    <div class="card r-3xl p-6 modal fade-up">
      <div class="flex items-center justify-between mb-4">
        <h3 class="display w8 lg">${L('משוב עבור', 'Feedback for')} ${esc(localize(name))}</h3>

function openExam(id) {
  const existing = id ? classExams(state.classId).find(e => e.id === id) : null;
  const grades = {};
  classRoster().forEach(n => { grades[n] = existing && typeof existing.grades[n] === 'number' ? String(existing.grades[n]) : ''; });
  gb.examEdit = existing
    ? { id: existing.id, title: localize(existing.title), date: existing.date, grades, isNew: false, fresh: true }
    : { id: 'ex-' + Date.now(), title: '', date: new Date().toISOString().slice(0, 10), grades, isNew: true, fresh: true };
  renderPage();
  document.getElementById('exam-title').focus();
}
function closeExam() { gb.examEdit = null; renderPage(); }
function examInput(name, el) {
  gb.examEdit.grades[name] = el.value;
  const v = el.value.trim();
  el.classList.toggle('invalid', v !== '' && !(Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 100));
}
function saveExam() {
  const e = gb.examEdit;
  e.title = document.getElementById('exam-title').value.trim();
  e.date = document.getElementById('exam-date').value;
  const err = document.getElementById('exam-error');
  if (!e.title) { err.textContent = L('יש לתת שם למבחן', 'Please name the exam'); return; }
  if (!e.date) { err.textContent = L('יש לבחור תאריך', 'Please pick a date'); return; }
  const grades = {};
  for (const [name, raw] of Object.entries(e.grades)) {
    const v = String(raw).trim();
    if (v === '') continue;
    const n = Number(v);
    if (!Number.isInteger(n) || n < 0 || n > 100) {
      err.textContent = L(`ציון לא תקין עבור ${localize(name)} – מספר שלם בין 0 ל־100`, `Invalid grade for ${name} – a whole number from 0 to 100`);
      return;
    }
    grades[name] = n;
  }
  if (!Object.keys(grades).length) { err.textContent = L('יש להזין לפחות ציון אחד', 'Enter at least one grade'); return; }

  const all = load(EXAMS_KEY, []);
  const index = all.findIndex(x => x.id === e.id);
  const before = index >= 0 ? all[index].grades : {};
  const record = { id: e.id, classId: state.classId, title: e.title, date: e.date, grades, createdBy: currentUserName() };
  if (index >= 0) all[index] = record; else all.push(record);
  save(EXAMS_KEY, all);
  // students with an account are told about a new or changed exam grade
  loadUsers().filter(u => u.role === 'student' && u.status === 'active').forEach(u => {
    const name = fullName(u);
    if (typeof grades[name] === 'number' && grades[name] !== before[name]) {
      sendInbox(u.id, 'exam-grade', CURRENT_USER.id, { title: e.title, grade: grades[name], classId: state.classId });
    }
  });
  gb.examEdit = null;
  renderPage();
  toast(L('ציוני המבחן נשמרו – הציונים הסופיים עודכנו', 'Exam grades saved – final grades updated'));
}

  save(EXAMS_KEY, load(EXAMS_KEY, []).filter(e => e.id !== id));

function gradeSubmission(id, prefix = 'r') {
  const input = document.getElementById(prefix + 'g-' + id);
  const raw = input.value.trim();
  const grade = Number(raw);
  if (raw === '' || !Number.isFinite(grade) || grade < 0 || grade > 100) {
    input.focus();
    input.classList.add('invalid');
    toast(L('יש להזין ציון בין 0 ל־100', 'Enter a grade between 0 and 100'));
    return;
  }
  const item = gb.queue.find(q => q.id === id);
  const graded = load('cs-graded', []);
  const { files, ...record } = item;   // keep big uploads out of the graded log
  graded.push({ ...record, fileNames: submissionFiles(item).map(f => f.name), grade: Math.round(grade),
    feedback: document.getElementById(prefix + 'f-' + id).value.trim(),
    gradedAt: new Date().toISOString(), gradedBy: currentUserName() });
  save('cs-graded', graded);
  // let the student know (their grade and feedback appear on their Tasks page)
  const studentAccount = loadUsers().find(u => u.role === 'student' && fullName(u) === item.student);
  const assignment = findAssignment(item.assignmentId);
  if (studentAccount) sendInbox(studentAccount.id, 'graded', CURRENT_USER.id, { title: assignment ? localize(assignment.title) : '', grade: Math.round(grade) });
  if (gb.viewing === id) {
    const mine = myQueue();
    const index = mine.findIndex(q => q.id === id);
    const next = mine[index + 1] || mine[index - 1];
    gb.viewing = next ? next.id : null;
    gb.viewFile = 0;
  }
  gb.queue = gb.queue.filter(q => q.id !== id);
  saveReviewQueue(gb.queue);
  gb.highlightReview = false;
  if (!myQueue().some(q => q.assignmentId === gb.reviewFilter)) gb.reviewFilter = 'all';
  renderPage();
  toast(L(`הציון של ${localize(item.student)} נשמר`, `Grade saved for ${item.student}`));
}
