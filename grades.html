// Demo submissions get generated documents; real uploads (from the student
// home page) carry their own files as data URLs.
const ESSAY_LINES = [
  'The cell membrane is a phospholipid bilayer that separates the inside of the cell from its environment.',
  'Its hydrophilic heads face the water on both sides, while the hydrophobic tails point inward.',
  'Proteins embedded in the membrane act as channels, carriers and receptors.',
  'Small non-polar molecules such as oxygen cross by simple diffusion, while ions need protein channels.',
  'Active transport, like the sodium-potassium pump, uses ATP to move substances against their gradient.',
  'The fluid mosaic model explains why the membrane is flexible yet selective.',
];
const QUIZ_QUESTIONS = [
  ['Where in the cell does photosynthesis take place?', ['In the chloroplasts', 'In the chloroplast', 'In the mitochondria']],
  ['Which gas is released as a by-product?', ['Oxygen (O₂)', 'Oxygen', 'Carbon dioxide']],
  ['What pigment absorbs light energy?', ['Chlorophyll', 'Chlorophyll a and b', 'Carotene']],
  ['Write the overall equation.', ['6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂', '6CO₂ + 6H₂O + light → glucose + 6O₂', 'CO₂ + H₂O → sugar']],
  ['Name the two stages.', ['Light reactions and the Calvin cycle', 'Light-dependent and light-independent reactions', 'Glycolysis and Krebs cycle']],
];

function mockFiles(q) {
  const first = q.student.split(' ')[0];
  const i = Math.max(0, STUDENT_ROSTER.indexOf(q.student));
  const head = title => `<h1>${title}</h1><p class="doc-meta">${esc(q.student)} · Biology 11A · Dr. Levi</p>`;
  if (q.assignmentId === 'a1') {
    const paras = ESSAY_LINES.slice(0, 4 + (i % 3)).map((line, n) => `<p>${line}${n === 0 && i % 2 ? ' In this essay I explain how its structure fits its function.' : ''}</p>`).join('');
    const files = [{ name: `Cell_Membrane_Essay_${first}.doc`, kind: 'doc', html: head('The Cell Membrane') + paras }];
    if (i % 3 === 2) files.push({ name: `membrane_diagram_${first}.svg`, kind: 'svg', svg: membraneSvg() });
    return files;
  }
  if (q.assignmentId === 'a2') {
    const rows = QUIZ_QUESTIONS.map(([question, answers], n) => `<li><b>${question}</b><br>${answers[(i + n) % 4 === 3 ? 2 : (i + n) % 2]}</li>`).join('');
    return [{ name: `Photosynthesis_Quiz_${first}.doc`, kind: 'doc', html: head('Photosynthesis Quiz – Answers') + `<ol>${rows}</ol>` }];
  }
  const parts = ['Explain osmosis using a plant cell example.', 'Compare active and passive transport.', 'Describe an experiment that tests membrane permeability.'];
  return [{ name: `Bagrut_Prep_${first}.doc`, kind: 'doc', html: head('Bagrut Prep Exam') +
    parts.map((p, n) => `<h2>Question ${n + 1}</h2><p><i>${p}</i></p><p>${ESSAY_LINES[(i + n * 2) % ESSAY_LINES.length]} ${ESSAY_LINES[(i + n * 2 + 1) % ESSAY_LINES.length]}</p>`).join('') }];
}

function membraneSvg() {
  const heads = Array.from({ length: 12 }, (_, n) => {
    const x = 30 + n * 28;
    return `<circle cx="${x}" cy="60" r="9" fill="#60A5FA"/><line x1="${x - 3}" y1="69" x2="${x - 3}" y2="96" stroke="#F59E0B" stroke-width="3"/><line x1="${x + 3}" y1="69" x2="${x + 3}" y2="96" stroke="#F59E0B" stroke-width="3"/>`
      + `<circle cx="${x}" cy="140" r="9" fill="#60A5FA"/><line x1="${x - 3}" y1="104" x2="${x - 3}" y2="131" stroke="#F59E0B" stroke-width="3"/><line x1="${x + 3}" y1="104" x2="${x + 3}" y2="131" stroke="#F59E0B" stroke-width="3"/>`;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220"><rect width="380" height="220" fill="#fff"/>${heads}`
    + `<rect x="160" y="48" width="44" height="104" rx="18" fill="#A78BFA" opacity=".85"/><text x="182" y="185" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#4C1D95">channel protein</text>`
    + `<text x="190" y="28" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E1B4B">Phospholipid bilayer</text></svg>`;
}

function submissionFiles(q) { return q.files && q.files.length ? q.files : mockFiles(q); }

function fileIcon(f) {
  const type = f.type || '';
  if (f.kind === 'svg' || type.startsWith('image/')) return '🖼️';
  if (type === 'application/pdf') return '📕';
  return '📄';
}
function fileSize(f) {
  const bytes = f.size || (f.html || f.svg || '').length;
  return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
}
function isTextFile(f) {
  return /^text\//.test(f.type || '') || /\.(txt|md|csv|json)$/i.test(f.name);
}

function filePreview(f) {
  if (f.kind === 'doc') return `<article class="doc-page">${f.html}</article>`;
  if (f.kind === 'svg') return `<div class="img-page"><img alt="${esc(f.name)}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(f.svg)}"></div>`;
  if ((f.type || '').startsWith('image/')) return `<div class="img-page"><img alt="${esc(f.name)}" src="${f.dataUrl}"></div>`;
  if (f.type === 'application/pdf') return `<iframe class="pdf-frame" id="pdf-frame" title="${esc(f.name)}"></iframe>`;
  if (isTextFile(f)) return `<pre class="doc-page text-file" id="text-file">…</pre>`;
  return `<div class="col items-center justify-center gap-3 p-8 text-center"><span style="font-size:2.5rem">${fileIcon(f)}</span>
    <p class="sm muted">${L('אין תצוגה מקדימה לסוג קובץ זה – אפשר להוריד אותו.', 'No preview for this file type – you can download it.')}</p></div>`;
}

// PDFs and text need a little async work after the modal is in the DOM
function hydratePreview(f) {
  if (!f.dataUrl) return;
  if (f.type === 'application/pdf' || isTextFile(f)) {
    fetch(f.dataUrl).then(r => r.blob()).then(blob => {
      if (f.type === 'application/pdf') {
        if (gb.blobUrl) URL.revokeObjectURL(gb.blobUrl);
        gb.blobUrl = URL.createObjectURL(blob);
        const frame = document.getElementById('pdf-frame');
        if (frame) frame.src = gb.blobUrl;
      } else {
        blob.text().then(text => { const el = document.getElementById('text-file'); if (el) el.textContent = text; });
      }
    });
  }
}

function downloadFile(index) {
  const f = submissionFiles(gb.queue.find(q => q.id === gb.viewing))[index];
  let href = f.dataUrl;
  let revoke = false;
  if (f.kind === 'doc') {
    const html = `<html><head><meta charset="utf-8"><title>${esc(f.name)}</title></head><body>${f.html}</body></html>`;
    href = URL.createObjectURL(new Blob(['\ufeff' + html], { type: 'application/msword' }));
    revoke = true;
  } else if (f.kind === 'svg') {
    href = URL.createObjectURL(new Blob([f.svg], { type: 'image/svg+xml' }));
    revoke = true;
  }
  const a = document.createElement('a');
  a.href = href;
  a.download = f.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (revoke) setTimeout(() => URL.revokeObjectURL(href), 1000);
}

function openInTab(index) {
  const f = submissionFiles(gb.queue.find(q => q.id === gb.viewing))[index];
  const blobPromise = f.kind === 'svg'
    ? Promise.resolve(new Blob([f.svg], { type: 'image/svg+xml' }))
    : fetch(f.dataUrl).then(r => r.blob());
  const tab = window.open('', '_blank');   // open synchronously so pop-up blockers allow it
  blobPromise.then(blob => {
    const url = URL.createObjectURL(blob);
    if (tab) tab.location.href = url; else window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
}

  gb.pct = gb.pct && gb.pctClass === state.classId ? gb.pct : normalizePct(classWeights(state.classId));
  gb.pctClass = state.classId;
  document.getElementById('main').innerHTML = `
    <h1 class="display w8 x2">${teacher ? L('📊 יומן ציונים', '📊 Gradebook') : L('📈 הציונים שלי', '📈 My Grades')}</h1>
    ${teacher ? teacherView() : studentView()}
  `;
  // animate the grade ring after paint
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.ring-arc').forEach(el => { el.style.strokeDashoffset = el.dataset.target; });
  }));
  if (teacher && gb.viewing) {
    const q = gb.queue.find(x => x.id === gb.viewing);
    if (q) {
      const files = submissionFiles(q);
      hydratePreview(files[Math.min(gb.viewFile, files.length - 1)]);
      document.getElementById('vg-' + q.id)?.focus({ preventScroll: true });
    }
  }
  // arriving from the home page "awaiting review" card
  if (gb.highlightReview && teacher) {
    document.getElementById('review').scrollIntoView({ block: 'start' });
    history.replaceState(null, '', location.pathname);
    gb.highlightReview = false;
    document.querySelector('.review-row input')?.focus({ preventScroll: true });
  }
  // arriving from a Mashov notification
  if (!teacher && location.hash === '#attendance') {
    document.getElementById('attendance').scrollIntoView({ block: 'start' });
    history.replaceState(null, '', location.pathname);
  }
}
</script>
</body>
</html>
