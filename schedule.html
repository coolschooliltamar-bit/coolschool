<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>CoolSchool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===================== Shared styles ===================== */
/* ============ Theme tokens ============ */
:root {
  --bg: #F0EFFF;
  --surface: #E8E6FF;
  --card: #FFFFFF;
  --border: #DDD9FF;
  --primary: #7C3AED;
  --primary-fg: #FFFFFF;
  --accent: #10B981;
  --accent-fg: #FFFFFF;
  --text: #1E1B4B;
  --muted: #6B6E9A;
  --amber: #F59E0B;
  --rose: #F43F5E;
  --sky: #38BDF8;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html.dark {
  --bg: #0D0D1A;
  --surface: #13132A;
  --card: #1A1A32;
  --border: #2E2E50;
  --primary: #8B5CF6;
  --primary-fg: #FFFFFF;
  --accent: #34D399;
  --accent-fg: #0D0D1A;
  --text: #EEECFF;
  --muted: #8884B0;
}

/* ============ Base ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html[data-font-size='small'] { font-size: 0.875rem; }
html[data-font-size='medium'] { font-size: 1rem; }
html[data-font-size='large'] { font-size: 1.125rem; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  transition: background-color .2s ease, color .2s ease;
  -webkit-font-smoothing: antialiased;
}
html[dir='rtl'] body { text-align: right; }
html[lang='he'] body, html[lang='he'] body *:not(.mono),
html[lang='ar'] body, html[lang='ar'] body *:not(.mono) {
  font-family: 'Heebo', var(--font-body);
}
h1, h2, h3, h4, .display { font-family: var(--font-display); }
.mono, code, pre { font-family: var(--font-mono); }
html[dir='rtl'] .mono { direction: ltr; unicode-bidi: isolate; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input, select, textarea { font: inherit; color: var(--text); }
::placeholder { color: var(--muted); opacity: .8; }
svg { display: block; }

::-webkit-scrollbar { width: 0.375rem; height: 0.375rem; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0.1875rem; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ============ App shell ============ */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.shell { display: flex; flex: 1; overflow: hidden; }
.page {
  flex: 1; overflow-y: auto; padding: 1rem;
  display: flex; flex-direction: column; gap: 1.25rem;
}
@media (min-width: 768px) { .page { padding: 1.5rem; } }
.page > * { flex-shrink: 0; }

/* Header */
.header {
  height: 4rem; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem;
  background: var(--card); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.logo { display: flex; align-items: center; gap: 0.5rem; }
.logo-mark {
  width: 2rem; height: 2rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 0.875rem;
  background: linear-gradient(135deg, #7C3AED, #10B981);
}
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--primary); }
.dd { position: relative; }
.dd-menu {
  position: absolute; top: 100%; margin-top: 0.5rem; border-radius: 1rem; overflow: hidden; z-index: 60;
  background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 1.25rem 1.5625rem -0.3125rem rgba(0,0,0,.12), 0 0.5rem 0.625rem -0.375rem rgba(0,0,0,.1);
}
.dd-menu.start { inset-inline-start: 0; }
.dd-menu.end { inset-inline-end: 0; }
.class-pill {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; border-radius: 0.75rem;
  font-size: 0.875rem; font-weight: 600; transition: opacity .15s;
}
.class-pill:hover { opacity: .8; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
.menu-item {
  width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
  font-size: 0.875rem; text-align: start; transition: opacity .15s;
}
.menu-item:hover { opacity: .8; }
.icon-btn {
  width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
  background: var(--surface); position: relative; transition: opacity .15s;
}
.icon-btn:hover { opacity: .7; }
.icon-btn svg { width: 1.25rem; height: 1.25rem; }
.count-badge {
  position: absolute; top: -0.25rem; inset-inline-end: -0.25rem; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: var(--rose); color: #fff; font-size: 0.75rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.role-toggle { display: none; align-items: center; gap: 0.25rem; padding: 0.25rem; border-radius: 0.75rem; background: var(--surface); }
.role-toggle button { padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--muted); transition: all .15s; }
.role-toggle button.on { background: var(--primary); color: var(--primary-fg); }
@media (min-width: 768px) { .role-toggle { display: flex; } }
.avatar {
  width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; color: #fff; font-family: var(--font-display); font-weight: 700;
  font-size: 0.875rem; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #7C3AED, #EC4899);
}
.profile-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem; padding-inline-end: 0.75rem; border-radius: 0.75rem; background: var(--surface); }
.notif { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
.notif.unread { background: color-mix(in srgb, var(--primary) 7%, transparent); }

/* Sidebar */
.sidebar {
  width: 4rem; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1rem 0;
  background: var(--card); border-inline-end: 1px solid var(--border);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem; width: 3rem; padding: 0.625rem 0;
  border-radius: 1rem; color: var(--muted); transition: all .15s;
}
.nav-item:hover { background: var(--surface); }
.nav-item.on, .nav-item.on:hover { background: var(--primary); color: var(--primary-fg); }
.nav-item svg { width: 1.25rem; height: 1.25rem; }
.nav-item span { font-size: 0.625rem; font-weight: 700; display: none; }
@media (min-width: 768px) { .sidebar { width: 5rem; } .nav-item span { display: block; } }

/* ============ Building blocks ============ */
.card { background: var(--card); border: 1.5px solid var(--border); }
.surface { background: var(--surface); }
.r-lg { border-radius: 0.5rem; } .r-xl { border-radius: 0.75rem; } .r-2xl { border-radius: 1rem; } .r-3xl { border-radius: 1.5rem; }
.r-full { border-radius: 624.9375rem; }
.p-3 { padding: 0.75rem; } .p-4 { padding: 1rem; } .p-5 { padding: 1.25rem; } .p-6 { padding: 1.5rem; } .p-8 { padding: 2rem; }
.mt-1 { margin-top: 0.25rem; } .mt-2 { margin-top: 0.5rem; } .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-5 { margin-top: 1.25rem; }
.mb-1 { margin-bottom: 0.25rem; } .mb-2 { margin-bottom: 0.5rem; } .mb-3 { margin-bottom: 0.75rem; } .mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.25rem; }
.flex { display: flex; } .col { display: flex; flex-direction: column; } .wrap { flex-wrap: wrap; }
.items-center { align-items: center; } .items-start { align-items: flex-start; } .items-end { align-items: flex-end; }
.justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
.gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; } .gap-5 { gap: 1.25rem; } .gap-6 { gap: 1.5rem; }
.flex-1 { flex: 1; } .min-w-0 { min-width: 0; } .shrink-0 { flex-shrink: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.relative { position: relative; } .hidden { display: none !important; }
.text-center { text-align: center; } .text-start { text-align: start; } .text-end { text-align: end; }
.muted { color: var(--muted); } .primary { color: var(--primary); }
.xs { font-size: 0.75rem; } .sm { font-size: 0.875rem; } .base { font-size: 1rem; } .lg { font-size: 1.125rem; }
.xl { font-size: 1.25rem; } .x2 { font-size: 1.5rem; } .x3 { font-size: 1.875rem; } .x4 { font-size: 2.25rem; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; } .w8 { font-weight: 800; } .w9 { font-weight: 900; }
.leading-tight { line-height: 1.25; } .leading-relaxed { line-height: 1.625; }

.grid { display: grid; gap: 0.75rem; }
.g-1 { grid-template-columns: 1fr; } .g-2 { grid-template-columns: repeat(2, 1fr); } .g-3 { grid-template-columns: repeat(3, 1fr); }
.g-7 { grid-template-columns: repeat(7, 1fr); }
@media (min-width: 640px) {
  .sm-2 { grid-template-columns: repeat(2, 1fr); } .sm-3 { grid-template-columns: repeat(3, 1fr); }
  .sm-only { display: block; } .sm-row { flex-direction: row !important; }
}
@media (min-width: 768px) {
  .md-2 { grid-template-columns: repeat(2, 1fr); } .md-3 { grid-template-columns: repeat(3, 1fr); }
  .md-only { display: block; }
}
@media (min-width: 1024px) {
  .lg-2 { grid-template-columns: repeat(2, 1fr); } .lg-3 { grid-template-columns: repeat(3, 1fr); }
  .lg-4 { grid-template-columns: repeat(4, 1fr); } .lg-span-2 { grid-column: span 2; }
}
@media (max-width: 639px) { .sm-up { display: none !important; } }
@media (max-width: 767px) { .md-up { display: none !important; } }

.icon-tile {
  width: 2.5rem; height: 2.5rem; border-radius: 0.75rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
}
.letter-tile {
  border-radius: 0.75rem; flex-shrink: 0; color: #fff; font-family: var(--font-display); font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; font-weight: 700; padding: 2px 0.5rem; border-radius: 624.9375rem; }
.tag { font-size: 0.75rem; font-weight: 600; padding: 2px 0.375rem; border-radius: 0.375rem; }

.bar { height: 0.5rem; border-radius: 624.9375rem; overflow: hidden; background: var(--surface); }
.bar > span { display: block; height: 100%; border-radius: 624.9375rem; transition: width .6s ease; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; transition: opacity .15s, transform .15s;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-soft { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
.btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
.link-btn { font-size: 0.875rem; font-weight: 700; color: var(--primary); }
.link-btn:hover { opacity: .7; }
.btn svg { width: 1rem; height: 1rem; }

.input {
  width: 100%; padding: 0.625rem 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border);
  background: var(--surface); outline: none; font-size: 0.875rem; transition: box-shadow .15s, border-color .15s;
}
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 0.1875rem color-mix(in srgb, var(--primary) 25%, transparent); }
.input.on-card { background: var(--card); }
.label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--muted); }

.seg { display: flex; padding: 0.25rem; border-radius: 1rem; background: var(--surface); gap: 0.25rem; }
.seg button { flex: 1; padding: 0.625rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; color: var(--muted); transition: all .15s; }
.seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 0.5rem rgba(0,0,0,.08); }
.seg.small button { padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 0.5rem; flex: none; }

.hover-lift { transition: transform .15s, opacity .15s; cursor: pointer; }
.hover-lift:hover { transform: scale(1.02); }
.hover-fade { transition: opacity .15s; cursor: pointer; }
.hover-fade:hover { opacity: .8; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }

/* ============ Animations ============ */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
.spinner.violet { border-color: #C4B5FD; border-top-color: #6D28D9; }
@keyframes pulse { 50% { opacity: .4; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: .8; }
  70% { transform: scale(1.4); opacity: 0; }
  100% { transform: scale(1.4); opacity: 0; }
}
@keyframes fade-up { from { opacity: 0; transform: translateY(0.375rem); } to { opacity: 1; transform: none; } }
.fade-up { animation: fade-up .3s ease both; }
@keyframes xp-fill { from { width: 0%; } }
.xp-fill { animation: xp-fill 1.2s ease-out both; }

/* Toast */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100;
  background: var(--text); color: var(--card); padding: 0.625rem 1.125rem; border-radius: 0.75rem;
  font-size: 0.875rem; font-weight: 600; box-shadow: 0 0.625rem 1.875rem rgba(0,0,0,.2); animation: fade-up .25s ease both;
}

/* ============ Responsive: phones, tablets, desktops ============ */
/* Keep content readable on very wide monitors (modals stay full-screen) */
.page > :not(.modal-bg) { width: 100%; max-width: 90rem; margin-inline: auto; }

/* Touch screens: no sticky hover effects, and 16px inputs so iOS doesn't zoom */
@media (hover: none) {
  .hover-lift:hover, .stat-link:hover, .slot:hover, .live-join:hover { transform: none; }
}
@media (pointer: coarse) {
  .input, .score-input, .pct-input, select, textarea { font-size: max(1rem, 16px); }
}

/* Dialogs never taller than the visible screen (mobile address bars included) */
.modal, .viewer { max-height: calc(100dvh - 2rem); overflow-y: auto; }
.viewer { overflow-y: hidden; }
@media (max-height: 520px) { .modal-bg { padding: 0.5rem; } .modal, .viewer { max-height: calc(100dvh - 1rem); } }

/* Role switch inside the profile menu, for screens where the header toggle is hidden */
.menu-role { display: none; padding: 0.625rem 1rem; border-bottom: 1px solid var(--border); }
@media (max-width: 767px) { .menu-role { display: block; } }

/* Phones: compact header and a bottom tab bar instead of the side rail */
@media (max-width: 639px) {
  .header { padding: 0 0.75rem; gap: 0.5rem; padding-top: env(safe-area-inset-top); height: calc(3.5rem + env(safe-area-inset-top)); }
  .logo-mark { width: 2rem; height: 2rem; }
  .icon-btn { width: 2.25rem; height: 2.25rem; }
  .profile-btn { padding-inline-end: 4px; }
  .sidebar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 45; width: 100%; height: auto;
    flex-direction: row; justify-content: space-around; gap: 0;
    padding: 0.375rem 0.25rem calc(0.375rem + env(safe-area-inset-bottom));
    border-inline-end: none; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .nav-item { flex: 1; width: auto; min-width: 0; padding: 0.375rem 0; border-radius: 0.75rem; }
  .nav-item span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page { padding: 0.875rem; padding-bottom: calc(5rem + env(safe-area-inset-bottom)); gap: 1rem; }
  .toast { bottom: calc(5rem + env(safe-area-inset-bottom)); max-width: calc(100vw - 2rem); text-align: center; }
  .dd-menu { max-width: calc(100vw - 1.5rem); }
  .x2 { font-size: 1.3rem; } .x3 { font-size: 1.6rem; }
}

/* Short landscape phones: slimmer header so content gets the height */
@media (max-height: 480px) and (orientation: landscape) {
  .header { height: 3.25rem; }
  .page { padding-top: 0.75rem; }
}

/* Grid children may shrink below their content width (prevents overflow on phones) */
.grid > * { min-width: 0; }
.btn { white-space: nowrap; }
.section-head { flex-wrap: wrap; gap: 0.25rem 0.75rem; }

/* Short landscape screens (phones on their side): compact side rail that never clips */
@media (max-height: 480px) and (min-width: 640px) {
  .sidebar { gap: 0.25rem; padding: 0.5rem 0; overflow-y: auto; }
  .nav-item { padding: 0.5rem 0; }
  .nav-item span { display: none; }
}

/* Phones: compact stat tiles */
@media (max-width: 639px) {
  .stat-wide { grid-column: 1 / -1; }
  .stat-tile { padding: 0.75rem; gap: 0.5rem; }
  .stat-tile .icon-tile { width: 2.25rem; height: 2.25rem; font-size: 1.1rem; }
  .stat-tile .xl { font-size: 1.1rem; }
}

/* ===================== Page styles ===================== */
/* Weekly timetable grid */
.week { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
@media (max-width: 639px) { .week-row { min-width: 34rem; } }
.week-row { display: grid; grid-template-columns: 3.5rem repeat(5, 1fr); min-height: 4rem; }
.week-row.head { min-height: 0; }
.week-cell { border-bottom: 1px solid var(--border); }
.week-cell + .week-cell { border-inline-start: 1px solid var(--border); }
.week-row.head .week-cell { background: var(--surface); border-bottom-width: 1.5px; padding: 0.75rem; }
.day-head { text-align: center; }
.time { display: flex; justify-content: center; padding-top: 0.5rem; }
.slot-cell { position: relative; padding: 0.375rem; }
.slot {
  display: block; width: 100%; height: 100%; text-align: start; padding: 0.5rem; border-radius: 0.75rem;
  border: 1.5px solid; transition: transform .15s, box-shadow .15s; position: relative; z-index: 1;
}
.slot:hover { transform: scale(1.02); }
.slot.selected { box-shadow: 0 0 0 0.1875rem var(--c); }

/* Mini calendar */
.cal-nav button {
  width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center;
  background: var(--surface); transition: opacity .15s;
}
.cal-nav button:hover { opacity: .7; }
html[dir='rtl'] .cal-nav svg { transform: scaleX(-1); }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 0.75rem; transition: opacity .15s, box-shadow .15s;
}
.cal-day:hover { opacity: .8; }
.cal-day.has-events { background: var(--surface); }
.cal-day.today { background: var(--primary); }
.cal-day.today span { color: #fff; }
.cal-day.selected { box-shadow: inset 0 0 0 2px var(--primary); }

/* Delete button for teacher events */
.del-btn {
  width: 1.5rem; height: 1.5rem; border-radius: 0.5rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: background .15s, color .15s;
}
.del-btn:hover { background: #F43F5E20; color: #F43F5E; }
.del-btn svg { width: 0.75rem !important; height: 0.75rem !important; }

/* Event category picker */
.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
@media (min-width: 640px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1024px) { .cat-grid { grid-template-columns: repeat(7, 1fr); } }
.cat-chip {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.625rem 0.5rem;
  border-radius: 0.875rem; border: 1.5px solid var(--border); background: var(--surface);
  font-size: 0.75rem; font-weight: 700; color: var(--muted); text-align: center; transition: all .15s;
}
.cat-chip:hover { border-color: var(--c); }
.cat-chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.cat-icon { font-size: 1.25rem; line-height: 1; }

@media (min-width: 768px) { .cal-day { aspect-ratio: auto; height: 2.75rem; } }

/* Lessons changed in the latest published timetable */
.slot-cell { display: flex; flex-direction: column; gap: 0.25rem; }
.slot.flagged { box-shadow: 0 0 0 2px #F59E0B88; }
.slot-flag { position: absolute; top: -0.45rem; inset-inline-end: 0.375rem; font-size: 0.625rem; font-weight: 800; padding: 0 0.375rem; border-radius: 9999px; background: #F59E0B; color: #fff; }
.slot-flag.added { background: #10B981; }

  const changes = [];
  const prev = new Map(before.map(s => [s.id, s]));
  const next = new Map(after.map(s => [s.id, s]));
  after.forEach(s => {
    const old = prev.get(s.id);
    if (!old) changes.push({ type: 'added', after: s });

  });
  before.forEach(s => { if (!next.has(s.id)) changes.push({ type: 'removed', before: s }); });
  return changes;
}

/* ================= Persistent state ================= */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
}

function loadUsers() { return load(USERS_KEY, null) || []; }
function saveUsers(users) { save(USERS_KEY, users); }
function fullName(u) { return `${u.firstName} ${u.lastName}`.trim(); }
function findUserByEmail(email) {
  const e = String(email).trim().toLowerCase();
  return loadUsers().find(u => u.email.toLowerCase() === e);
}

function newSalt() {
  const bytes = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(bytes) : bytes.forEach((_, i) => { bytes[i] = Math.random() * 256; });
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
}
// SHA-256 when the browser allows it; a simple fallback hash otherwise (e.g. plain http)
async function hashPassword(password, salt) {
  const text = salt + ':' + password;
  if (window.crypto && crypto.subtle) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return 'sha256:' + [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  return 'fnv:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

async function ensureSeedUsers() {
  if (load(USERS_KEY, null)) return;
  const users = [];
  for (const u of SEED_USERS) {
    const salt = newSalt();
    users.push({ ...u, salt, passwordHash: await hashPassword(DEMO_PASSWORD, salt), createdAt: '2026-09-01' });
  }
  saveUsers(users);
  save(INBOX_KEY, [{ id: 'm-seed', to: 'u-principal', kind: 'teacher-pending', about: 'u-shapiro', date: '2026-10-20', read: false }]);
}

function loadInbox() { return load(INBOX_KEY, []); }
function saveInbox(items) { save(INBOX_KEY, items); }
function sendInbox(to, kind, about, extra) {
  const inbox = loadInbox();
  inbox.unshift({ id: 'm-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), to, kind, about, date: new Date().toISOString(), read: false, ...(extra ? { extra } : {}) });
  saveInbox(inbox);
}
// Every active principal is told when a teacher signs up
function notifyPrincipals(kind, about) {
  loadUsers().filter(u => u.role === 'principal' && u.status === 'active').forEach(p => sendInbox(p.id, kind, about));
}

function startSession(user) { save(SESSION_KEY, { userId: user.id, at: Date.now() }); }
function signOut() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }

}

// Built-in sample notifications (demo accounts only) plus the user's own inbox
function inboxNotifs() {
  if (!CURRENT_USER) return [];
  const users = loadUsers();
  return loadInbox().filter(m => m.to === CURRENT_USER.id).map(m => {
    const about = users.find(u => u.id === m.about);
    const name = about ? localize(fullName(about)) : '';
    const base = { id: m.id, inbox: true, read: m.read, time: fmtDate(m.date, { day: 'numeric', month: 'short' }) };
    if (m.kind === 'teacher-pending') {
      return { ...base, type: 'approval', pendingUser: about && about.status === 'pending' ? about.id : null,
        text: L(`${name} נרשם/ה כמורה וממתין/ה לאישורך`, `${name} registered as a teacher and is waiting for your approval`) };
    }
    if (m.kind === 'timetable-updated') {
      const count = (m.extra && m.extra.count) || 0;
      return { ...base, type: 'timetable', link: 'schedule.html',
        text: L(`${name} עדכן/ה את מערכת השעות השבועית (${count} שינויים)`, `${name} updated the weekly timetable (${count} change${count === 1 ? '' : 's'})`) };
    }
    if (m.kind === 'graded') {
      const x = m.extra || {};
      return { ...base, type: 'grade', link: 'tasks.html',
        text: L(`${name} בדק/ה את "${x.title || ''}" · ציון ${x.grade}`, `${name} graded "${x.title || ''}" · ${x.grade}`) };
    }
    if (m.kind === 'teacher-approved') {
      return { ...base, type: 'approved', text: L('המנהל/ת אישר/ה את החשבון שלך. ברוכים הבאים!', 'The principal approved your account. Welcome!') };
    }
    return { ...base, type: 'info', text: L('ברוכים הבאים ל־CoolSchool!', 'Welcome to CoolSchool!') };
  });
}

  const demo = isDemoUser() ? (state.notifs[state.role] || []) : [];
  return inboxNotifs().concat(demo);

// A teacher only ever works inside the classes they teach
function enforceTeacherClass() {
  if (state.role === 'teacher' && teacherClasses().length && !teacherClasses().some(c => c.id === state.classId)) {
    state.classId = teacherClasses()[0].id;
  }
}

function t(key) { return translations[state.language][key]; }
function localize(value) { return state.language === 'he' ? (hebrewContent[value] ?? value) : value; }
function isHe() { return state.language === 'he'; }
function L(he, en) { return isHe() ? he : en; }
function currentClass() { return classes.find(c => c.id === state.classId); }
function teacherClasses() {
  if (CURRENT_USER && CURRENT_USER.role === 'teacher') return classes.filter(c => (CURRENT_USER.classIds || []).includes(c.id));
  return classes.filter(c => c.teacher === TEACHER_NAME);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function initials(name) { return localize(name).split(/[\s־-]/).map(n => n[0]).join('').slice(0, 2); }
function gradeColor(v) { return v >= 90 ? '#10B981' : v >= 75 ? '#3B82F6' : v >= 60 ? '#F59E0B' : '#F43F5E'; }
function daysUntil(date) { return Math.ceil((new Date(date).getTime() - Date.now()) / 86400000); }
function fmtDate(date, opts) { return new Date(date).toLocaleDateString(isHe() ? 'he-IL' : 'en-GB', opts); }

function setState(patch) {
  Object.assign(state, patch);
  enforceTeacherClass();
  save('cs-language', state.language);
  save('cs-dark', state.dark);
  save('cs-role', state.role);
  save('cs-class', state.classId);
  save('cs-font-size', state.fontSize);
  save('cs-notifs', state.notifs);
  renderAll();
}

function applyDocument() {
  const root = document.documentElement;
  root.lang = state.language;
  root.dir = state.language === 'en' ? 'ltr' : 'rtl';
  root.dataset.fontSize = state.fontSize;
  root.classList.toggle('dark', !!state.dark);
}

function toast(message) {
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

              <button class="${state.fontSize === s ? 'on' : ''}" style="flex:1;font-size:${0.75 + i * 0.125}rem"
                title="${t(s)}" onclick="setState({ fontSize: '${s}' })">A</button>`).join('')}
          </div>
        </div>
        ${['profile', 'settings', 'help', 'signOut'].map(item => `
          <button class="menu-item" style="padding:0.625rem 1rem;font-weight:500;color:${item === 'signOut' ? '#F43F5E' : 'var(--text)'}"
            onclick="profileAction('${item}')">${t(item)}</button>`).join('')}
      </div>` : ''}
    </div>
  </header>`;
}

function renderSidebar(active) {
  return `
  <aside class="sidebar">
    ${NAV.filter(navAllowed).map(item => `
      <a href="${item.href}" class="nav-item ${active === item.key ? 'on' : ''}" title="${t(item.key)}">
        ${ICONS[item.key]}
        <span>${t(item.key)}</span>
      </a>`).join('')}
  </aside>`;
}

const PRINCIPAL_PAGES = ['home', 'timetable', 'settings'];
// Students get Tasks instead of the learning path; teachers keep the path
function navAllowed(item) {
  if (isPrincipal()) return PRINCIPAL_PAGES.includes(item.key);
  if (item.key === 'timetable') return false;
  if (item.key === 'tasks') return state.role === 'student';
  if (item.key === 'path') return state.role === 'teacher';
  return true;
}

/* Principal approves or declines a teacher who signed up */
function reviewTeacher(id, approve) {
  if (!isPrincipal()) return;
  const users = loadUsers();
  const teacher = users.find(u => u.id === id && u.role === 'teacher');
  if (!teacher || teacher.status !== 'pending') return;
  teacher.status = approve ? 'active' : 'rejected';
  teacher.reviewedBy = CURRENT_USER.id;
  teacher.reviewedAt = new Date().toISOString();
  saveUsers(users);
  // the request is handled for every principal, not only the one who clicked
  saveInbox(loadInbox().map(m => (m.kind === 'teacher-pending' && m.about === id ? { ...m, read: true } : m)));
  if (approve) sendInbox(id, 'teacher-approved', CURRENT_USER.id);
  renderAll();
  toast(approve
    ? L(`${localize(fullName(teacher))} אושר/ה כמורה`, `${fullName(teacher)} was approved as a teacher`)
    : L(`הבקשה של ${localize(fullName(teacher))} נדחתה`, `${fullName(teacher)}'s request was declined`));
}
function approveTeacher(id) { reviewTeacher(id, true); }
function declineTeacher(id) { reviewTeacher(id, false); }

function toggleDd(name) {
  const open = !ui[name];
  ui.classes = ui.notifs = ui.profile = false;
  ui[name] = open;
  renderHeaderOnly();
}
function closeDropdowns() {
  if (ui.classes || ui.notifs || ui.profile) {
    ui.classes = ui.notifs = ui.profile = false;
    renderHeaderOnly();
  }
}
function pickClass(id) { ui.classes = false; setState({ classId: id }); }
function markAllRead() {
  if (CURRENT_USER) saveInbox(loadInbox().map(m => (m.to === CURRENT_USER.id ? { ...m, read: true } : m)));
  setState({ notifs: { ...state.notifs, [state.role]: (state.notifs[state.role] || []).map(n => ({ ...n, read: true })) } });
}
function profileAction(item) {
  ui.profile = false;
  if (item === 'settings') { location.href = 'settings.html'; return; }
  if (item === 'signOut') { signOut(); return; }
  renderHeaderOnly();
  toast(t(item));
}

document.addEventListener('mousedown', e => {
  if (!e.target.closest('[data-dd]')) closeDropdowns();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDropdowns(); });

/* ---------- Student: hand in work ---------- */
const MAX_UPLOAD_BYTES = 2 * 1024 * 1024;   // browser storage is small, keep demo uploads light

function mySubmission(assignmentId) {
  return reviewQueue().find(q => q.assignmentId === assignmentId && q.student === currentUserName())
    || load('cs-graded', []).find(g => g.assignmentId === assignmentId && g.student === currentUserName());
}

function submitControl(a) {
  const sub = mySubmission(a.id);
  const days = daysUntil(a.dueDate);
  return `
    <input type="file" id="up-${a.id}" multiple hidden onchange="uploadWork('${a.id}', this)">
    ${sub
      ? `<span class="xs w7" style="color:#10B981">✓ ${sub.grade !== undefined ? L(`נבדק · ${sub.grade}`, `Graded · ${sub.grade}`) : L('הוגש', 'Submitted')}</span>
         ${sub.grade === undefined ? `<button class="xs w7 primary" onclick="document.getElementById('up-${a.id}').click()">${L('הגשה מחדש', 'Resubmit')}</button>` : ''}`
      : `<button class="btn btn-primary btn-sm" onclick="document.getElementById('up-${a.id}').click()">⬆ ${L('הגשת עבודה', 'Upload work')}</button>
         <span class="xs w6" style="color:${days <= 2 ? '#F43F5E' : 'var(--muted)'}">${days <= 0 ? L('להגשה היום', 'Due today') : L(`נותרו ${days} ימים`, `${days}d left`)}</span>`}`;
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function uploadWork(assignmentId, input) {
  const picked = [...input.files];
  input.value = '';
  if (!picked.length) return;
  const total = picked.reduce((sum, f) => sum + f.size, 0);
  if (total > MAX_UPLOAD_BYTES) {
    toast(L('הקבצים גדולים מדי (עד 2MB בגרסת ההדגמה)', 'Files are too large (2 MB max in this demo)'));
    return;
  }
  let files;
  try {
    files = await Promise.all(picked.map(async f => ({ name: f.name, type: f.type, size: f.size, dataUrl: await readAsDataUrl(f) })));
  } catch (e) {
    toast(L('לא הצלחנו לקרוא את הקובץ', 'Could not read the file'));
    return;
  }
  const queue = reviewQueue().filter(q => !(q.assignmentId === assignmentId && q.student === currentUserName()));
  queue.push({ id: 's-' + Date.now(), assignmentId, student: currentUserName(), submittedAt: new Date().toISOString().slice(0, 10), files });
  try {
    localStorage.setItem('cs-review-queue', JSON.stringify(queue));
  } catch (e) {
    toast(L('אין מספיק מקום באחסון הדפדפן לקובץ הזה', 'Not enough browser storage for this file'));
    return;
  }
  renderPage();
  toast(L('העבודה הוגשה למורה', 'Your work was handed in'));
}

function allAssignments() { return load('cs-teacher-assignments', null) || assignments; }

/* Where the signed-in student stands on an assignment:
   'graded' (with grade + teacher feedback), 'submitted' (waiting for a grade) or 'todo'. */
function myTaskStatus(a) {
  const me = currentUserName();
  const graded = load('cs-graded', []).filter(g => g.assignmentId === a.id && g.student === me).pop();
  if (graded) return { state: 'graded', grade: graded.grade, feedback: graded.feedback, gradedAt: graded.gradedAt, gradedBy: graded.gradedBy, files: graded.fileNames || [] };
  // the built-in sample grades belong to the demo student
  if (isDemoUser() && a.submitted && typeof a.grade === 'number') return { state: 'graded', grade: a.grade, feedback: a.feedback || '', gradedBy: classTeachers(a.classId)[0], files: [] };
  const sub = reviewQueue().find(q => q.assignmentId === a.id && q.student === me);
  if (sub) return { state: 'submitted', submittedAt: sub.submittedAt, files: (sub.files || []).map(f => f.name) };
  return { state: 'todo' };
}

/* ================= Render loop ================= */
function renderHeaderOnly() {
  document.getElementById('header-slot').innerHTML = renderHeader();
}
function renderAll() {
  if (window.AUTH_PAGE) {
    applyDocument();
    window.renderPage();
    return;
  }
  if (!CURRENT_USER) return;
  if (isPrincipal() && !PRINCIPAL_PAGES.includes(window.PAGE_KEY)) { location.replace('index.html'); return; }
  if (!isPrincipal() && window.PAGE_KEY === 'timetable') { location.replace('schedule.html'); return; }
  if (state.role === 'student' && window.PAGE_KEY === 'path') { location.replace('tasks.html'); return; }
  if (state.role === 'teacher' && window.PAGE_KEY === 'tasks') { location.replace('index.html'); return; }
  applyDocument();
  renderHeaderOnly();
  document.getElementById('sidebar-slot').innerHTML = renderSidebar(window.PAGE_KEY);
  document.title = 'CoolSchool · ' + t(window.PAGE_KEY);
  const sessionCheck = load(SESSION_KEY, null);
  if (!sessionCheck || sessionCheck.userId !== CURRENT_USER.id) { location.replace('login.html'); return; }
  window.renderPage();
}
document.addEventListener('DOMContentLoaded', renderAll);
</script>
<script>
/* ===================== Page code ===================== */
window.PAGE_KEY = 'schedule';

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const DAYS_HE = ['יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי'];
const HOURS = [8, 9, 10, 11, 12, 13, 14, 15];
const YEAR = 2026;

const sched = {
  month: 8, selectedDay: null, selectedSlot: null,
  events: load('cs-events', []),
  showEventForm: false,
  draft: null,
  formError: '',
};
const EVENT_COLOR = '#14B8A6';

// Event categories a teacher can pick from. `detail` = asks which ceremony,
// `custom` = teacher names the category, `range` = start/end dates.
const EVENT_CATEGORIES = {
  quiz:     { he: 'בוחן', en: 'Quiz', icon: '⚡', color: '#3B82F6' },
  trip:     { he: 'טיול', en: 'Field trip', icon: '🚌', color: '#14B8A6' },
  bagrut:   { he: 'בחינת בגרות', en: 'Matriculation exam', icon: '🎓', color: '#F59E0B' },
  ceremony: { he: 'טקס', en: 'Ceremony', icon: '🎗️', color: '#EC4899', detail: true },
  parents:  { he: 'אסיפת הורים', en: 'Parent-teacher meeting', icon: '👪', color: '#8B5CF6' },
  holiday:  { he: 'חג / חופשה', en: 'Holiday / vacation', icon: '🏖️', color: '#10B981', range: true },
  custom:   { he: 'אירוע אחר', en: 'Custom event', icon: '📌', color: '#64748B', custom: true },
};
const MAX_RANGE_DAYS = 90;

function blankDraft(classId) {
  return { category: 'quiz', name: '', detail: '', date: '2026-09-14', endDate: '2026-09-14', time: '', classId: classId || '' };
}
sched.draft = blankDraft();

function catOf(e) { return EVENT_CATEGORIES[e.category] || EVENT_CATEGORIES.custom; }
function catLabel(key) { const c = EVENT_CATEGORIES[key]; return L(c.he, c.en); }

// What the event is called on the calendar
function eventTitle(e) {
  const cat = catOf(e);
  if (e.name) return e.name;
  if (cat.detail || cat.custom) return e.detail || L(cat.he, cat.en);
  return L(cat.he, cat.en);
}
// Small grey tag under the title: category (+ which ceremony / custom type)
function eventTag(e) {
  const cat = catOf(e);
  if (cat.custom) return e.detail || L(cat.he, cat.en);
  if (cat.detail && e.detail && e.name) return `${L(cat.he, cat.en)}: ${e.detail}`;
  return L(cat.he, cat.en);
}


function typeLabel(type) {
  return {
    homework: L('שיעורי בית', 'Homework'),
    exam: L('מבחן', 'Exam'),
    bagrut: L('בגרות', 'Bagrut'),
    quiz: L('בוחן', 'Quiz'),
  }[type];
}

// 'YYYY-MM-DD' as a local date, so ranges never shift across time zones
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysBetween(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }

// Assignments and teacher-created events, normalised into one calendar list
function calendarEntries() {
  const fromAssignments = allAssignments().map(a => ({
    kind: 'assignment', id: a.id, title: localize(a.title), date: a.dueDate,
    color: TYPE_COLORS[a.type], classId: a.classId, submitted: a.submitted, icon: '',
  }));
  const fromEvents = sched.events.map(e => {
    const cat = catOf(e);
    return {
      kind: 'event', id: e.id, title: eventTitle(e), tag: eventTag(e), date: e.date,
      endDate: cat.range && e.endDate && e.endDate > e.date ? e.endDate : null,
      time: cat.range ? '' : e.time, color: cat.color, icon: cat.icon, classId: e.classId, category: e.category,
    };
  });
  return fromAssignments.concat(fromEvents).filter(e => isMyClass(e.classId));
}

// Teachers only see lessons, assignments and events of the classes they teach
function isMyClass(classId) {
  return state.role !== 'teacher' || classId === 'all' || teacherClasses().some(c => c.id === classId);
}
function visibleTimetable() { return timetable.filter(s => isMyClass(s.classId)); }

function classLabel(classId) {
  if (classId === 'all') return L('כל הכיתות שלי', 'All my classes');
  const cls = classes.find(c => c.id === classId);
  return cls ? localize(cls.name) : '';
}

/* ---------- Teacher: add event ---------- */
function eventForm() {
  const tc = teacherClasses();
  const d = sched.draft;
  if (!d.classId) d.classId = tc[0].id;
  const cat = EVENT_CATEGORIES[d.category];

  const namePlaceholders = {
    quiz: L('לדוגמה: בוחן בפוטוסינתזה', 'e.g. Photosynthesis quiz'),
    trip: L('לדוגמה: סיור במוזיאון המדע', 'e.g. Science museum trip'),
    bagrut: L('לדוגמה: בגרות בביולוגיה – חלק א׳', 'e.g. Biology Bagrut – Part A'),
    ceremony: L('לא חובה – לדוגמה: טקס בבית הספר', 'Optional – e.g. School-wide ceremony'),
    parents: L('לדוגמה: אסיפת הורים מחצית א׳', 'e.g. First semester meeting'),
    holiday: L('לדוגמה: חופשת סוכות', 'e.g. Sukkot vacation'),
    custom: L('לא חובה – פרטים נוספים', 'Optional – more details'),
  };
  const nameOptional = cat.detail || cat.custom;

  return `
  <div class="card r-3xl p-5 fade-up" style="border-color:${cat.color}66">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="display w8">${L('אירוע חדש', 'New event')}</h3>
        <p class="xs muted">${L('האירוע יופיע בלוח השנה של כל תלמידי הכיתה', 'The event will appear on the calendar for everyone in the class')}</p>
      </div>
      <button class="icon-btn" style="width:2rem;height:2rem" onclick="toggleEventForm(false)">${ICONS.close}</button>
    </div>

    <label class="label">${L('סוג האירוע', 'Event type')}</label>
    <div class="cat-grid mb-4">
      ${Object.entries(EVENT_CATEGORIES).map(([key, c]) => `
        <button class="cat-chip ${d.category === key ? 'on' : ''}" style="--c:${c.color}" onclick="pickCategory('${key}')">
          <span class="cat-icon">${c.icon}</span><span>${L(c.he, c.en)}</span>
        </button>`).join('')}
    </div>

    <div class="grid g-1 sm-2 lg-4" style="gap:0.75rem">
      ${cat.detail ? `
      <div style="grid-column:1/-1">
        <label class="label">${L('איזה טקס? *', 'Which ceremony? *')}</label>
        <input id="ev-detail" class="input" maxlength="60" list="ceremony-list" value="${esc(d.detail)}"
          placeholder="${L('לדוגמה: טקס יום הזיכרון', 'e.g. Memorial Day ceremony')}" oninput="draftField('detail', this.value)">
        <datalist id="ceremony-list">
          ${(isHe()
            ? ['טקס יום הזיכרון', 'טקס יום השואה', 'טקס יום העצמאות', 'טקס פתיחת שנה', 'טקס סיום שנה', 'טקס הענקת תעודות', 'טקס יום רבין']
            : ['Memorial Day ceremony', 'Holocaust Remembrance Day ceremony', 'Independence Day ceremony', 'School year opening ceremony', 'End of year ceremony', 'Graduation ceremony', 'Rabin Memorial ceremony'])
            .map(o => `<option value="${o}">`).join('')}
        </datalist>
      </div>` : ''}
      ${cat.custom ? `
      <div style="grid-column:1/-1">
        <label class="label">${L('שם האירוע / הקטגוריה *', 'Event name / category *')}</label>
        <input id="ev-detail" class="input" maxlength="60" value="${esc(d.detail)}"
          placeholder="${L('לדוגמה: יריד מדע, יום ספורט, הרצאת אורח', 'e.g. Science fair, Sports day, Guest lecture')}" oninput="draftField('detail', this.value)">
      </div>` : ''}
      <div style="grid-column:1/-1">
        <label class="label">${nameOptional ? L('תיאור (לא חובה)', 'Description (optional)') : L('שם האירוע *', 'Event name *')}</label>
        <input id="ev-name" class="input" maxlength="80" value="${esc(d.name)}"
          placeholder="${namePlaceholders[d.category]}" oninput="draftField('name', this.value)" onkeydown="if(event.key==='Enter')addEvent()">
      </div>

      ${cat.range ? `
      <div>
        <label class="label">${L('מתאריך', 'Start date')}</label>
        <input id="ev-start" type="date" class="input" value="${d.date}" onchange="draftField('date', this.value)">
      </div>
      <div>
        <label class="label">${L('עד תאריך', 'End date')}</label>
        <input id="ev-end" type="date" class="input" value="${d.endDate}" min="${d.date}" onchange="draftField('endDate', this.value)">
      </div>` : `
      <div>
        <label class="label">${L('תאריך', 'Date')}</label>
        <input type="date" class="input" value="${d.date}" onchange="draftField('date', this.value)">
      </div>
      <div>
        <label class="label">${L('שעה (לא חובה)', 'Time (optional)')}</label>
        <input type="time" class="input" value="${d.time}" onchange="draftField('time', this.value)">
      </div>`}
      <div>
        <label class="label">${L('כיתה', 'Class')}</label>
        <select class="input" onchange="sched.draft.classId=this.value">
          <option value="all" ${d.classId === 'all' ? 'selected' : ''}>${L('כל הכיתות שלי', 'All my classes')}</option>
          ${tc.map(c => `<option value="${c.id}" ${d.classId === c.id ? 'selected' : ''}>${localize(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="flex items-end">
        <button id="ev-add" class="btn" style="width:100%;padding:0.625rem;background:${cat.color};color:#fff" onclick="addEvent()" ${validateDraft() ? 'disabled' : ''}>
          ${ICONS.plus} ${L('הוספת אירוע', 'Add event')}
        </button>
      </div>
    </div>
    ${cat.range ? `<p class="xs muted mt-2" id="ev-range-note">${rangeNote()}</p>` : ''}
    <p class="xs mt-2" id="ev-error" style="color:#F43F5E">${sched.formError}</p>
  </div>`;
}

function rangeNote() {
  const d = sched.draft;
  const n = daysBetween(d.date, d.endDate) + 1;
  if (!d.date || !d.endDate || n < 1) return '';
  return L(`${n} ימים יסומנו בלוח השנה`, `${n} day${n === 1 ? '' : 's'} will be marked on the calendar`);
}

// Returns an error message, or '' when the draft can be saved
function validateDraft() {
  const d = sched.draft;
  const cat = EVENT_CATEGORIES[d.category];
  if (cat.detail && !d.detail.trim()) return L('יש לציין איזה טקס', 'Please say which ceremony');
  if (cat.custom && !d.detail.trim()) return L('יש לתת שם לאירוע', 'Please name the event');
  if (!cat.detail && !cat.custom && !d.name.trim()) return L('יש להזין שם לאירוע', 'Please enter an event name');
  if (!d.date) return L('יש לבחור תאריך', 'Please pick a date');
  if (cat.range) {
    if (!d.endDate) return L('יש לבחור תאריך סיום', 'Please pick an end date');
    const n = daysBetween(d.date, d.endDate);
    if (n < 0) return L('תאריך הסיום לפני תאריך ההתחלה', 'The end date is before the start date');
    if (n >= MAX_RANGE_DAYS) return L(`טווח של עד ${MAX_RANGE_DAYS} ימים`, `Ranges can be up to ${MAX_RANGE_DAYS} days`);
  }
  return '';
}

function refreshFormState() {
  const err = validateDraft();
  document.getElementById('ev-add').disabled = !!err;
  const note = document.getElementById('ev-range-note');
  if (note) note.textContent = rangeNote();
  // only surface date problems live; empty-name hints would nag while typing
  const dateProblem = sched.draft.date && EVENT_CATEGORIES[sched.draft.category].range && daysBetween(sched.draft.date, sched.draft.endDate) < 0;
  document.getElementById('ev-error').textContent = dateProblem || (err && sched.formError) ? err : '';
}

function pickCategory(key) {
  const d = sched.draft;
  d.category = key;
  d.detail = '';
  if (EVENT_CATEGORIES[key].range && (!d.endDate || d.endDate < d.date)) d.endDate = d.date;
  sched.formError = '';
  renderPage();
  (document.getElementById('ev-detail') || document.getElementById('ev-name'))?.focus();
}
function draftField(field, value) {
  const d = sched.draft;
  d[field] = value;
  if (field === 'date' && EVENT_CATEGORIES[d.category].range) {
    if (!d.endDate || d.endDate < value) {
      d.endDate = value;
      const end = document.getElementById('ev-end');
      if (end) end.value = value;
    }
    const end = document.getElementById('ev-end');
    if (end) end.min = value;
  }
  refreshFormState();
}

function toggleEventForm(open) {
  sched.showEventForm = open;
  sched.formError = '';
  renderPage();
  if (open) (document.getElementById('ev-detail') || document.getElementById('ev-name'))?.focus();
}
function addEvent() {
  const d = sched.draft;
  const err = validateDraft();
  if (err) { sched.formError = err; document.getElementById('ev-error').textContent = err; return; }
  const cat = EVENT_CATEGORIES[d.category];
  sched.events.push({
    id: 'e-' + Date.now(), category: d.category, name: d.name.trim(), detail: d.detail.trim(),
    date: d.date, endDate: cat.range ? d.endDate : null, time: cat.range ? '' : d.time, classId: d.classId,
  });
  save('cs-events', sched.events);
  const when = new Date(d.date);
  if (when.getFullYear() === YEAR) { sched.month = when.getMonth(); sched.selectedDay = when.getDate(); }
  sched.draft = blankDraft(d.classId);
  sched.showEventForm = false;
  sched.formError = '';
  renderPage();
  toast(L('האירוע נוסף ללוח השנה', 'Event added to the calendar'));
}
function deleteEvent(id) {
  sched.events = sched.events.filter(e => e.id !== id);
  save('cs-events', sched.events);
  renderPage();
  toast(L('האירוע נמחק', 'Event deleted'));
}
function entryWhen(e) {
  if (e.endDate) return ` · ${fmtDate(e.date, { day: 'numeric', month: 'short' })}–${fmtDate(e.endDate, { day: 'numeric', month: 'short' })}`;
  return e.kind === 'event' && e.time ? ` · ${e.time}` : '';
}
function entryTime(e) { return e.kind === 'event' && e.time ? ` · ${e.time}` : ''; }
function deleteBtn(e) {
  return e.kind === 'event' && state.role === 'teacher'
    ? `<button class="del-btn" title="${L('מחיקה', 'Delete')}" onclick="deleteEvent('${e.id}')">${ICONS.close}</button>` : '';
}

/* ---------- Weekly grid ---------- */
function weeklyGrid() {
  const days = isHe() ? DAYS_HE : DAYS;
  let html = `<div class="card r-3xl week">`;
  html += `<div class="week-row head"><div class="week-cell corner"></div>`;
  days.forEach(day => {
    html += `
      <div class="week-cell day-head">
        <div class="display w7 sm">${isHe() ? day.replace('יום ', '') : day.slice(0, 3)}</div>
        <div class="xs muted mt-1 md-up">${day}</div>
      </div>`;
  });
  html += `</div>`;

  HOURS.forEach(hour => {
    html += `<div class="week-row"><div class="week-cell time"><span class="mono xs w5 muted">${hour}:00</span></div>`;
    DAYS.forEach((_, dayIndex) => {
      // several classes can meet at the same time, so a cell may hold more than one lesson
      const slots = visibleTimetable().filter(s => s.day === dayIndex && s.startHour === hour);
      const fresh = recentChangeFlags();
      html += `<div class="week-cell slot-cell">`;
      slots.forEach(slot => {
        const cls = classes.find(c => c.id === slot.classId);
        if (!cls) return;
        const flag = fresh[slot.id];
        html += `
          <button class="slot ${sched.selectedSlot === slot.id ? 'selected' : ''} ${flag ? 'flagged' : ''}" onclick="${state.role === 'teacher' ? `openMashov('${slot.id}')` : `selectSlot('${slot.id}')`}"
            style="background:${cls.color}22;border-color:${cls.color}55;min-height:${slots.length > 1 ? 'auto' : slot.duration * 3.75 + 'rem'};--c:${cls.color}">
            <div class="w7 xs leading-tight" style="color:${cls.color}">${localize(cls.subject)}</div>
            <div class="xs muted mt-1 md-up">${esc(localize(slot.room || ''))}</div>
            ${slot.duration > 1 ? `<div class="xs w6 mt-1" style="color:${cls.color}cc">${timeRange(hour, hour + slot.duration)}</div>` : ''}
            ${state.role === 'teacher' && mashovRecord(slot.id, defaultLessonDate(slot)) ? `<span class="slot-done" title="${L('המשוב לשיעור הזה מולא', 'Mashov filled in for this lesson')}">✓</span>` : ''}
            ${flag ? `<span class="slot-flag ${flag}">${flag === 'added' ? L('חדש', 'New') : L('עודכן', 'Updated')}</span>` : ''}
          </button>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------- Timetable changes published by the principal ---------- */
function seenKey() { return 'cs-tt-seen-' + (CURRENT_USER ? CURRENT_USER.id : ''); }
function relevantChanges() {
  const meta = timetableMeta();
  if (!meta || load(seenKey(), null) === meta.updatedAt) return [];
  return meta.changes.filter(c => changeClassIds(c).some(isMyClass));
}
// lesson id → 'added' | 'changed', for lessons in the latest unseen update
function recentChangeFlags() {
  const flags = {};
  relevantChanges().forEach(c => { if (c.after) flags[c.after.id] = c.type === 'added' ? 'added' : 'changed'; });
  return flags;
}
function changesBanner() {
  const changes = relevantChanges();
  if (!changes.length) return '';
  const meta = timetableMeta();
  const author = loadUsers().find(u => u.id === meta.by);
  const line = c => c.type === 'added' ? `<span class="chg add">+</span> ${L('שיעור חדש', 'New lesson')}: ${esc(lessonLabel(c.after))}`
    : c.type === 'removed' ? `<span class="chg del">−</span> ${L('השיעור בוטל', 'Lesson cancelled')}: ${esc(lessonLabel(c.before))}`
    : `<span class="chg mod">↻</span> ${L('שינוי', 'Moved')}: ${esc(lessonLabel(c.before))} <b>→</b> ${esc(lessonLabel(c.after))}`;
  return `
  <div class="card r-3xl p-5 tt-banner fade-up" role="status">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3 class="display w8 base">📢 ${L('מערכת השעות עודכנה', 'The timetable was updated')}</h3>
        <p class="xs muted mt-1">${author ? esc(localize(fullName(author))) + ' · ' : ''}${fmtDate(meta.updatedAt, { day: 'numeric', month: 'long' })} · ${L('תקף לכל שבועות השנה', 'applies to every week of the year')}</p>
      </div>
      <button class="btn btn-soft btn-sm" onclick="dismissChanges()">${L('הבנתי', 'Got it')}</button>

    <div class="col gap-2 mt-3 sm">${changes.map(c => `<div style="line-height:1.5">${line(c)}</div>`).join('')}</div>

}
function dismissChanges() {
  const meta = timetableMeta();
  if (meta) save(seenKey(), meta.updatedAt);
  renderPage();
}

function slotDetails() {
  if (!sched.selectedSlot) return '';

function selectSlot(key) {
  sched.selectedSlot = sched.selectedSlot === key ? null : key;

}

/* ---------- Mini calendar ---------- */
function miniCalendar() {
  const month = sched.month;
  const firstDay = new Date(YEAR, month, 1).getDay();
  const daysInMonth = new Date(YEAR, month + 1, 0).getDate();
  const blanks = firstDay === 0 ? 6 : firstDay - 1;

  const eventDays = {};
  const rangeDays = {};
  calendarEntries().forEach(e => {
    const span = e.endDate ? daysBetween(e.date, e.endDate) : 0;
    for (let i = 0; i <= span; i++) {
      const d = parseDay(e.date);
      d.setDate(d.getDate() + i);
      if (d.getMonth() !== month || d.getFullYear() !== YEAR) continue;
      (eventDays[d.getDate()] ||= []).push(e);
      if (e.endDate) rangeDays[d.getDate()] = e.color;
    }
  });

  const heads = isHe() ? ['ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳', 'א׳'] : ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
  let cells = '';
  for (let i = 0; i < blanks; i++) cells += '<div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const events = eventDays[day] || [];
    const isToday = day === 8 && month === 8;
    const selected = sched.selectedDay === day;
    cells += `
      <button class="cal-day ${isToday ? 'today' : ''} ${events.length ? 'has-events' : ''} ${selected ? 'selected' : ''}"
        ${rangeDays[day] && !isToday ? `style="background:${rangeDays[day]}26"` : ''} onclick="selectDay(${day})">
        <span class="xs w7">${day}</span>
        ${events.length && !isToday ? `<div class="flex gap-1" style="gap:2px;margin-top:2px">
          ${events.slice(0, 3).map(e => `<span class="dot" style="width:0.375rem;height:0.375rem;background:${e.color}"></span>`).join('')}
        </div>` : ''}
      </button>`;
  }

  const dayEvents = sched.selectedDay ? (eventDays[sched.selectedDay] || []) : [];

  return `
  <div class="card r-3xl p-5">
    <div class="flex items-center justify-between mb-4">
      <h3 class="display w7 base">${new Date(YEAR, month).toLocaleDateString(isHe() ? 'he-IL' : 'en-US', { month: 'long', year: 'numeric' })}</h3>
      <div class="flex gap-1 cal-nav">
        <button onclick="changeMonth(-1)" aria-label="prev"><svg style="width:0.875rem;height:0.875rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button onclick="changeMonth(1)" aria-label="next"><svg style="width:0.875rem;height:0.875rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="grid g-7 mb-2" style="gap:0">
      ${heads.map(d => `<div class="text-center xs w7 muted" style="padding:0.25rem 0">${d}</div>`).join('')}
    </div>
    <div class="grid g-7" style="gap:2px">${cells}</div>
    ${sched.selectedDay ? `
      <div class="mt-3 p-3 r-2xl surface fade-up">
        <div class="xs w7 muted mb-2">${new Date(YEAR, month, sched.selectedDay).toLocaleDateString(isHe() ? 'he-IL' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        ${dayEvents.length
          ? dayEvents.map(e => `<div class="flex items-center gap-2 sm w6 mb-1">${e.icon ? `<span>${e.icon}</span>` : `<span class="dot" style="background:${e.color}"></span>`}<span class="flex-1 min-w-0">${esc(e.title)}<span class="xs muted">${e.tag && e.tag !== e.title ? ' · ' + esc(e.tag) : ''}${entryWhen(e)}</span></span>${deleteBtn(e)}</div>`).join('')
          : `<div class="sm muted">${L('אין אירועים ביום זה', 'Nothing due this day')}</div>`}
      </div>` : ''}
    <div class="mt-4 flex wrap gap-3" style="padding-top:1rem;border-top:1px solid var(--border)">
      ${Object.keys(TYPE_COLORS).map(type => `
        <div class="flex items-center gap-2">
          <span class="dot" style="width:0.625rem;height:0.625rem;background:${TYPE_COLORS[type]}"></span>
          <span class="xs w5 muted">${typeLabel(type)}</span>
        </div>`).join('')}
      ${[...new Set(sched.events.map(e => EVENT_CATEGORIES[e.category] ? e.category : 'custom'))]
        .filter(key => !Object.keys(TYPE_COLORS).some(type => typeLabel(type) === catLabel(key)))
        .map(key => `
        <div class="flex items-center gap-2">
          <span class="dot" style="width:0.625rem;height:0.625rem;background:${EVENT_CATEGORIES[key].color}"></span>
          <span class="xs w5 muted">${catLabel(key)}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function changeMonth(delta) {
  sched.month = Math.min(11, Math.max(0, sched.month + delta));
  sched.selectedDay = null;
  renderPage();

function selectDay(day) {
  sched.selectedDay = sched.selectedDay === day ? null : day;
  renderPage();
}

/* ================= Mashov: attendance & behaviour per lesson ================= */
// One record per lesson per date. Students down the side, categories across the top.
const MASHOV_KEY = 'cs-mashov';
const MASHOV_CATS = [
  { key: 'absent', he: 'חיסור', en: 'Absence', icon: '🚫', color: '#F43F5E' },
  { key: 'late', he: 'איחור', en: 'Tardiness', icon: '⏰', color: '#F59E0B' },
  { key: 'disrupt', he: 'הפרעה', en: 'Disruption', icon: '📢', color: '#F97316' },
  { key: 'praise', he: 'ציון לשבח', en: 'Commendation', icon: '🌟', color: '#10B981' },
  { key: 'noEquip', he: 'אי הבאת ציוד', en: 'Missing equipment', title: 'Failure to bring equipment', icon: '🎒', color: '#8B5CF6' },
  { key: 'present', he: 'נוכח/ת', en: 'Present', icon: '✅', color: '#3B82F6' },
];
const mashov = { slotId: null, date: null, rows: {}, dirty: false };

function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

// The latest date this weekly lesson took place (today counts), kept inside the school year
function defaultLessonDate(slot) {
  const year = schoolYear();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const end = parseIso(year.end);
  const d = today > end ? end : today;
  const wanted = (slot.day + 1) % 7;          // timetable day 0 = Monday
  while (d.getDay() !== wanted) d.setDate(d.getDate() - 1);
  const start = parseIso(year.start);
  if (d < start) {               // before the year began: use the first lesson of the year
    d.setTime(start.getTime());
    while (d.getDay() !== wanted) d.setDate(d.getDate() + 1);
  }
  return isoLocal(d);
}

function classStudents() {
  const registered = loadUsers().filter(u => u.role === 'student' && u.status === 'active').map(fullName);
  return [...new Set(STUDENT_ROSTER.concat(registered))];
}
function savedWhen(iso) {
  const d = new Date(iso);
  return d.toDateString() === new Date().toDateString()
    ? d.toLocaleTimeString(isHe() ? 'he-IL' : 'en-GB', { hour: '2-digit', minute: '2-digit' })
    : fmtDate(iso, { day: 'numeric', month: 'short' });
}
function mashovStore() { return load(MASHOV_KEY, {}); }
function mashovRecord(slotId, date) { return mashovStore()[slotId + '|' + date] || null; }

function loadMashovRows() {
  const saved = mashovRecord(mashov.slotId, mashov.date);
  mashov.rows = {};
  classStudents().forEach(name => {
    mashov.rows[name] = saved && saved.rows[name] ? { ...saved.rows[name] } : {};
  });
  mashov.dirty = false;
}

function openMashov(slotId) {
  const slot = timetable.find(s => s.id === slotId);
  if (!slot || state.role !== 'teacher' || !isMyClass(slot.classId)) return;
  mashov.slotId = slotId;
  mashov.date = defaultLessonDate(slot);
  mashov.fresh = true;
  loadMashovRows();
  renderPage();
}
function closeMashov(force) {
  if (!force && mashov.dirty && !confirm(L('יש שינויים שלא נשמרו. לסגור בלי לשמור?', 'You have unsaved changes. Close without saving?'))) return;
  mashov.slotId = null;
  renderPage();
}
function stepMashovWeek(delta) {
  if (mashov.dirty && !confirm(L('יש שינויים שלא נשמרו. לעבור שבוע בלי לשמור?', 'You have unsaved changes. Switch week without saving?'))) return;
  const d = parseIso(mashov.date);
  d.setDate(d.getDate() + delta * 7);
  const year = schoolYear();
  if (isoLocal(d) < year.start || isoLocal(d) > year.end) return;
  mashov.date = isoLocal(d);
  loadMashovRows();
  renderPage();
}

/* Checkbox rules: absence excludes everything else; any other mark means the student was there */
function toggleMashov(name, key) {
  const row = mashov.rows[name];
  const on = !row[key];
  row[key] = on;
  if (on && key === 'absent') ['present', 'late', 'disrupt', 'praise', 'noEquip'].forEach(k => { row[k] = false; });
  if (on && key !== 'absent') { row.absent = false; row.present = true; }
  if (!on && key === 'present') ['late', 'disrupt', 'praise', 'noEquip'].forEach(k => { row[k] = false; });
  mashov.dirty = true;
  rerenderKeepingScroll();
}
function markAllPresent() {
  Object.values(mashov.rows).forEach(row => { if (!row.absent) row.present = true; });
  mashov.dirty = true;
  rerenderKeepingScroll();
}
function rerenderKeepingScroll() {
  const wrap = document.querySelector('.mashov-table-wrap');
  const top = wrap ? wrap.scrollTop : 0, left = wrap ? wrap.scrollLeft : 0;
  renderPage();
  const again = document.querySelector('.mashov-table-wrap');
  if (again) { again.scrollTop = top; again.scrollLeft = left; }
}
function saveMashov() {
  const store = mashovStore();
  const slot = timetable.find(s => s.id === mashov.slotId);
  store[mashov.slotId + '|' + mashov.date] = {
    classId: slot.classId, date: mashov.date, savedAt: new Date().toISOString(), by: currentUserName(), rows: mashov.rows,
  };
  save(MASHOV_KEY, store);
  mashov.dirty = false;
  renderPage();
  toast(L('המשוב נשמר', 'Mashov saved'));
}

function mashovModal() {
  if (!mashov.slotId) return '';
  const slot = timetable.find(s => s.id === mashov.slotId);
  const cls = classes.find(c => c.id === slot.classId);
  const saved = mashovRecord(mashov.slotId, mashov.date);
  const names = Object.keys(mashov.rows);
  const unmarked = names.filter(n => !MASHOV_CATS.some(c => mashov.rows[n][c.key])).length;
  const year = schoolYear();
  const prev = parseIso(mashov.date); prev.setDate(prev.getDate() - 7);
  const next = parseIso(mashov.date); next.setDate(next.getDate() + 7);
  const fade = mashov.fresh ? 'fade-up' : '';
  mashov.fresh = false;

  return `
  <div class="modal-bg" onmousedown="if(event.target===this)closeMashov()">
    <div class="card r-3xl mashov ${fade}" role="dialog" aria-label="${L('משוב', 'Mashov')}">
      <div class="mashov-head">
        <div class="flex items-center gap-3 min-w-0">
          <div class="letter-tile" style="width:2.5rem;height:2.5rem;background:${cls.color}">${localize(cls.subject)[0]}</div>
          <div class="min-w-0">
            <h2 class="display w8 lg truncate">📋 ${L('משוב', 'Mashov')} · ${localize(cls.name)}</h2>
            <p class="xs muted truncate">${dayName(slot.day)} · ${timeRange(slot.startHour, slot.startHour + slot.duration)}${slot.room ? ' · ' + esc(localize(slot.room)) : ''}</p>
          </div>
        </div>
        <button class="icon-btn" style="width:2rem;height:2rem" onclick="closeMashov()" aria-label="${L('סגירה', 'Close')}">${ICONS.close}</button>
      </div>

      <div class="mashov-bar">
        <div class="flex items-center gap-1">
          <button class="icon-btn week-arrow" style="width:2rem;height:2rem" onclick="stepMashovWeek(-1)" ${isoLocal(prev) < year.start ? 'disabled' : ''} aria-label="${L('שבוע קודם', 'Previous week')}">‹</button>
          <span class="sm w7 mashov-date">${fmtDate(mashov.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
          <button class="icon-btn week-arrow" style="width:2rem;height:2rem" onclick="stepMashovWeek(1)" ${isoLocal(next) > year.end ? 'disabled' : ''} aria-label="${L('שבוע הבא', 'Next week')}">›</button>
        </div>
        <span class="xs ${saved && !mashov.dirty ? '' : 'muted'}" style="${saved && !mashov.dirty ? 'color:#10B981;font-weight:700' : ''}">
          ${mashov.dirty ? '● ' + L('לא נשמר', 'Not saved') : saved ? '✓ ' + L('נשמר', 'Saved') + ' ' + savedWhen(saved.savedAt) : L('עדיין לא מולא', 'Not filled in yet')}
        </span>
        <button class="btn btn-soft btn-sm" onclick="markAllPresent()">✅ ${L('כולם נוכחים', 'Mark all present')}</button>
      </div>

      <div class="mashov-table-wrap">
        <table class="mashov-table">
          <thead>
            <tr>
              <th class="name-col">${L('תלמיד/ה', 'Student')}</th>
              ${MASHOV_CATS.map(c => `<th title="${c.title || L(c.he, c.en)}" style="--c:${c.color}"><span class="cat-icon">${c.icon}</span><span>${L(c.he, c.en)}</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${names.map((name, i) => {
              const row = mashov.rows[name];
              return `
              <tr class="${row.absent ? 'is-absent' : ''}">
                <th class="name-col" scope="row">
                  <span class="flex items-center gap-2">
                    <span class="letter-tile xs" style="width:1.75rem;height:1.75rem;border-radius:0.5rem;background:hsl(${i * 47 + 200},60%,50%)">${initials(name)}</span>
                    <span class="sm w6 truncate">${esc(localize(name))}</span>
                  </span>
                </th>
                ${MASHOV_CATS.map(c => {
                  const blocked = row.absent && c.key !== 'absent';
                  return `<td style="--c:${c.color}">
                    <label class="mcheck ${row[c.key] ? 'on' : ''} ${blocked ? 'blocked' : ''}">
                      <input type="checkbox" ${row[c.key] ? 'checked' : ''} ${blocked ? 'disabled' : ''}
                        aria-label="${esc(localize(name))} – ${L(c.he, c.en)}" onchange="toggleMashov(${JSON.stringify(name).replace(/"/g, '&quot;')}, '${c.key}')">
                      <span class="box">${ICONS.check}</span>
                    </label>
                  </td>`;
                }).join('')}
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot>
            <tr>
              <th class="name-col xs muted">${L('סה״כ', 'Total')}</th>
              ${MASHOV_CATS.map(c => `<td class="xs w8" style="color:${c.color}">${names.filter(n => mashov.rows[n][c.key]).length}</td>`).join('')}
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="mashov-foot">
        <span class="xs muted">${unmarked ? L(`${unmarked} תלמידים עדיין לא סומנו`, `${unmarked} student${unmarked === 1 ? '' : 's'} not marked yet`) : L('כל התלמידים סומנו', 'Every student is marked')}</span>
        <div class="flex gap-2">
          <button class="btn surface" onclick="closeMashov()">${L('סגירה', 'Close')}</button>
          <button class="btn btn-primary" onclick="saveMashov()" ${mashov.dirty ? '' : 'disabled'}>💾 ${L('שמירת משוב', 'Save Mashov')}</button>
        </div>
      </div>
    </div>
  </div>`;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && mashov.slotId) closeMashov(); });
window.addEventListener('beforeunload', e => { if (mashov.slotId && mashov.dirty) { e.preventDefault(); e.returnValue = ''; } });

function goToday() {
  sched.month = 8;
  sched.selectedDay = 8;
  renderPage();
}
</script>
</body>
</html>
