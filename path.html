      if (li % 2 === 1 || li === group.length - 1) {
        const covered = group.slice(Math.max(0, li - 1), li + 1).flatMap(x => x.sentences);
        nodes.push({ id: newId('n'), type: 'practice', title: L('תרגול', 'Practice'), summary: L('בואו נבדוק מה זכרתם.', 'Let’s check what you remember.'), points: [],
          questions: ask(covered, D.questions, { allowTf: true }) });
      }
    });
    nodes.push({ id: newId('n'), type: 'checkpoint', title: L(`נקודת ביקורת ${ui + 1}`, `Checkpoint ${ui + 1}`), summary: L('חזרה על כל היחידה.', 'A review of the whole unit.'), points: [],
      questions: ask(group.flatMap(x => x.sentences), D.questions + 2, { allowTf: true }) });
    const unitTitle = [...new Set(group.map(l => sections.find(s => s.index === l.section).title))].join(' · ').replace(/…/g, '');
    return { id: newId('u'), title: unitTitle, nodes };
  });
  units[units.length - 1].nodes.push({ id: newId('n'), type: 'boss', title: L('האתגר המסכם', 'Final challenge'), summary: L('כל החומר – הראו מה למדתם!', 'Everything – show what you learned!'), points: [],
    questions: ask(lessons.flatMap(l => l.sentences), D.questions + 4, { allowTf: true }) });
  return finishPath({ title: opts.title || doc.title, units }, opts, 'builtin');
}

// Fills in ids, spreads the minutes over the steps, drops broken questions
function finishPath(raw, opts, engine) {
  const units = (raw.units || []).map(u => ({
    id: u.id || newId('u'), title: String(u.title || '').trim(),
    nodes: (u.nodes || []).filter(n => NODE_KIND[n.type]).map(n => ({
      id: n.id || newId('n'), type: n.type, title: String(n.title || NODE_KIND[n.type].en).trim(), minutes: Number(n.minutes) || 0,
      summary: String(n.summary || '').trim(), points: (n.points || []).map(String).filter(Boolean),
      questions: (n.questions || []).filter(q => Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length)
        .map(q => ({ kind: q.kind || 'choice', question: String(q.question), options: q.options.map(String), answer: q.answer, explanation: String(q.explanation || '') })),
    })).filter(n => n.type === 'lesson' || n.questions.length),
  })).filter(u => u.nodes.length);
  if (!units.length) throw new Error(L('לא נוצרו שלבים מהמסמך.', 'No steps could be made from the document.'));
  // minutes: keep the AI's split if it is close to the target, otherwise spread by step type
  const nodes = units.flatMap(u => u.nodes);
  const given = nodes.reduce((s, n) => s + n.minutes, 0);
  if (!given || Math.abs(given - opts.minutes) / opts.minutes > 0.2) {
    const w = nodes.reduce((s, n) => s + NODE_KIND[n.type].weight, 0);
    nodes.forEach(n => { n.minutes = Math.max(2, Math.round(opts.minutes * NODE_KIND[n.type].weight / w)); });
  }
  return {
    id: newId('path'), title: String(raw.title || opts.title || '').trim() || L('מסלול חדש', 'New path'), classId: opts.classId,
    difficulty: opts.difficulty, targetMinutes: opts.minutes, engine, source: opts.source,
    createdAt: new Date().toISOString(), by: CURRENT_USER.id, byName: currentUserName(), published: false, units,
  };
}

/* ================= Claude (AI) generator ================= */
const PATH_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['title', 'units'],
  properties: {
    title: { type: 'string' },
    units: { type: 'array', items: {
      type: 'object', additionalProperties: false, required: ['title', 'nodes'],
      properties: {
        title: { type: 'string' },
        nodes: { type: 'array', items: {
          type: 'object', additionalProperties: false, required: ['type', 'title', 'minutes', 'summary', 'points', 'questions'],
          properties: {
            type: { type: 'string', enum: ['lesson', 'practice', 'checkpoint', 'boss'] },
            title: { type: 'string' },
            minutes: { type: 'integer' },
            summary: { type: 'string' },
            points: { type: 'array', items: { type: 'string' } },
            questions: { type: 'array', items: {
              type: 'object', additionalProperties: false, required: ['kind', 'question', 'options', 'answer', 'explanation'],
              properties: {
                kind: { type: 'string', enum: ['choice', 'true_false', 'fill_blank'] },
                question: { type: 'string' },
                options: { type: 'array', items: { type: 'string' } },
                answer: { type: 'integer', description: '0-based index of the correct option' },
                explanation: { type: 'string' },
              },
            } },
          },
        } },
      },
    } },
  },
};
const PATH_SYSTEM = `You turn a teacher's learning material into a game-like learning path for school students, in the style of Duolingo: a sequence of units, each made of small steps the student completes in order.

Step types:
- "lesson": teaches one idea. "summary" is 2-4 short sentences in the student's voice level; "points" are the key facts to remember (short, one idea each); include 1-3 quick questions on exactly what the lesson taught.
- "practice": comes after every one or two lessons; no new content ("points" empty); questions mix what those lessons taught.
- "checkpoint": closes every unit; reviews the whole unit with more questions.
- "boss": exactly one, the very last step of the last unit; reviews the whole path and is the hardest.

Rules:
- Use only facts that appear in the document. Do not invent facts, numbers or names. If the document is thin, make fewer, shorter steps rather than padding.
- Order the steps so each builds on the previous ones, following the document's own order.
- Every question must be answerable from the steps before it. Exactly one option is correct; wrong options are plausible but clearly wrong to someone who learned the material. "answer" is the 0-based index of the correct option; vary its position.
- "true_false": options are exactly the words for True and False in the document's language, in that order. "fill_blank": the question is a sentence with "_____" where the missing word or phrase goes. "choice": a normal multiple-choice question.
- Write questions the way a good teacher writes a quiz: a clear question about an idea ("What is osmosis?", "Why does active transport need ATP?", "What happens to a plant cell in a hypertonic solution?"), not a sentence copied from the document with one word removed. Use fill_blank only for a key term or number.
- Wrong options are the same kind of thing as the right one (all terms, all processes, all numbers) and about the same length, so the answer can't be guessed from its form. Never use "all of the above" or "none of the above", and never make the right answer the longest option on purpose.
- "explanation" says briefly why the answer is right, so a student who got it wrong learns from it.
- "minutes" is the realistic time for a student to finish the step; the minutes of all steps together should match the requested total.
- Write everything in the same language as the document (Hebrew documents → Hebrew path).
- Unit titles name the topic of the unit; step titles are short (2-6 words).`;

function aiInstructions(opts) {
  const D = DIFFICULTY[opts.difficulty];
  const level = {
    easy: 'Easy: short, simple steps; focus on the main ideas and definitions; mostly recall questions; 3 options per multiple-choice question.',
    medium: 'Medium: cover the main ideas and the important details; mix recall and understanding questions; 4 options.',
    hard: 'Hard: cover the material in depth, including details and connections between ideas; include application and "which statement is true" questions; 4 options; plausible distractors.',
  }[opts.difficulty];
  return `Build the learning path from the document above.
- Path title: ${opts.title ? JSON.stringify(opts.title) : 'choose a short title from the document'}.
- Difficulty: ${level}
- Total time for the whole path: about ${opts.minutes} minutes (a lesson takes about ${D.lessonMin} minutes at this level). Choose the number of units and steps to fit this time.
- Practice, checkpoint and boss steps: about ${D.questions}, ${D.questions + 2} and ${D.questions + 4} questions.`;
}

async function aiPath(doc, opts, onProgress) {
  await loadScriptOnce(VENDOR + 'anthropic-sdk.min.js');
  const Anthropic = window.AnthropicSDK.default;
  const proxy = aiProxyUrl();
  // The school's proxy holds the real key; otherwise the teacher's own key from this browser
  const client = new Anthropic(proxy
    ? { apiKey: 'set-by-school-proxy', baseURL: proxy, dangerouslyAllowBrowser: true }
    : { apiKey: aiKey(), dangerouslyAllowBrowser: true });
  const content = [];
  if (doc.kind === 'pdf' && doc.pdfBase64) {
    // Claude reads the PDF itself – layout, tables and scanned pages included
    content.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: doc.pdfBase64 }, title: doc.name });
  } else {
    const text = doc.sections.map(s => `## ${s.title}\n${s.text}`).join('\n\n');
    if (text.length > AI_MAX_CHARS) throw new Error(L(`המסמך ארוך מדי (${Math.round(text.length / 1000)} אלף תווים). חלקו אותו לכמה מסמכים, כל אחד עד ${AI_MAX_CHARS / 1000} אלף.`, `The document is too long (${Math.round(text.length / 1000)}k characters). Split it into documents of up to ${AI_MAX_CHARS / 1000}k each.`));
    content.push({ type: 'text', text: `<document name="${doc.name.replace(/"/g, '')}">\n${doc.title ? '# ' + doc.title + '\n\n' : ''}${text}\n</document>` });
  }
  content.push({ type: 'text', text: aiInstructions(opts) });
  const stream = client.beta.messages.stream({
    model: AI_MODEL,
    max_tokens: 64000,
    betas: ['server-side-fallback-2026-07-01'],
    fallbacks: 'default',                       // if a safety check declines, another model finishes the request
    thinking: { type: 'adaptive' },
    output_config: { effort: 'high', format: { type: 'json_schema', schema: PATH_SCHEMA } },
    system: PATH_SYSTEM,
    messages: [{ role: 'user', content }],
  });
  pg.abort = () => stream.abort();
  let written = '';
  stream.on('text', delta => {
    written += delta;
    onProgress({ units: (written.match(/"nodes"\s*:/g) || []).length, steps: (written.match(/"type"\s*:\s*"(lesson|practice|checkpoint|boss)"/g) || []).length });
  });
  const msg = await stream.finalMessage();
  if (msg.stop_reason === 'refusal') throw new Error(L('המודל סירב ליצור מסלול מהמסמך הזה.', 'The model declined to build a path from this document.'));
  if (msg.stop_reason === 'max_tokens') throw new Error(L('המסלול יצא ארוך מדי. נסו זמן קצר יותר או מסמך קצר יותר.', 'The path came out too long. Try a shorter time or a shorter document.'));
  const json = msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
  let raw;
  try { raw = JSON.parse(json); } catch (e) { throw new Error(L('התשובה של ה־AI לא הייתה תקינה. נסו שוב.', 'The AI’s answer was not valid. Try again.')); }
  return finishPath(raw, opts, 'ai');
}
function aiErrorText(e) {
  const A = window.AnthropicSDK && window.AnthropicSDK.default;
  if (A && e instanceof A.AuthenticationError) return L('מפתח ה־API לא תקין.', 'The API key is not valid.');
  if (A && e instanceof A.PermissionDeniedError) return L('למפתח אין הרשאה לשימוש במודל.', 'This key is not allowed to use the model.');
  if (A && e instanceof A.RateLimitError) return L('יותר מדי בקשות כרגע. נסו שוב בעוד דקה.', 'Too many requests right now. Try again in a minute.');
  if (A && e instanceof A.BadRequestError) return L('הבקשה נדחתה: ', 'The request was rejected: ') + (e.message || '');
  if (A && e instanceof A.APIConnectionError) return L('אין חיבור לשירות ה־AI. בדקו את האינטרנט.', 'Can’t reach the AI service. Check the internet connection.');
  if (A && e instanceof A.APIError) return L(`שגיאה בשירות ה־AI (${e.status}).`, `AI service error (${e.status}).`);
  return e && e.message ? e.message : String(e);
}

async function generate() {
  if (!pg.doc || pg.generating) return;
  const engine = pg.engine || 'builtin';
  const opts = { title: pg.title.trim(), classId: pg.classId || state.classId, difficulty: pg.difficulty, minutes: Math.max(10, Math.min(1200, Number(pg.minutes) || 60)),
    source: { name: pg.doc.name, kind: pg.doc.kind, words: pg.doc.words } };
  if (engine === 'ai' && !aiReady()) { pg.error = L('כדי להשתמש ב־AI צריך מפתח API או שרת AI של בית הספר.', 'The AI engine needs an API key or the school’s AI server.'); renderPage(); return; }
  if (engine === 'builtin' && !pg.doc.words) { pg.error = L('המחולל המובנה צריך מסמך עם טקסט.', 'The built-in generator needs a document with text.'); renderPage(); return; }
  pg.generating = true; pg.error = ''; pg.progress = '';
  renderPage();
  try {
    const path = engine === 'ai'
      ? await aiPath(pg.doc, opts, p => { pg.progress = L(`כותב… ${p.units} יחידות · ${p.steps} שלבים`, `Writing… ${p.units} units · ${p.steps} steps`); const el = document.getElementById('pg-progress'); if (el) el.textContent = pg.progress; })
      : builtinPath(pg.doc, opts);
    const list = loadPaths();
    list.unshift(path);
    try { savePaths(list); } catch (e) { throw new Error(L('אין מספיק מקום לשמור את המסלול בדפדפן.', 'Not enough room to save the path in this browser.')); }
    pg.viewId = path.id;
    pg.doc = null;
    history.replaceState(null, '', '?id=' + path.id);
    toast(L('המסלול נוצר! עברו עליו ופרסמו לכיתה.', 'Path created! Review it, then publish it to the class.'));
  } catch (e) {
    if (e && e.name === 'APIUserAbortError') pg.error = L('היצירה בוטלה.', 'Generation was cancelled.');
    else pg.error = engine === 'ai' ? aiErrorText(e) : (e.message || String(e));
  }
  pg.generating = false; pg.abort = null;
  renderPage();
  if (pg.viewId) document.getElementById('path-map')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function cancelGenerate() { if (pg.abort) pg.abort(); }

function saveKey() {

/* ================= Progress ================= */
function progressOf(pathId, name) {
  const all = load(PATH_PROGRESS_KEY, {});
  return (all[pathId] && all[pathId][name]) || { done: {}, xp: 0 };
}
function recordProgress(pathId, name, node, score, total) {
  const all = load(PATH_PROGRESS_KEY, {});
  const mine = ((all[pathId] = all[pathId] || {})[name] = all[pathId][name] || { done: {}, xp: 0 });
  const prev = mine.done[node.id];
  const xp = NODE_KIND[node.type].xp;
  if (!prev) mine.xp += xp;
  if (!prev || score / Math.max(1, total) > prev.score / Math.max(1, prev.total)) mine.done[node.id] = { score, total, at: new Date().toISOString() };
  mine.last = new Date().toISOString();
  save(PATH_PROGRESS_KEY, all);
  return prev ? 0 : xp;
}
// Which steps a student can open: everything done, plus the first one not done
function nodeStates(p, name) {
  const done = progressOf(p.id, name).done;
  let open = true;
  const states = {};
  allNodes(p).forEach(n => {
    if (done[n.id]) states[n.id] = 'done';
    else if (open) { states[n.id] = 'current'; open = false; }
    else states[n.id] = 'locked';
  });
  return states;
}

/* ================= Player ================= */
function startPlay(pathId, nodeId, preview) {
  const p = findPath(pathId);
  const n = p && allNodes(p).find(x => x.id === nodeId);
  if (!n) return;
  pg.edit = null;
  const order = n.questions.map((_, i) => i);
  pg.play = { pathId, nodeId, preview, step: n.type === 'lesson' ? 'learn' : 'q', order, pos: 0, qi: order[0] || 0, picked: null, right: 0, earned: 0, missed: new Set() };
  renderPage();
}
function previewPath(id) {
  const p = findPath(id);
  if (p) startPlay(id, allNodes(p)[0].id, true);
}
function playPick(i) {
  const pl = pg.play;
  if (pl.picked !== null) return;
  pl.picked = i;
  const n = allNodes(findPath(pl.pathId)).find(x => x.id === pl.nodeId);
  if (i === n.questions[pl.qi].answer) { if (!pl.missed.has(pl.qi)) pl.right++; }
  else {
    pl.missed.add(pl.qi);
    if (n.type === 'lesson') pl.order.push(pl.qi);   // learn it: the question comes back later
  }
  renderPage();
}
function playNext() {
  const pl = pg.play;
  const p = findPath(pl.pathId);
  const n = allNodes(p).find(x => x.id === pl.nodeId);
  if (pl.step === 'learn') { pl.step = n.questions.length ? 'q' : 'end'; pl.pos = 0; pl.qi = pl.order[0]; pl.picked = null; }
  else if (pl.step === 'q') {
    if (pl.pos + 1 < pl.order.length) { pl.pos++; pl.qi = pl.order[pl.pos]; pl.picked = null; }
    else pl.step = 'end';
  }
  if (pl.step === 'end' && !pl.finished) {
    pl.finished = true;
    const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
    pl.passed = n.type === 'lesson' || !n.questions.length || pl.right / n.questions.length >= D.pass;
    if (pl.passed && !pl.preview) pl.earned = recordProgress(p.id, currentUserName(), n, pl.right, n.questions.length);
  }
  renderPage();
}
function playRetry() { const pl = pg.play; startPlay(pl.pathId, pl.nodeId, pl.preview); }
function closePlay() { pg.play = null; renderPage(); }
function player() {
  const pl = pg.play;
  const p = findPath(pl.pathId);
  const n = p && allNodes(p).find(x => x.id === pl.nodeId);
  if (!n) { pg.play = null; return ''; }
  const kind = NODE_KIND[n.type];
  const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
  const steps = (n.type === 'lesson' ? 1 : 0) + pl.order.length;
  const doneSteps = pl.step === 'learn' ? 0 : pl.step === 'end' ? steps : (n.type === 'lesson' ? 1 : 0) + pl.pos + (pl.picked !== null ? 1 : 0);
  let body = '', foot = '';
  if (pl.step === 'learn') {
    body = `
      <div class="play-kicker">${kind.icon} ${L(kind.he, kind.en)}</div>
      <h2 class="display w8 x2 play-title" dir="auto">${esc(n.title)}</h2>
      <p class="play-text" dir="auto">${esc(n.summary)}</p>
      ${n.points.length ? `<div class="play-points">${n.points.map((pt, i) => `<div class="play-point" style="animation-delay:${i * 80}ms" dir="auto"><span>💡</span><span>${esc(pt)}</span></div>`).join('')}</div>` : ''}`;
    foot = `<button class="play-btn go" onclick="playNext()">${n.questions.length ? L('לתרגול', 'Practice') : L('סיום', 'Finish')}</button>`;
  } else if (pl.step === 'q') {
    const q = n.questions[pl.qi];
    const answered = pl.picked !== null;
    const right = answered && pl.picked === q.answer;
    body = `
      <div class="play-kicker">${pl.pos >= n.questions.length ? '🔁 ' + L('עוד ניסיון', 'Once more') : L(`שאלה ${pl.pos + 1} מתוך ${n.questions.length}`, `Question ${pl.pos + 1} of ${n.questions.length}`)}</div>
      <h2 class="display w8 xl play-q" dir="auto">${esc(q.question).replace('_____', '<span class="blank">_____</span>')}</h2>
      <div class="play-options ${q.kind === 'true_false' ? 'tf' : ''}">
        ${q.options.map((o, i) => `<button class="play-opt ${answered ? (i === q.answer ? 'right' : i === pl.picked ? 'wrong' : 'dim') : ''}" onclick="playPick(${i})" ${answered ? 'disabled' : ''} dir="auto">
          <span class="play-key">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}
      </div>`;
    foot = answered
      ? `<div class="play-feedback ${right ? 'right' : 'wrong'}" role="status">
          <div><b>${right ? '🎉 ' + L('מצוין!', 'Great!') : '💡 ' + L('התשובה הנכונה:', 'Correct answer:') + ' ' + esc(q.options[q.answer])}</b>
          ${!right && n.type === 'lesson' ? `<div class="xs mt-1">${L('נחזור לשאלה הזו בסוף השיעור.', 'We’ll come back to this one at the end of the lesson.')}</div>` : ''}
          ${q.explanation && !right ? `<div class="sm mt-1" dir="auto">${esc(q.explanation)}</div>` : ''}</div>
          <button class="play-btn ${right ? 'go' : 'bad'}" onclick="playNext()">${L('המשך', 'Continue')}</button>
        </div>`
      : `<span class="xs muted">${L('בחרו תשובה (אפשר גם להקיש 1–' + q.options.length + ')', 'Choose an answer (or press 1–' + q.options.length + ')')}</span>`;
  } else {
    const total = n.questions.length;
    const pct = total ? Math.round((pl.right / total) * 100) : 100;
    body = `
      <div class="play-end">
        <div class="play-trophy">${pl.passed ? (n.type === 'boss' ? '🏆' : '⭐') : '💪'}</div>
        <h2 class="display w8 x2">${pl.passed ? (n.type === 'boss' ? L('סיימתם את המסלול!', 'You finished the path!') : L('כל הכבוד!', 'Well done!')) : L('כמעט!', 'Almost!')}</h2>
        ${total ? `<p class="play-text">${L(`ענית נכון על ${pl.right} מתוך ${total} (${pct}%)`, `You got ${pl.right} of ${total} right (${pct}%)`)}</p>` : ''}
        ${!pl.passed ? `<p class="sm muted">${L(`כדי לעבור צריך ${Math.round(D.pass * 100)}%. נסו שוב!`, `You need ${Math.round(D.pass * 100)}% to pass. Try again!`)}</p>` : ''}
        ${pl.earned ? `<div class="play-xp">⚡ +${pl.earned} XP</div>` : ''}
        ${pl.preview ? `<p class="xs muted mt-2">${L('תצוגה מקדימה – ההתקדמות לא נשמרת', 'Preview – progress is not saved')}</p>` : ''}
      </div>`;
    const next = (() => { const list = allNodes(p); const i = list.findIndex(x => x.id === n.id); return list[i + 1]; })();
    foot = pl.passed
      ? `${next && (pl.preview || state.role === 'student') ? `<button class="play-btn soft" onclick="closePlay()">${L('למפה', 'Back to the map')}</button><button class="play-btn go" onclick="startPlay('${p.id}', '${next.id}', ${pl.preview})">${L('לשלב הבא', 'Next step')} ›</button>` : `<button class="play-btn go" onclick="closePlay()">${L('למפה', 'Back to the map')}</button>`}`
      : `<button class="play-btn soft" onclick="closePlay()">${L('למפה', 'Back to the map')}</button><button class="play-btn go" onclick="playRetry()">${L('ניסיון חוזר', 'Try again')}</button>`;
  }
  return `
  <div class="play-bg" role="dialog" aria-modal="true" aria-label="${esc(n.title)}">
    <div class="play">
      <div class="play-top">
        <button class="icon-btn" style="width:2.25rem;height:2.25rem" onclick="closePlay()" aria-label="${L('סגירה', 'Close')}">${ICONS.close}</button>
        <div class="play-bar"><span style="width:${(doneSteps / Math.max(1, steps)) * 100}%"></span></div>
        ${pl.preview ? `<span class="pbadge">👀 ${L('תצוגה', 'Preview')}</span>` : ''}
      </div>
      <div class="play-body">${body}</div>
      <div class="play-foot">${foot}</div>
    </div>
  </div>`;
}
document.addEventListener('keydown', e => {
  if (!pg.play) { if (e.key === 'Escape' && pg.edit) { pg.edit = null; renderPage(); } return; }
  if (e.key === 'Escape') { closePlay(); return; }
  const pl = pg.play;
  if (pl.step === 'q' && pl.picked === null && /^[1-6]$/.test(e.key)) {
    const n = allNodes(findPath(pl.pathId)).find(x => x.id === pl.nodeId);
    if (Number(e.key) <= n.questions[pl.qi].options.length) playPick(Number(e.key) - 1);
  } else if (e.key === 'Enter' && (pl.step === 'learn' || pl.picked !== null)) {
    if (pl.step === 'end') return;
    playNext();
  }
});

/* ================= Building a path by hand (the default) ================= */
function blankNode(type, n) {
  const k = NODE_KIND[type];
  const D = DIFFICULTY[pg.difficulty] || DIFFICULTY.medium;
  return { id: newId('n'), type, title: type === 'lesson' ? L(`שיעור ${n}`, `Lesson ${n}`) : L(k.he, k.en), minutes: Math.max(3, Math.round(D.lessonMin * k.weight)),
    summary: '', points: [], questions: type === 'lesson' ? [] : [{ kind: 'choice', question: '', options: ['', '', ''], answer: 0, explanation: '' }] };
}
function createManualPath() {
  const title = (document.getElementById('pm-title') || {}).value || pg.title;
  if (!title.trim()) { pg.error = L('נא לתת שם למסלול.', 'Please name the path.'); renderPage(); return; }
  const path = {
    id: newId('path'), title: title.trim(), classId: pg.classId || state.classId, difficulty: pg.difficulty, targetMinutes: Number(pg.minutes) || 60,
    engine: 'manual', source: null, createdAt: new Date().toISOString(), by: CURRENT_USER.id, byName: currentUserName(), published: false,
    units: [{ id: newId('u'), title: L('יחידה 1', 'Unit 1'), nodes: [blankNode('lesson', 1)] }],
  };
  const list = loadPaths(); list.unshift(path); savePaths(list);
  pg.viewId = path.id; pg.title = ''; pg.error = '';
  history.replaceState(null, '', '?id=' + path.id);
  pg.edit = { nodeId: path.units[0].nodes[0].id, fresh: true };
  renderPage();
  toast(L('המסלול נוצר – כתבו את השיעור הראשון', 'Path created – write the first lesson'));
}
function addNode(unitId, type) {
  let created = null;
  updatePath(pg.viewId, p => {
    const u = p.units.find(x => x.id === unitId);
    if (!u) return;
    const lessons = p.units.flatMap(x => x.nodes).filter(n => n.type === 'lesson').length;
    created = blankNode(type, lessons + 1);
    // the final challenge always stays last
    const bossAt = u.nodes.findIndex(n => n.type === 'boss');
    if (type !== 'boss' && bossAt >= 0) u.nodes.splice(bossAt, 0, created); else u.nodes.push(created);
  });
  if (created) { pg.edit = { nodeId: created.id, fresh: true }; renderPage(); }
}
function addUnit() {
  let id = null;
  updatePath(pg.viewId, p => {
    const u = { id: newId('u'), title: L(`יחידה ${p.units.length + 1}`, `Unit ${p.units.length + 1}`), nodes: [blankNode('lesson', p.units.flatMap(x => x.nodes).filter(n => n.type === 'lesson').length + 1)] };
    // keep the final challenge at the very end: it moves to the new last unit
    const last = p.units[p.units.length - 1];
    const boss = last && last.nodes.find(n => n.type === 'boss');
    if (boss) { last.nodes = last.nodes.filter(n => n !== boss); u.nodes.push(boss); }
    p.units.push(u);
    id = u.nodes[0].id;
  });
  pg.edit = { nodeId: id, fresh: true };
  renderPage();
}
function moveNode(dir) {
  updatePath(pg.viewId, p => {
    const flat = p.units.flatMap(u => u.nodes.map(n => ({ n, u })));
    const i = flat.findIndex(x => x.n.id === pg.edit.nodeId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= flat.length) return;
    const a = flat[i], b = flat[j];
    if (a.u === b.u) { const ia = a.u.nodes.indexOf(a.n), ib = a.u.nodes.indexOf(b.n); [a.u.nodes[ia], a.u.nodes[ib]] = [a.u.nodes[ib], a.u.nodes[ia]]; }
    else { a.u.nodes = a.u.nodes.filter(n => n !== a.n); if (dir > 0) b.u.nodes.unshift(a.n); else b.u.nodes.push(a.n); }
    p.units = p.units.filter(u => u.nodes.length);
  });
  renderPage();
}
function setNodeType(type) {
  editNode(n => { n.type = type; if (type !== 'lesson' && !n.questions.length) n.questions.push({ kind: 'choice', question: '', options: ['', '', ''], answer: 0, explanation: '' }); });
  renderPage();
}
function setQuestionKind(qi, kind) {
  editNode(n => {
    const q = n.questions[qi];
    q.kind = kind;

function pathProblems(p) {
  const out = [];
  const nodes = allNodes(p);
  if (!nodes.length) out.push({ text: L('במסלול אין שלבים.', 'The path has no steps.') });
  nodes.forEach(n => {
    const name = `"${n.title || L(NODE_KIND[n.type].he, NODE_KIND[n.type].en)}"`;
    if (!n.title.trim()) out.push({ id: n.id, text: L(`לשלב אין כותרת.`, `A step has no title.`) });
    if (n.type === 'lesson' && !n.summary.trim() && !n.points.length) out.push({ id: n.id, text: L(`${name}: חסר הסבר או נקודות מפתח.`, `${name}: add an explanation or key points.`) });
    if (n.type !== 'lesson' && !n.questions.length) out.push({ id: n.id, text: L(`${name}: אין שאלות.`, `${name}: has no questions.`) });
    n.questions.forEach((q, i) => {
      const filled = q.options.filter(o => String(o).trim());
      if (!q.question.trim() || filled.length < 2 || !String(q.options[q.answer] || '').trim()) out.push({ id: n.id, text: L(`${name}, שאלה ${i + 1}: חסרים שאלה, תשובות או תשובה נכונה.`, `${name}, question ${i + 1}: missing the question, options or the right answer.`) });
    });
  });
  return out;
}

async function addMaterials(input) {

  input.value = '';
  const total = pa.draft.materials.reduce((n, f) => n + (f.size || 0), 0) + picked.reduce((n, f) => n + f.size, 0);
  if (total > MAX_UPLOAD_BYTES) { pa.error = L('החומרים גדולים מדי (עד 2MB בגרסת ההדגמה).', 'The material is too large (2 MB max in this demo).'); renderPage(); return; }

function saveAssignment() {
  const d = pa.draft;

  if (!d.title.trim()) { pa.error = L('נא לתת שם למטלה.', 'Please give the assignment a title.'); renderPage(); return; }
  if (!d.allowText && !d.allowFiles) { pa.error = L('צריך לאפשר לפחות דרך הגשה אחת: טקסט או קבצים.', 'Allow at least one way to hand in: text or files.'); renderPage(); return; }
  const list = allAssignments().slice();
  const fields = { title: d.title.trim(), classId: d.classId, type: d.type, dueDate: d.dueDate, dueTime: d.dueTime, points: Math.max(1, Number(d.points) || 100),
    instructions: d.instructions.trim(), allowText: d.allowText, allowFiles: d.allowFiles, materials: d.materials };

  if (pa.editId) {

    Object.assign(a, fields);
  } else {

    list.unshift(created);

function deleteAssignment(id) {
  const a = allAssignments().find(x => x.id === id);
  if (!a || !confirm(L(`למחוק את "${localize(a.title)}"? הגשות שעוד לא נבדקו יימחקו.`, `Delete "${a.title}"? Ungraded submissions are deleted too.`))) return;
  saveAssignments(allAssignments().filter(x => x.id !== id));
  saveReviewQueue(reviewQueue().filter(q => q.assignmentId !== id));
  renderPage();
}
function dueAt(a) { return new Date(`${a.dueDate.slice(0, 10)}T${a.dueTime || '23:59'}:00`); }
function assignmentStats(a) {
  const pending = reviewQueue().filter(q => q.assignmentId === a.id);
  const graded = load('cs-graded', []).filter(g => g.assignmentId === a.id);
  const handed = new Set(pending.map(q => q.student).concat(graded.map(g => g.student)));
  const roster = classRoster();
  const late = dueAt(a) < new Date();
  return { roster: roster.length, handed: handed.size, graded: new Set(graded.map(g => g.student)).size, toGrade: pending.length, missing: late ? roster.filter(n => !handed.has(n)).length : 0, late };
}

  const list = mine.filter(a => pa.filter === 'all' || (pa.filter === 'open' ? dueAt(a) >= now : dueAt(a) < now));

  return `

  return `
  <div class="card r-3xl p-5" data-collapse="path-list" data-collapse-default="open">

    <div class="grid g-1 md-2" style="gap:0.75rem">${mine.map(p => pathCard(p, true)).join('')}</div>
  </div>`;
}
function pathCard(p, teacher) {
  const nodes = allNodes(p);
  const cls = classes.find(c => c.id === p.classId);
  const done = teacher ? null : Object.keys(progressOf(p.id, currentUserName()).done).length;
  const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
  return `

    <div class="pcard-icon" style="background:${(cls || {}).color || '#7C3AED'}22">${subjectIcon(cls)}</div>
    <div class="flex-1 min-w-0">
      <div class="sm w8 truncate" dir="auto">${esc(p.title)}</div>
      <div class="xs muted truncate">${className(cls)} · ${D.icon} ${L(D.he, D.en)} · ⏱ ${fmtMinutes(totalMinutes(p))} · ${nodes.length} ${L('שלבים', 'steps')}</div>
      ${teacher ? `<span class="pbadge mt-1 ${p.published ? 'live' : 'draft'}">${p.published ? '● ' + L('פורסם', 'Published') : L('טיוטה', 'Draft')}</span>`
        : `<span class="bar mt-2" style="height:0.45rem"><span style="width:${(done / nodes.length) * 100}%;background:#58CC02"></span></span><span class="xs muted">${done}/${nodes.length} ${L('שלבים', 'steps')}</span>`}

  </a>`;
}
function openPath(id) {
  pg.viewId = id; pg.edit = null;
  history.replaceState(null, '', '?id=' + id);
  renderPage();
  document.getElementById('path-map')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function studentPaths() { return loadPaths().filter(p => p.published); }

/* ================= Page ================= */
function renderPage() {
  const teacher = state.role === 'teacher';
  const p = pg.viewId ? findPath(pg.viewId) : null;
  if (pg.viewId && (!p || (!teacher && !p.published))) pg.viewId = null;
  let html = `
    <div>
      <h1 class="display w8 x2">🗺️ ${L('מסלולי למידה', 'Learning paths')}</h1>
      <p class="sm muted mt-1">${teacher ? L('מסלולים בסגנון דואולינגו, שנבנים מחומר הלימוד שלך.', 'Duolingo-style paths built from your own material.') : L('מסלולים שהמורים פרסמו לך. כל שלב פותח את הבא.', 'Paths your teachers published for you. Each step unlocks the next.')}</p>
    </div>`;
  if (teacher) {
    html = `
    <div class="flex items-end justify-between wrap gap-3">
      <div>
        <h1 class="display w8 x2">🧑‍🏫 ${L('עבודות הכיתה', 'Classwork')}</h1>
        <p class="sm muted mt-1">${L('מטלות להגשה ומסלולי למידה לכיתות שלך.', 'Assignments to hand in and learning paths for your classes.')}</p>
      </div>
      <div class="seg cw-tabs" role="tablist">
        <button role="tab" aria-selected="${pg.tab === 'assignments'}" class="${pg.tab === 'assignments' ? 'on' : ''}" onclick="pg.tab='assignments';history.replaceState(null,'',location.pathname);renderPage()">📝 ${L('מטלות להגשה', 'Assignments')}</button>
        <button role="tab" aria-selected="${pg.tab === 'paths'}" class="${pg.tab === 'paths' ? 'on' : ''}" onclick="pg.tab='paths';renderPage()">🗺️ ${L('מסלולי למידה', 'Learning paths')}</button>
      </div>
    </div>`;
    if (pg.tab === 'assignments') html += assignmentsTab();
    else {
      html += newPathCard() + teacherList();
      if (p) html += `<div class="grid g-1 lg-3" style="gap:1.25rem;align-items:start"><div class="lg-span-2 col" style="gap:1rem">${pathHeader(p, true)}${problemsCard()}<div class="card r-3xl p-5">${pathMap(p, 'teacher')}<p class="xs muted text-center mt-3">✏️ ${L('לחצו על שלב כדי לערוך אותו', 'Click a step to edit it')}</p></div></div>${studentProgress(p)}</div>`;
    }
  } else {
    const list = studentPaths();
    html += list.length
      ? `<div class="grid g-1 md-2" style="gap:0.75rem">${list.map(x => pathCard(x, false)).join('')}</div>`
      : `<div class="card r-3xl p-6 text-center"><div style="font-size:2.5rem">🗺️</div><p class="sm muted mt-2">${L('עדיין אין מסלולים. כשהמורה יפרסם/תפרסם מסלול, הוא יופיע כאן.', 'No paths yet. When your teacher publishes one, it shows up here.')}</p></div>`;
    if (p) {
      const pr = progressOf(p.id, currentUserName());
      html += pathHeader(p, false) + `<div class="card r-3xl p-5"><div class="flex justify-center mb-3"><span class="pbadge">⚡ ${pr.xp} XP</span></div>${pathMap(p, 'student')}</div>`;
    }
  }
  document.getElementById('main').innerHTML = html + (teacher && p && pg.edit ? nodeEditor(p) : '') + (teacher && p && pg.unitEdit ? unitEditor(p) : '') + (pg.play ? player() : '');
  document.body.classList.toggle('jmodal-open', !!pg.play);
}

const SAMPLE_EN = `# Membranes and Transport

# The Cell Membrane
The cell membrane is a thin, flexible barrier that surrounds every cell and separates its interior from the outside environment. It is made mainly of a phospholipid bilayer. Each phospholipid has a hydrophilic head that faces water and two hydrophobic tails that point inward. Proteins are embedded in the bilayer. Channel proteins form pores, and carrier proteins change shape to move specific molecules. The fluid mosaic model describes the membrane as a moving sea of lipids with proteins floating in it like tiles of a mosaic.

# Passive Transport
Passive transport moves substances across the membrane without using energy from the cell. In diffusion, particles move from an area of high concentration to an area of low concentration until equilibrium is reached. Small nonpolar molecules such as oxygen and carbon dioxide diffuse directly through the phospholipid bilayer. Facilitated diffusion uses channel or carrier proteins to help larger or charged molecules such as glucose and ions cross the membrane.

# Osmosis
Osmosis is the diffusion of water across a selectively permeable membrane. Water moves toward the side with the higher concentration of solutes. In a hypotonic solution a cell gains water and may swell. In a hypertonic solution a cell loses water and shrinks; in plant cells this is called plasmolysis. In an isotonic solution there is no net movement of water.

# Active Transport
Active transport moves substances against their concentration gradient and requires energy in the form of ATP. The sodium-potassium pump moves three sodium ions out of the cell and two potassium ions into the cell. Endocytosis brings large particles into the cell by folding the membrane around them to form a vesicle. Exocytosis releases substances such as hormones and enzymes when a vesicle fuses with the cell membrane.`;
