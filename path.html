  renderPage();
}
function usePasted() {
  const text = (document.getElementById('pg-paste') || {}).value || '';
  if (text.trim().split(/\s+/).length < 30) { pg.error = L('הדביקו לפחות כמה פסקאות (30 מילים ומעלה).', 'Paste at least a few paragraphs (30+ words).'); renderPage(); return; }
  pg.doc = buildDoc(L('טקסט מודבק', 'Pasted text'), 'text', textBlocks(text));
  pg.title = pg.doc.title === L('טקסט מודבק', 'Pasted text') ? (pg.doc.sections[0] ? pg.doc.sections[0].title.replace('…', '') : '') : pg.doc.title;
  pg.error = '';
  renderPage();
}
function useSample() {
  pg.doc = buildDoc(isHe() ? 'דוגמה – קרומים.txt' : 'sample – membranes.txt', 'text', textBlocks(isHe() ? SAMPLE_HE : SAMPLE_EN));
  pg.title = pg.doc.title;
  pg.error = '';
  renderPage();
}

/* ================= Built-in generator (no AI) =================
   Lessons come from the document's sections, key points from its most informative
   sentences, and questions from the same sentences: fill-in-the-blank on key terms,
   true/false (a key term swapped for another one), and "which statement is true". */
const STOP = new Set(('the and for are but not you all any can had her was one our out day get has him his how man new now old see two way who boy did its let put say she too use that with have this will your from they know want been good much some time very when come here just like long make many more only over such take than them well were what which their there these those other into also each most then because about would could should through between while where after before being does both same such using used make made upon within without first second third ' +
  'של את על עם זה זו זאת הוא היא הם הן גם כל לא אם כי או אבל רק יש אין כמו כך מה מי אשר שבו שבה כאשר כדי בין לפי אל עד לכל עוד מאוד היה היו להיות יותר פחות בכל ידי אחד אחת שני שתי').split(/\s+/));
function tokens(text) { return (text.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || []); }
function keyTerms(doc) {
  const freq = {}, spread = {};
  doc.sections.forEach(s => {
    const seen = new Set();
    tokens(s.text).forEach(w => {
      const k = w.toLowerCase();
      if (k.length < 4 || STOP.has(k) || /^\d+$/.test(k)) return;
      freq[k] = (freq[k] || 0) + 1;
      if (!seen.has(k)) { seen.add(k); spread[k] = (spread[k] || 0) + 1; }
    });
  });
  const n = doc.sections.length || 1;
  // frequent, but concentrated in few sections → specific to a topic
  return Object.keys(freq).map(k => ({ k, score: freq[k] * Math.log(1 + n / spread[k]) * Math.min(1.6, k.length / 6) }))
    .sort((a, b) => b.score - a.score).slice(0, 80).map(x => x.k);
}
function rngFrom(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, rand) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sentenceScore(s, terms) { const t = tokens(s).map(w => w.toLowerCase()); return t.filter(w => terms.has(w)).length / Math.sqrt(t.length || 1); }
// The word as it appears in the sentence (keeps capitals)
function termIn(sentence, term) { return tokens(sentence).find(w => w.toLowerCase() === term) || null; }

// Words that appear after "the / a / of …" somewhere are probably nouns – better blanks and wrong options
function nounishTerms(doc) {
  const set = new Set();
  doc.sections.forEach(s => {
    const t = tokens(s.text);
    t.forEach((w, i) => { if (i && /^(the|a|an|of|called|these|this|its|their|each|every)$/i.test(t[i - 1])) set.add(w.toLowerCase()); });
  });
  return set;
}
function makeQuestions(sentences, allTerms, D, count, rand, opts) {
  const termSet = new Set(allTerms);
  const nounish = opts.nounish || new Set();
  const shapeScore = (a, b) => (nounish.has(a) === nounish.has(b) ? 2 : 0) + (a.slice(-2) === b.slice(-2) ? 1 : 0) + ((a.endsWith('s') === b.endsWith('s')) ? 1 : 0) - Math.abs(a.length - b.length) * 0.15;
  const pool = shuffled(sentences, rand);
  const out = [];
  const used = new Set();
  const usedTerms = new Set();          // vary the answers inside one step
  const tf = isHe() ? ['נכון', 'לא נכון'] : ['True', 'False'];
  const distract = (term, sentence, n) => shuffled(allTerms.filter(t => t !== term && !sentence.toLowerCase().includes(t)), rand)
    .map(t => ({ t, score: shapeScore(term, t) + rand() * 0.8 })).sort((a, b) => b.score - a.score).slice(0, n).map(x => x.t);
  for (let i = 0; i < pool.length * 2 && out.length < count; i++) {
    const s = pool[i % pool.length];
    if (used.has(s)) continue;
    const terms = tokens(s).map(w => w.toLowerCase()).filter(w => termSet.has(w));
    if (!terms.length) continue;
    const fresh = terms.filter(t => !usedTerms.has(t));
    const term = (fresh.length ? fresh : terms).sort((a, b) => (nounish.has(b) - nounish.has(a)) || (allTerms.indexOf(a) - allTerms.indexOf(b)))[0];
    usedTerms.add(term);
    const word = termIn(s, term);
    const kindRoll = rand();
    const wantTf = opts.allowTf && (D === DIFFICULTY.easy ? kindRoll < 0.4 : D === DIFFICULTY.medium ? kindRoll < 0.3 : kindRoll < 0.15);
    const wantStatement = !wantTf && D === DIFFICULTY.hard && kindRoll > 0.65;
    if (wantTf) {
      const swap = distract(term, s, 1)[0];
      const isFalse = swap && rand() < 0.5;
      const shown = isFalse ? s.replace(word, swap) : s;
      out.push({ kind: 'true_false', question: L(`נכון או לא נכון? ${shown}`, `True or false? ${shown}`), options: tf, answer: isFalse ? 1 : 0, explanation: s });
    } else if (wantStatement) {
      const others = pool.filter(x => x !== s && !used.has(x)).slice(0, 6);
      const wrong = [];
      others.forEach(o => {
        if (wrong.length >= D.options - 1) return;
        const oterms = tokens(o).map(w => w.toLowerCase()).filter(w => termSet.has(w));
        const ot = oterms[0];
        const swap = ot && distract(ot, o, 1)[0];
        if (swap) wrong.push(o.replace(termIn(o, ot), swap));
      });
      if (wrong.length < 2) continue;
      const options = shuffled([s, ...wrong], rand);
      out.push({ kind: 'choice', question: L('איזה משפט נכון?', 'Which statement is true?'), options, answer: options.indexOf(s), explanation: s });
    } else {
      const wrong = distract(term, s, D.options - 1);
      if (wrong.length < 2) continue;
      const options = shuffled([term, ...wrong], rand);
      out.push({ kind: 'fill_blank', question: s.replace(word, '_____'), options, answer: options.indexOf(term), explanation: s });
    }
    used.add(s);
  }
  return out;
}

function builtinPath(doc, opts) {
  const D = DIFFICULTY[opts.difficulty];
  const rand = rngFrom(seedHash(doc.name + opts.difficulty + opts.minutes));
  const terms = keyTerms(doc);
  const termSet = new Set(terms);
  const nounish = nounishTerms(doc);
  const sections = doc.sections.filter(s => s.sentences.length >= 2);
  if (!sections.length) throw new Error(L('אין מספיק טקסט כדי לבנות מסלול.', 'There is not enough text to build a path.'));
  // how many lessons fit in the time: lesson + its share of practice/checkpoints
  const perLesson = D.lessonMin * 1.55;
  let target = Math.max(2, Math.round(opts.minutes / perLesson));
  // sections → lessons: split long sections, merge short ones
  let lessons = sections.map(s => ({ title: s.title, sentences: s.sentences.slice(), section: s.index }));
  while (lessons.length < target) {
    const i = lessons.reduce((best, l, j) => (l.sentences.length > lessons[best].sentences.length ? j : best), 0);
    const l = lessons[i];
    if (l.sentences.length < 4) break;
    const half = Math.ceil(l.sentences.length / 2);
    lessons.splice(i, 1,
      { title: l.title.replace(/ \(\d\)$/, '') + ' (1)', sentences: l.sentences.slice(0, half), section: l.section },
      { title: l.title.replace(/ \(\d\)$/, '') + ' (2)', sentences: l.sentences.slice(half), section: l.section });
  }
  while (lessons.length > target && lessons.length > 2) {
    let i = 0;
    for (let j = 1; j < lessons.length - 1; j++) if (lessons[j].sentences.length + lessons[j + 1].sentences.length < lessons[i].sentences.length + lessons[i + 1].sentences.length) i = j;
    const a = lessons[i], b = lessons[i + 1];
    lessons.splice(i, 2, { title: `${a.title} · ${b.title}`.replace(/…/g, ''), sentences: a.sentences.concat(b.sentences), section: a.section });
  }
  // units of 2–4 lessons, keeping lessons of one section together where possible
  const unitSize = Math.max(2, Math.min(4, Math.round(lessons.length / Math.max(1, Math.round(lessons.length / 3)))));
  const unitGroups = [];
  lessons.forEach(l => {
    const last = unitGroups[unitGroups.length - 1];
    if (!last || last.length >= unitSize) unitGroups.push([l]); else last.push(l);
  });
  const units = unitGroups.map((group, ui) => {
    const nodes = [];
    group.forEach((l, li) => {
      const ranked = l.sentences.map((s, i) => ({ s, i, score: sentenceScore(s, termSet) })).sort((a, b) => b.score - a.score);
      const points = ranked.slice(0, D.points).sort((a, b) => a.i - b.i).map(x => x.s);
      nodes.push({
        id: newId('n'), type: 'lesson', title: l.title, summary: l.sentences.slice(0, 2).join(' '), points,
        questions: makeQuestions(l.sentences, terms, D, Math.max(2, D.questions - 1), rand, { allowTf: true, nounish }),
      });
      // a practice round after every two lessons (and after the last lesson of the unit)
      if (li % 2 === 1 || li === group.length - 1) {
        const covered = group.slice(Math.max(0, li - 1), li + 1).flatMap(x => x.sentences);
        nodes.push({ id: newId('n'), type: 'practice', title: L('תרגול', 'Practice'), summary: L('בואו נבדוק מה זכרתם.', 'Let’s check what you remember.'), points: [],
          questions: makeQuestions(covered, terms, D, D.questions, rand, { allowTf: true, nounish }) });
      }
    });
    nodes.push({ id: newId('n'), type: 'checkpoint', title: L(`נקודת ביקורת ${ui + 1}`, `Checkpoint ${ui + 1}`), summary: L('חזרה על כל היחידה.', 'A review of the whole unit.'), points: [],
      questions: makeQuestions(group.flatMap(x => x.sentences), terms, D, D.questions + 2, rand, { allowTf: false, nounish }) });
    const unitTitle = [...new Set(group.map(l => sections.find(s => s.index === l.section).title))].join(' · ').replace(/…/g, '');
    return { id: newId('u'), title: unitTitle, nodes };
  });
  units[units.length - 1].nodes.push({ id: newId('n'), type: 'boss', title: L('האתגר המסכם', 'Final challenge'), summary: L('כל החומר – הראו מה למדתם!', 'Everything – show what you learned!'), points: [],
    questions: makeQuestions(lessons.flatMap(l => l.sentences), terms, D, D.questions + 4, rand, { allowTf: false, nounish }) });
  return finishPath({ title: opts.title || doc.title, units }, opts, 'builtin');
}

// Fills in ids, spreads the minutes over the steps, drops broken questions
function finishPath(raw, opts, engine) {
  const units = (raw.units || []).map(u => ({
    id: u.id || newId('u'), title: String(u.title || '').trim(),
    nodes: (u.nodes || []).filter(n => NODE_KIND[n.type]).map(n => ({
      id: n.id || newId('n'), type: n.type, title: String(n.title || NODE_KIND[n.type].en).trim(), minutes: Number(n.minutes) || 0,
      summary: String(n.summary || '').trim(), points: (n.points || []).map(String).filter(Boolean),
      questions: (n.questions || []).filter(q => Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length)
        .map(q => ({ kind: q.kind || 'choice', question: String(q.question), options: q.options.map(String), answer: q.answer, explanation: String(q.explanation || '') })),
    })).filter(n => n.type === 'lesson' || n.questions.length),
  })).filter(u => u.nodes.length);
  if (!units.length) throw new Error(L('לא נוצרו שלבים מהמסמך.', 'No steps could be made from the document.'));
  // minutes: keep the AI's split if it is close to the target, otherwise spread by step type
  const nodes = units.flatMap(u => u.nodes);
  const given = nodes.reduce((s, n) => s + n.minutes, 0);
  if (!given || Math.abs(given - opts.minutes) / opts.minutes > 0.2) {
    const w = nodes.reduce((s, n) => s + NODE_KIND[n.type].weight, 0);
    nodes.forEach(n => { n.minutes = Math.max(2, Math.round(opts.minutes * NODE_KIND[n.type].weight / w)); });
  }
  return {
    id: newId('path'), title: String(raw.title || opts.title || '').trim() || L('מסלול חדש', 'New path'), classId: opts.classId,
    difficulty: opts.difficulty, targetMinutes: opts.minutes, engine, source: opts.source,
    createdAt: new Date().toISOString(), by: CURRENT_USER.id, byName: currentUserName(), published: false, units,
  };
}

/* ================= Claude (AI) generator ================= */
const PATH_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['title', 'units'],
  properties: {
    title: { type: 'string' },
    units: { type: 'array', items: {
      type: 'object', additionalProperties: false, required: ['title', 'nodes'],
      properties: {
        title: { type: 'string' },
        nodes: { type: 'array', items: {
          type: 'object', additionalProperties: false, required: ['type', 'title', 'minutes', 'summary', 'points', 'questions'],
          properties: {
            type: { type: 'string', enum: ['lesson', 'practice', 'checkpoint', 'boss'] },
            title: { type: 'string' },
            minutes: { type: 'integer' },
            summary: { type: 'string' },
            points: { type: 'array', items: { type: 'string' } },
            questions: { type: 'array', items: {
              type: 'object', additionalProperties: false, required: ['kind', 'question', 'options', 'answer', 'explanation'],
              properties: {
                kind: { type: 'string', enum: ['choice', 'true_false', 'fill_blank'] },
                question: { type: 'string' },
                options: { type: 'array', items: { type: 'string' } },
                answer: { type: 'integer', description: '0-based index of the correct option' },
                explanation: { type: 'string' },
              },
            } },
          },
        } },
      },
    } },
  },
};
const PATH_SYSTEM = `You turn a teacher's learning material into a game-like learning path for school students, in the style of Duolingo: a sequence of units, each made of small steps the student completes in order.

Step types:
- "lesson": teaches one idea. "summary" is 2-4 short sentences in the student's voice level; "points" are the key facts to remember (short, one idea each); include 1-3 quick questions on exactly what the lesson taught.
- "practice": comes after every one or two lessons; no new content ("points" empty); questions mix what those lessons taught.
- "checkpoint": closes every unit; reviews the whole unit with more questions.
- "boss": exactly one, the very last step of the last unit; reviews the whole path and is the hardest.

Rules:
- Use only facts that appear in the document. Do not invent facts, numbers or names. If the document is thin, make fewer, shorter steps rather than padding.
- Order the steps so each builds on the previous ones, following the document's own order.
- Every question must be answerable from the steps before it. Exactly one option is correct; wrong options are plausible but clearly wrong to someone who learned the material. "answer" is the 0-based index of the correct option; vary its position.
- "true_false": options are exactly the words for True and False in the document's language, in that order. "fill_blank": the question is a sentence with "_____" where the missing word or phrase goes. "choice": a normal multiple-choice question.
- "explanation" says briefly why the answer is right, so a student who got it wrong learns from it.
- "minutes" is the realistic time for a student to finish the step; the minutes of all steps together should match the requested total.
- Write everything in the same language as the document (Hebrew documents → Hebrew path).
- Unit titles name the topic of the unit; step titles are short (2-6 words).`;

function aiInstructions(opts) {
  const D = DIFFICULTY[opts.difficulty];
  const level = {
    easy: 'Easy: short, simple steps; focus on the main ideas and definitions; mostly recall questions; 3 options per multiple-choice question.',
    medium: 'Medium: cover the main ideas and the important details; mix recall and understanding questions; 4 options.',
    hard: 'Hard: cover the material in depth, including details and connections between ideas; include application and "which statement is true" questions; 4 options; plausible distractors.',
  }[opts.difficulty];
  return `Build the learning path from the document above.
- Path title: ${opts.title ? JSON.stringify(opts.title) : 'choose a short title from the document'}.
- Difficulty: ${level}
- Total time for the whole path: about ${opts.minutes} minutes (a lesson takes about ${D.lessonMin} minutes at this level). Choose the number of units and steps to fit this time.
- Practice, checkpoint and boss steps: about ${D.questions}, ${D.questions + 2} and ${D.questions + 4} questions.`;
}

async function aiPath(doc, opts, onProgress) {
  await loadScriptOnce(VENDOR + 'anthropic-sdk.min.js');
  const Anthropic = window.AnthropicSDK.default;
  const proxy = aiProxyUrl();
  // The school's proxy holds the real key; otherwise the teacher's own key from this browser
  const client = new Anthropic(proxy
    ? { apiKey: 'set-by-school-proxy', baseURL: proxy, dangerouslyAllowBrowser: true }
    : { apiKey: aiKey(), dangerouslyAllowBrowser: true });
  const content = [];
  if (doc.kind === 'pdf' && doc.pdfBase64) {
    // Claude reads the PDF itself – layout, tables and scanned pages included
    content.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: doc.pdfBase64 }, title: doc.name });
  } else {
    const text = doc.sections.map(s => `## ${s.title}\n${s.text}`).join('\n\n');
    if (text.length > AI_MAX_CHARS) throw new Error(L(`המסמך ארוך מדי (${Math.round(text.length / 1000)} אלף תווים). חלקו אותו לכמה מסמכים, כל אחד עד ${AI_MAX_CHARS / 1000} אלף.`, `The document is too long (${Math.round(text.length / 1000)}k characters). Split it into documents of up to ${AI_MAX_CHARS / 1000}k each.`));
    content.push({ type: 'text', text: `<document name="${doc.name.replace(/"/g, '')}">\n${doc.title ? '# ' + doc.title + '\n\n' : ''}${text}\n</document>` });
  }
  content.push({ type: 'text', text: aiInstructions(opts) });
  const stream = client.beta.messages.stream({
    model: AI_MODEL,
    max_tokens: 64000,
    betas: ['server-side-fallback-2026-07-01'],
    fallbacks: 'default',                       // if a safety check declines, another model finishes the request
    thinking: { type: 'adaptive' },
    output_config: { effort: 'high', format: { type: 'json_schema', schema: PATH_SCHEMA } },
    system: PATH_SYSTEM,
    messages: [{ role: 'user', content }],
  });
  pg.abort = () => stream.abort();
  let written = '';
  stream.on('text', delta => {
    written += delta;
    onProgress({ units: (written.match(/"nodes"\s*:/g) || []).length, steps: (written.match(/"type"\s*:\s*"(lesson|practice|checkpoint|boss)"/g) || []).length });
  });
  const msg = await stream.finalMessage();
  if (msg.stop_reason === 'refusal') throw new Error(L('המודל סירב ליצור מסלול מהמסמך הזה.', 'The model declined to build a path from this document.'));
  if (msg.stop_reason === 'max_tokens') throw new Error(L('המסלול יצא ארוך מדי. נסו זמן קצר יותר או מסמך קצר יותר.', 'The path came out too long. Try a shorter time or a shorter document.'));
  const json = msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
  let raw;
  try { raw = JSON.parse(json); } catch (e) { throw new Error(L('התשובה של ה־AI לא הייתה תקינה. נסו שוב.', 'The AI’s answer was not valid. Try again.')); }
  return finishPath(raw, opts, 'ai');
}
function aiErrorText(e) {
  const A = window.AnthropicSDK && window.AnthropicSDK.default;
  if (A && e instanceof A.AuthenticationError) return L('מפתח ה־API לא תקין.', 'The API key is not valid.');
  if (A && e instanceof A.PermissionDeniedError) return L('למפתח אין הרשאה לשימוש במודל.', 'This key is not allowed to use the model.');
  if (A && e instanceof A.RateLimitError) return L('יותר מדי בקשות כרגע. נסו שוב בעוד דקה.', 'Too many requests right now. Try again in a minute.');
  if (A && e instanceof A.BadRequestError) return L('הבקשה נדחתה: ', 'The request was rejected: ') + (e.message || '');
  if (A && e instanceof A.APIConnectionError) return L('אין חיבור לשירות ה־AI. בדקו את האינטרנט.', 'Can’t reach the AI service. Check the internet connection.');
  if (A && e instanceof A.APIError) return L(`שגיאה בשירות ה־AI (${e.status}).`, `AI service error (${e.status}).`);
  return e && e.message ? e.message : String(e);
}

async function generate() {
  if (!pg.doc || pg.generating) return;
  const engine = pg.engine || (aiReady() ? 'ai' : 'builtin');
  const opts = { title: pg.title.trim(), classId: pg.classId || state.classId, difficulty: pg.difficulty, minutes: Math.max(10, Math.min(1200, Number(pg.minutes) || 60)),
    source: { name: pg.doc.name, kind: pg.doc.kind, words: pg.doc.words } };
  if (engine === 'ai' && !aiReady()) { pg.error = L('כדי להשתמש ב־AI צריך מפתח API או שרת AI של בית הספר.', 'The AI engine needs an API key or the school’s AI server.'); renderPage(); return; }
  if (engine === 'builtin' && !pg.doc.words) { pg.error = L('המחולל המובנה צריך מסמך עם טקסט.', 'The built-in generator needs a document with text.'); renderPage(); return; }
  pg.generating = true; pg.error = ''; pg.progress = '';
  renderPage();
  try {
    const path = engine === 'ai'
      ? await aiPath(pg.doc, opts, p => { pg.progress = L(`כותב… ${p.units} יחידות · ${p.steps} שלבים`, `Writing… ${p.units} units · ${p.steps} steps`); const el = document.getElementById('pg-progress'); if (el) el.textContent = pg.progress; })
      : builtinPath(pg.doc, opts);
    const list = loadPaths();
    list.unshift(path);
    try { savePaths(list); } catch (e) { throw new Error(L('אין מספיק מקום לשמור את המסלול בדפדפן.', 'Not enough room to save the path in this browser.')); }
    pg.viewId = path.id;
    pg.doc = null;
    history.replaceState(null, '', '?id=' + path.id);
    toast(L('המסלול נוצר! עברו עליו ופרסמו לכיתה.', 'Path created! Review it, then publish it to the class.'));
  } catch (e) {
    if (e && e.name === 'APIUserAbortError') pg.error = L('היצירה בוטלה.', 'Generation was cancelled.');
    else pg.error = engine === 'ai' ? aiErrorText(e) : (e.message || String(e));
  }
  pg.generating = false; pg.abort = null;
  renderPage();
  if (pg.viewId) document.getElementById('path-map')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function cancelGenerate() { if (pg.abort) pg.abort(); }

function saveKey() {
  const v = (document.getElementById('pg-key') || {}).value || '';
  if (!/^sk-ant-/.test(v.trim())) { toast(L('מפתח Anthropic מתחיל ב־sk-ant-', 'An Anthropic key starts with sk-ant-')); return; }
  save(AI_KEY_STORE, v.trim());
  pg.engine = 'ai';
  renderPage();
  toast(L('המפתח נשמר בדפדפן הזה בלבד', 'Key saved in this browser only'));
}
function removeKey() { save(AI_KEY_STORE, ''); if (pg.engine === 'ai') pg.engine = null; renderPage(); }

/* ================= Progress ================= */
function progressOf(pathId, name) {
  const all = load(PATH_PROGRESS_KEY, {});
  return (all[pathId] && all[pathId][name]) || { done: {}, xp: 0 };
}
function recordProgress(pathId, name, node, score, total) {
  const all = load(PATH_PROGRESS_KEY, {});
  const mine = ((all[pathId] = all[pathId] || {})[name] = all[pathId][name] || { done: {}, xp: 0 });
  const prev = mine.done[node.id];
  const xp = NODE_KIND[node.type].xp;
  if (!prev) mine.xp += xp;
  if (!prev || score / Math.max(1, total) > prev.score / Math.max(1, prev.total)) mine.done[node.id] = { score, total, at: new Date().toISOString() };
  mine.last = new Date().toISOString();
  save(PATH_PROGRESS_KEY, all);
  return prev ? 0 : xp;
}
// Which steps a student can open: everything done, plus the first one not done
function nodeStates(p, name) {
  const done = progressOf(p.id, name).done;
  let open = true;
  const states = {};
  allNodes(p).forEach(n => {
    if (done[n.id]) states[n.id] = 'done';
    else if (open) { states[n.id] = 'current'; open = false; }
    else states[n.id] = 'locked';
  });
  return states;
}

/* ================= The map (Duolingo-style) ================= */
function pathMap(p, mode) {
  const states = mode === 'student' ? nodeStates(p, currentUserName()) : {};
  let k = 0;
  return `
  <div class="pmap" id="path-map">
    ${p.units.map((u, ui) => {
      const color = UNIT_COLORS[ui % UNIT_COLORS.length];
      const mins = u.nodes.reduce((s, n) => s + n.minutes, 0);
      return `
      <section class="punit" style="--u:${color}">
        <div class="punit-head">
          <div class="min-w-0">
            <div class="xs w8 punit-kicker">${L(`יחידה ${ui + 1}`, `Unit ${ui + 1}`)}</div>
            <h3 class="display w8 base" dir="auto">${esc(u.title)}</h3>
          </div>
          <span class="xs w7 punit-meta">⏱ ${fmtMinutes(mins)} · ${u.nodes.length} ${L('שלבים', 'steps')}</span>
        </div>
        <div class="pnodes">
          ${u.nodes.map(n => {
            const kind = NODE_KIND[n.type];
            const st = mode === 'student' ? states[n.id] : 'open';
            const off = ZIGZAG[k++ % ZIGZAG.length] * (isHe() ? -1 : 1);
            const click = mode === 'student' ? (st === 'locked' ? `toast(L('השלימו קודם את השלבים הקודמים', 'Finish the earlier steps first'))` : `startPlay('${p.id}', '${n.id}', false)`) : `openEditor('${n.id}')`;
            return `
            <div class="pnode-wrap ${st === 'current' ? 'has-start' : ''}" style="transform:translateX(${off}rem)">
              ${st === 'current' ? `<div class="pnode-start">${L('התחילו!', 'START')}</div>` : ''}
              <button class="pnode ${n.type} ${st}" onclick="${click}" aria-label="${esc(kind[isHe() ? 'he' : 'en'])}: ${esc(n.title)}${st === 'locked' ? ' – ' + L('נעול', 'locked') : st === 'done' ? ' – ' + L('הושלם', 'done') : ''}">
                <span class="pnode-icon">${st === 'locked' ? '🔒' : st === 'done' ? '⭐' : kind.icon}</span>
              </button>
              <div class="pnode-label"><span class="xs w7" dir="auto">${esc(n.title)}</span><span class="xs muted">${L(kind.he, kind.en)} · ${fmtMinutes(n.minutes)}</span></div>
            </div>`;
          }).join('')}
        </div>
      </section>`;
    }).join('')}
  </div>`;
}

        <span class="flex-1 min-w-0">
          <span class="flex items-center justify-between gap-2"><span class="sm w7 truncate">${esc(localize(r.name))}</span><span class="mono xs w7">${r.done}/${total}</span></span>
          <span class="bar mt-1" style="height:0.4rem"><span style="width:${(r.done / total) * 100}%;background:${r.done === total ? '#58CC02' : 'var(--primary)'}"></span></span>
          <span class="xs muted">${r.done === total ? '🏆 ' + L('סיים/ה את המסלול', 'Finished the path') : r.done ? L('עכשיו: ', 'Now: ') + esc(r.cur.title) : L('עוד לא התחיל/ה', 'Not started')}${r.xp ? ` · ⚡ ${r.xp} XP` : ''}${r.last ? ' · ' + fmtDate(r.last, { day: 'numeric', month: 'short' }) : ''}</span>
        </span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- Editing one step ---------- */
function openEditor(nodeId) { pg.edit = { nodeId }; renderPage(); }
function editNode(fn) {
  updatePath(pg.viewId, p => p.units.forEach(u => u.nodes.forEach(n => { if (n.id === pg.edit.nodeId) fn(n, u, p); })));
}
function nodeField(field, value) { editNode(n => { n[field] = field === 'minutes' ? Math.max(1, Number(value) || 1) : field === 'points' ? value.split('\n').map(s => s.trim()).filter(Boolean) : value; }); }
function questionField(qi, field, value, oi) {
  editNode(n => {
    const q = n.questions[qi];
    if (field === 'option') q.options[oi] = value;
    else if (field === 'answer') q.answer = Number(value);
    else q[field] = value;
  });
}
function addOption(qi) { editNode(n => { if (n.questions[qi].options.length < 6) n.questions[qi].options.push(''); }); renderPage(); }
function removeOption(qi, oi) { editNode(n => { const q = n.questions[qi]; if (q.options.length <= 2) return; q.options.splice(oi, 1); if (q.answer >= q.options.length) q.answer = 0; else if (q.answer > oi) q.answer--; }); renderPage(); }
function addQuestion() { editNode(n => n.questions.push({ kind: 'choice', question: '', options: ['', '', ''], answer: 0, explanation: '' })); renderPage(); }
function removeQuestion(qi) { editNode(n => n.questions.splice(qi, 1)); renderPage(); }
function deleteNode() {
  if (!confirm(L('למחוק את השלב?', 'Delete this step?'))) return;
  updatePath(pg.viewId, p => { p.units.forEach(u => { u.nodes = u.nodes.filter(n => n.id !== pg.edit.nodeId); }); p.units = p.units.filter(u => u.nodes.length); });
  pg.edit = null;
  renderPage();
}
function nodeEditor(p) {
  const n = allNodes(p).find(x => x.id === pg.edit.nodeId);
  if (!n) { pg.edit = null; return ''; }
  const kind = NODE_KIND[n.type];
  return `
  <div class="modal-bg" onmousedown="if(event.target===this){pg.edit=null;renderPage()}">
    <div class="card r-3xl pedit fade-up" role="dialog" aria-label="${L('עריכת שלב', 'Edit step')}">
      <div class="pedit-head">
        <h3 class="display w8 lg">${kind.icon} ${L(kind.he, kind.en)}</h3>
        <button class="icon-btn" style="width:2rem;height:2rem" onclick="pg.edit=null;renderPage()" aria-label="${L('סגירה', 'Close')}">${ICONS.close}</button>
      </div>
      <div class="pedit-body">
        <div class="grid g-1 sm-3" style="gap:0.75rem">
          <div class="sm-span-2"><label class="label" for="pe-title">${L('כותרת', 'Title')}</label><input id="pe-title" class="input" dir="auto" value="${esc(n.title)}" onchange="nodeField('title', this.value)"></div>
          <div><label class="label" for="pe-min">${L('דקות', 'Minutes')}</label><input id="pe-min" class="input" type="number" min="1" value="${n.minutes}" onchange="nodeField('minutes', this.value)"></div>
        </div>
        <div><label class="label" for="pe-sum">${L('הסבר', 'Explanation')}</label><textarea id="pe-sum" class="input" dir="auto" rows="3" onchange="nodeField('summary', this.value)">${esc(n.summary)}</textarea></div>
        ${n.type === 'lesson' ? `<div><label class="label" for="pe-pts">${L('נקודות מפתח (שורה לכל נקודה)', 'Key points (one per line)')}</label><textarea id="pe-pts" class="input" dir="auto" rows="4" onchange="nodeField('points', this.value)">${esc(n.points.join('\n'))}</textarea></div>` : ''}
        <div>
          <div class="flex items-center justify-between mb-2"><span class="label" style="margin:0">${L('שאלות', 'Questions')} (${n.questions.length})</span><button class="btn btn-soft btn-sm" onclick="addQuestion()">＋ ${L('שאלה', 'Question')}</button></div>
          <div class="col" style="gap:0.75rem">
            ${n.questions.map((q, qi) => `
            <div class="pq">
              <div class="flex items-start gap-2">
                <span class="mono xs w8 muted mt-2">${qi + 1}</span>
                <textarea class="input flex-1" dir="auto" rows="2" aria-label="${L('שאלה', 'Question')} ${qi + 1}" onchange="questionField(${qi}, 'question', this.value)">${esc(q.question)}</textarea>
                <button class="del-q" onclick="removeQuestion(${qi})" aria-label="${L('מחיקת שאלה', 'Delete question')}">×</button>
              </div>
              <div class="col mt-2" style="gap:0.375rem">
                ${q.options.map((o, oi) => `
                <label class="pq-opt ${q.answer === oi ? 'right' : ''}">
                  <input type="radio" name="ans-${qi}" ${q.answer === oi ? 'checked' : ''} onchange="questionField(${qi}, 'answer', ${oi});renderPage()" aria-label="${L('התשובה הנכונה', 'Correct answer')}">
                  <input class="input input-sm flex-1" dir="auto" value="${esc(o)}" onchange="questionField(${qi}, 'option', this.value, ${oi})" aria-label="${L('אפשרות', 'Option')} ${oi + 1}">
                  ${q.options.length > 2 ? `<button class="del-q" onclick="event.preventDefault();removeOption(${qi}, ${oi})" aria-label="${L('מחיקת אפשרות', 'Delete option')}">×</button>` : ''}
                </label>`).join('')}
                ${q.options.length < 6 ? `<button class="link-btn xs" style="align-self:flex-start" onclick="addOption(${qi})">＋ ${L('אפשרות', 'Option')}</button>` : ''}
              </div>
              <input class="input input-sm mt-2" dir="auto" value="${esc(q.explanation)}" placeholder="${L('הסבר לתשובה (לא חובה)', 'Why this is the answer (optional)')}" onchange="questionField(${qi}, 'explanation', this.value)">
            </div>`).join('') || `<p class="xs muted">${L('אין שאלות בשלב הזה.', 'No questions in this step.')}</p>`}
          </div>
        </div>
      </div>
      <div class="pedit-foot">
        <button class="link-btn xs" style="color:#F43F5E;margin-inline-end:auto" onclick="deleteNode()">${L('מחיקת השלב', 'Delete step')}</button>
        <button class="btn btn-soft" onclick="startPlay('${p.id}', '${n.id}', true)">▶ ${L('ניסיון', 'Try it')}</button>
        <button class="btn btn-primary" onclick="pg.edit=null;renderPage()">${L('סיום', 'Done')}</button>
      </div>
    </div>
  </div>`;
}

/* ================= Player ================= */
function startPlay(pathId, nodeId, preview) {
  const p = findPath(pathId);
  const n = p && allNodes(p).find(x => x.id === nodeId);
  if (!n) return;
  pg.edit = null;
  const order = n.questions.map((_, i) => i);
  pg.play = { pathId, nodeId, preview, step: n.type === 'lesson' ? 'learn' : 'q', order, pos: 0, qi: order[0] || 0, picked: null, right: 0, earned: 0, missed: new Set() };
  renderPage();
}
function previewPath(id) {
  const p = findPath(id);
  if (p) startPlay(id, allNodes(p)[0].id, true);
}
function playPick(i) {
  const pl = pg.play;
  if (pl.picked !== null) return;
  pl.picked = i;
  const n = allNodes(findPath(pl.pathId)).find(x => x.id === pl.nodeId);
  if (i === n.questions[pl.qi].answer) { if (!pl.missed.has(pl.qi)) pl.right++; }
  else {
    pl.missed.add(pl.qi);
    if (n.type === 'lesson') pl.order.push(pl.qi);   // learn it: the question comes back later
  }
  renderPage();
}
function playNext() {
  const pl = pg.play;
  const p = findPath(pl.pathId);
  const n = allNodes(p).find(x => x.id === pl.nodeId);
  if (pl.step === 'learn') { pl.step = n.questions.length ? 'q' : 'end'; pl.pos = 0; pl.qi = pl.order[0]; pl.picked = null; }
  else if (pl.step === 'q') {
    if (pl.pos + 1 < pl.order.length) { pl.pos++; pl.qi = pl.order[pl.pos]; pl.picked = null; }
    else pl.step = 'end';
  }
  if (pl.step === 'end' && !pl.finished) {
    pl.finished = true;
    const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
    pl.passed = n.type === 'lesson' || !n.questions.length || pl.right / n.questions.length >= D.pass;
    if (pl.passed && !pl.preview) pl.earned = recordProgress(p.id, currentUserName(), n, pl.right, n.questions.length);
  }
  renderPage();
}
function playRetry() { const pl = pg.play; startPlay(pl.pathId, pl.nodeId, pl.preview); }
function closePlay() { pg.play = null; renderPage(); }
function player() {
  const pl = pg.play;
  const p = findPath(pl.pathId);
  const n = p && allNodes(p).find(x => x.id === pl.nodeId);
  if (!n) { pg.play = null; return ''; }
  const kind = NODE_KIND[n.type];
  const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
  const steps = (n.type === 'lesson' ? 1 : 0) + pl.order.length;
  const doneSteps = pl.step === 'learn' ? 0 : pl.step === 'end' ? steps : (n.type === 'lesson' ? 1 : 0) + pl.pos + (pl.picked !== null ? 1 : 0);
  let body = '', foot = '';
  if (pl.step === 'learn') {
    body = `
      <div class="play-kicker">${kind.icon} ${L(kind.he, kind.en)}</div>
      <h2 class="display w8 x2 play-title" dir="auto">${esc(n.title)}</h2>
      <p class="play-text" dir="auto">${esc(n.summary)}</p>
      ${n.points.length ? `<div class="play-points">${n.points.map((pt, i) => `<div class="play-point" style="animation-delay:${i * 80}ms" dir="auto"><span>💡</span><span>${esc(pt)}</span></div>`).join('')}</div>` : ''}`;
    foot = `<button class="play-btn go" onclick="playNext()">${n.questions.length ? L('לתרגול', 'Practice') : L('סיום', 'Finish')}</button>`;
  } else if (pl.step === 'q') {
    const q = n.questions[pl.qi];
    const answered = pl.picked !== null;
    const right = answered && pl.picked === q.answer;
    body = `
      <div class="play-kicker">${pl.pos >= n.questions.length ? '🔁 ' + L('עוד ניסיון', 'Once more') : L(`שאלה ${pl.pos + 1} מתוך ${n.questions.length}`, `Question ${pl.pos + 1} of ${n.questions.length}`)}</div>
      <h2 class="display w8 xl play-q" dir="auto">${esc(q.question).replace('_____', '<span class="blank">_____</span>')}</h2>
      <div class="play-options ${q.kind === 'true_false' ? 'tf' : ''}">
        ${q.options.map((o, i) => `<button class="play-opt ${answered ? (i === q.answer ? 'right' : i === pl.picked ? 'wrong' : 'dim') : ''}" onclick="playPick(${i})" ${answered ? 'disabled' : ''} dir="auto">
          <span class="play-key">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}
      </div>`;
    foot = answered
      ? `<div class="play-feedback ${right ? 'right' : 'wrong'}" role="status">
          <div><b>${right ? '🎉 ' + L('מצוין!', 'Great!') : '💡 ' + L('התשובה הנכונה:', 'Correct answer:') + ' ' + esc(q.options[q.answer])}</b>
          ${!right && n.type === 'lesson' ? `<div class="xs mt-1">${L('נחזור לשאלה הזו בסוף השיעור.', 'We’ll come back to this one at the end of the lesson.')}</div>` : ''}
          ${q.explanation && !right ? `<div class="sm mt-1" dir="auto">${esc(q.explanation)}</div>` : ''}</div>
          <button class="play-btn ${right ? 'go' : 'bad'}" onclick="playNext()">${L('המשך', 'Continue')}</button>
        </div>`
      : `<span class="xs muted">${L('בחרו תשובה (אפשר גם להקיש 1–' + q.options.length + ')', 'Choose an answer (or press 1–' + q.options.length + ')')}</span>`;
  } else {
    const total = n.questions.length;
    const pct = total ? Math.round((pl.right / total) * 100) : 100;
    body = `
      <div class="play-end">
        <div class="play-trophy">${pl.passed ? (n.type === 'boss' ? '🏆' : '⭐') : '💪'}</div>
        <h2 class="display w8 x2">${pl.passed ? (n.type === 'boss' ? L('סיימתם את המסלול!', 'You finished the path!') : L('כל הכבוד!', 'Well done!')) : L('כמעט!', 'Almost!')}</h2>
        ${total ? `<p class="play-text">${L(`ענית נכון על ${pl.right} מתוך ${total} (${pct}%)`, `You got ${pl.right} of ${total} right (${pct}%)`)}</p>` : ''}
        ${!pl.passed ? `<p class="sm muted">${L(`כדי לעבור צריך ${Math.round(D.pass * 100)}%. נסו שוב!`, `You need ${Math.round(D.pass * 100)}% to pass. Try again!`)}</p>` : ''}
        ${pl.earned ? `<div class="play-xp">⚡ +${pl.earned} XP</div>` : ''}
        ${pl.preview ? `<p class="xs muted mt-2">${L('תצוגה מקדימה – ההתקדמות לא נשמרת', 'Preview – progress is not saved')}</p>` : ''}
      </div>`;
    const next = (() => { const list = allNodes(p); const i = list.findIndex(x => x.id === n.id); return list[i + 1]; })();
    foot = pl.passed
      ? `${next && (pl.preview || state.role === 'student') ? `<button class="play-btn soft" onclick="closePlay()">${L('למפה', 'Back to the map')}</button><button class="play-btn go" onclick="startPlay('${p.id}', '${next.id}', ${pl.preview})">${L('לשלב הבא', 'Next step')} ›</button>` : `<button class="play-btn go" onclick="closePlay()">${L('למפה', 'Back to the map')}</button>`}`
      : `<button class="play-btn soft" onclick="closePlay()">${L('למפה', 'Back to the map')}</button><button class="play-btn go" onclick="playRetry()">${L('ניסיון חוזר', 'Try again')}</button>`;
  }
  return `
  <div class="play-bg" role="dialog" aria-modal="true" aria-label="${esc(n.title)}">
    <div class="play">
      <div class="play-top">
        <button class="icon-btn" style="width:2.25rem;height:2.25rem" onclick="closePlay()" aria-label="${L('סגירה', 'Close')}">${ICONS.close}</button>
        <div class="play-bar"><span style="width:${(doneSteps / Math.max(1, steps)) * 100}%"></span></div>
        ${pl.preview ? `<span class="pbadge">👀 ${L('תצוגה', 'Preview')}</span>` : ''}
      </div>
      <div class="play-body">${body}</div>
      <div class="play-foot">${foot}</div>
    </div>
  </div>`;
}
document.addEventListener('keydown', e => {
  if (!pg.play) { if (e.key === 'Escape' && pg.edit) { pg.edit = null; renderPage(); } return; }
  if (e.key === 'Escape') { closePlay(); return; }
  const pl = pg.play;
  if (pl.step === 'q' && pl.picked === null && /^[1-6]$/.test(e.key)) {
    const n = allNodes(findPath(pl.pathId)).find(x => x.id === pl.nodeId);
    if (Number(e.key) <= n.questions[pl.qi].options.length) playPick(Number(e.key) - 1);
  } else if (e.key === 'Enter' && (pl.step === 'learn' || pl.picked !== null)) {
    if (pl.step === 'end') return;
    playNext();
  }
});

      <button class="${engine === 'ai' ? 'on' : ''}" onclick="pg.engine='ai';renderPage()" aria-pressed="${engine === 'ai'}">
        <span class="sm w8">✨ Claude AI</span>
        <span class="xs muted">${L('קורא את המסמך ומנסח הסברים ושאלות איכותיים. כ־1–3 דקות.', 'Reads the document and writes clear explanations and good questions. About 1–3 minutes.')}</span>
      </button>
      <button class="${engine === 'builtin' ? 'on' : ''}" onclick="pg.engine='builtin';renderPage()" aria-pressed="${engine === 'builtin'}">
        <span class="sm w8">⚙️ ${L('מחולל מובנה', 'Built-in generator')}</span>
        <span class="xs muted">${L('בלי AI ובלי חיבור: בונה מהמשפטים של המסמך שאלות השלמה ונכון/לא נכון. מיידי.', 'No AI, works offline: builds fill-in and true/false questions from the document’s own sentences. Instant.')}</span>
      </button>
    </div>
    ${engine === 'ai' ? aiSetup() : ''}

    <div class="flex items-center gap-3 mt-5 wrap">
      <button class="btn btn-primary display" onclick="generate()" ${!d || pg.generating || pg.extracting ? 'disabled' : ''}>
        ${pg.generating ? `<span class="spinner"></span> ${engine === 'ai' ? L('Claude בונה את המסלול…', 'Claude is building the path…') : L('בונה…', 'Building…')}` : `✨ ${L('יצירת המסלול', 'Create the path')}`}
      </button>
      ${pg.generating && engine === 'ai' ? `<span id="pg-progress" class="xs muted">${esc(pg.progress || L('קורא את המסמך…', 'Reading the document…'))}</span><button class="link-btn xs" onclick="cancelGenerate()">${L('ביטול', 'Cancel')}</button>` : ''}
      ${!d ? `<span class="xs muted">${L('קודם בחרו חומר לימוד', 'Add your material first')}</span>` : ''}
    </div>
  </div>`;
}
function aiSetup() {
  if (aiProxyUrl()) return `<p class="xs mt-2" style="color:#059669">✅ ${L('מחובר לשרת ה־AI של בית הספר.', 'Connected to the school’s AI server.')}</p>`;
  if (aiKey()) return `<p class="xs mt-2 flex items-center gap-2 wrap"><span style="color:#059669">✅ ${L('משתמש במפתח ה־API ששמרת בדפדפן הזה', 'Using the API key saved in this browser')} (…${esc(aiKey().slice(-4))})</span><button class="link-btn xs" onclick="removeKey()">${L('הסרת המפתח', 'Remove key')}</button></p>`;
  return `
  <div class="pkey mt-3">
    <p class="xs">${L('כדי להשתמש ב־Claude צריך חיבור לשירות. שתי אפשרויות:', 'Claude needs a connection to the service. Two options:')}</p>
    <ol class="xs mt-1" style="padding-inline-start:1.1rem;line-height:1.6">
      <li>${L('<b>לכל בית הספר (מומלץ):</b> המנהל/ת מגדיר/ה שרת AI אחד, והמורים לא צריכים מפתח. ', '<b>For the whole school (recommended):</b> the admin sets up one AI server and teachers need no key. ')}<a class="link-btn xs" href="https://github.com/coolschooliltamar-bit/coolschool/blob/main/ai-proxy/README.md" target="_blank" rel="noopener">${L('מדריך', 'Guide')}</a></li>
      <li>${L('<b>לניסיון:</b> מפתח API אישי מ־console.anthropic.com. הוא נשמר רק בדפדפן הזה ונשלח רק ל־Anthropic.', '<b>To try it:</b> a personal API key from console.anthropic.com. It is kept only in this browser and sent only to Anthropic.')}</li>
    </ol>
    <div class="flex gap-2 mt-2"><input id="pg-key" type="password" class="input input-sm flex-1" autocomplete="off" placeholder="sk-ant-…" aria-label="${L('מפתח API', 'API key')}"><button class="btn btn-soft btn-sm" onclick="saveKey()">${L('שמירה', 'Save')}</button></div>
  </div>`;
}

/* ================= Lists ================= */
function teacherList() {
  const mine = loadPaths().filter(p => p.by === CURRENT_USER.id || teacherClasses().some(c => c.id === p.classId));
  if (!mine.length) return '';
  return `
  <div class="card r-3xl p-5" data-collapse="path-list" data-collapse-default="open">
    <h3 class="display w8 lg mb-3">🗺️ ${L('המסלולים שלי', 'My paths')}</h3>
    <div class="grid g-1 md-2" style="gap:0.75rem">${mine.map(p => pathCard(p, true)).join('')}</div>
  </div>`;
}
function pathCard(p, teacher) {
  const nodes = allNodes(p);
  const cls = classes.find(c => c.id === p.classId);
  const done = teacher ? null : Object.keys(progressOf(p.id, currentUserName()).done).length;
  const D = DIFFICULTY[p.difficulty] || DIFFICULTY.medium;
  return `
  <a class="pcard ${pg.viewId === p.id ? 'on' : ''}" href="?id=${p.id}" onclick="event.preventDefault();openPath('${p.id}')">
    <div class="pcard-icon" style="background:${(cls || {}).color || '#7C3AED'}22">${subjectIcon(cls)}</div>
    <div class="flex-1 min-w-0">
      <div class="sm w8 truncate" dir="auto">${esc(p.title)}</div>
      <div class="xs muted truncate">${className(cls)} · ${D.icon} ${L(D.he, D.en)} · ⏱ ${fmtMinutes(totalMinutes(p))} · ${nodes.length} ${L('שלבים', 'steps')}</div>
      ${teacher ? `<span class="pbadge mt-1 ${p.published ? 'live' : 'draft'}">${p.published ? '● ' + L('פורסם', 'Published') : L('טיוטה', 'Draft')}</span>`
        : `<span class="bar mt-2" style="height:0.45rem"><span style="width:${(done / nodes.length) * 100}%;background:#58CC02"></span></span><span class="xs muted">${done}/${nodes.length} ${L('שלבים', 'steps')}</span>`}
    </div>
  </a>`;
}
function openPath(id) {
  pg.viewId = id; pg.edit = null;
  history.replaceState(null, '', '?id=' + id);
  renderPage();
  document.getElementById('path-map')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function studentPaths() { return loadPaths().filter(p => p.published); }

/* ================= Page ================= */
function renderPage() {
  const teacher = state.role === 'teacher';
  const p = pg.viewId ? findPath(pg.viewId) : null;
  if (pg.viewId && (!p || (!teacher && !p.published))) pg.viewId = null;
  let html = `
    <div>
      <h1 class="display w8 x2">🗺️ ${L('מסלולי למידה', 'Learning paths')}</h1>
      <p class="sm muted mt-1">${teacher ? L('מסלולים בסגנון דואולינגו, שנבנים מחומר הלימוד שלך.', 'Duolingo-style paths built from your own material.') : L('מסלולים שהמורים פרסמו לך. כל שלב פותח את הבא.', 'Paths your teachers published for you. Each step unlocks the next.')}</p>
    </div>`;
  if (teacher) {
    html += generatorCard() + teacherList();
    if (p) html += `<div class="grid g-1 lg-3" style="gap:1.25rem;align-items:start"><div class="lg-span-2 col" style="gap:1rem">${pathHeader(p, true)}<div class="card r-3xl p-5">${pathMap(p, 'teacher')}<p class="xs muted text-center mt-3">✏️ ${L('לחצו על שלב כדי לערוך אותו', 'Click a step to edit it')}</p></div></div>${studentProgress(p)}</div>`;
  } else {
    const list = studentPaths();
    html += list.length
      ? `<div class="grid g-1 md-2" style="gap:0.75rem">${list.map(x => pathCard(x, false)).join('')}</div>`
      : `<div class="card r-3xl p-6 text-center"><div style="font-size:2.5rem">🗺️</div><p class="sm muted mt-2">${L('עדיין אין מסלולים. כשהמורה יפרסם/תפרסם מסלול, הוא יופיע כאן.', 'No paths yet. When your teacher publishes one, it shows up here.')}</p></div>`;
    if (p) {
      const pr = progressOf(p.id, currentUserName());
      html += pathHeader(p, false) + `<div class="card r-3xl p-5"><div class="flex justify-center mb-3"><span class="pbadge">⚡ ${pr.xp} XP</span></div>${pathMap(p, 'student')}</div>`;
    }
  }
  document.getElementById('main').innerHTML = html + (teacher && p && pg.edit ? nodeEditor(p) : '') + (pg.play ? player() : '');
  document.body.classList.toggle('jmodal-open', !!pg.play);
}

/* ---------- Sample material (so the generator can be tried right away) ---------- */
const SAMPLE_EN = `# Membranes and Transport

# The Cell Membrane
The cell membrane is a thin, flexible barrier that surrounds every cell and separates its interior from the outside environment. It is made mainly of a phospholipid bilayer. Each phospholipid has a hydrophilic head that faces water and two hydrophobic tails that point inward. Proteins are embedded in the bilayer. Channel proteins form pores, and carrier proteins change shape to move specific molecules. The fluid mosaic model describes the membrane as a moving sea of lipids with proteins floating in it like tiles of a mosaic.

# Passive Transport
Passive transport moves substances across the membrane without using energy from the cell. In diffusion, particles move from an area of high concentration to an area of low concentration until equilibrium is reached. Small nonpolar molecules such as oxygen and carbon dioxide diffuse directly through the phospholipid bilayer. Facilitated diffusion uses channel or carrier proteins to help larger or charged molecules such as glucose and ions cross the membrane.

# Osmosis
Osmosis is the diffusion of water across a selectively permeable membrane. Water moves toward the side with the higher concentration of solutes. In a hypotonic solution a cell gains water and may swell. In a hypertonic solution a cell loses water and shrinks; in plant cells this is called plasmolysis. In an isotonic solution there is no net movement of water.

# Active Transport
Active transport moves substances against their concentration gradient and requires energy in the form of ATP. The sodium-potassium pump moves three sodium ions out of the cell and two potassium ions into the cell. Endocytosis brings large particles into the cell by folding the membrane around them to form a vesicle. Exocytosis releases substances such as hormones and enzymes when a vesicle fuses with the cell membrane.`;
const SAMPLE_HE = `# קרומים ומעבר חומרים

# קרום התא
קרום התא הוא מחסום דק וגמיש שעוטף כל תא ומפריד בין תוכן התא לסביבה החיצונית. הקרום בנוי בעיקר משכבה כפולה של פוספוליפידים. לכל פוספוליפיד יש ראש הידרופילי שפונה אל המים ושני זנבות הידרופוביים שפונים פנימה. בקרום משובצים חלבונים. חלבוני תעלה יוצרים נקבוביות, וחלבוני נשא משנים את צורתם כדי להעביר מולקולות מסוימות.

# אוסמוזה
אוסמוזה היא דיפוזיה של מים דרך קרום בררני. המים נעים לכיוון הצד שבו ריכוז המומסים גבוה יותר. בתמיסה היפוטונית התא קולט מים ומתנפח. בתמיסה היפרטונית התא מאבד מים ומתכווץ, ובתאי צמח התופעה נקראת פלסמוליזה. בתמיסה איזוטונית אין מעבר נטו של מים.

במעבר פעיל חומרים עוברים נגד מפל הריכוז, והתא משקיע אנרגיה בצורת ATP. משאבת נתרן־אשלגן מוציאה שלושה יוני נתרן מהתא ומכניסה שני יוני אשלגן. באנדוציטוזה התא מכניס חלקיקים גדולים כשהקרום מתקפל סביבם ויוצר שלפוחית. באקסוציטוזה התא משחרר חומרים כמו הורמונים ואנזימים כשהשלפוחית מתמזגת עם הקרום.`;
